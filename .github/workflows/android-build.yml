name: Build Loopling Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'icons/**'
      - 'manifest.webmanifest'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.LOOPLING_KEYSTORE_B64 != '' }}
    steps:
      - name: Check out Loopling
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check bundled Loopling source exists
        run: |
          test -s index.html
          test -s manifest.webmanifest
          test -s privacy.html
      - name: Build installable test APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - name: Check test APK was produced
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: loopling-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Build signed release AAB (only after secrets are configured)
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          LOOPLING_KEYSTORE_B64: ${{ secrets.LOOPLING_KEYSTORE_B64 }}
          LOOPLING_KEYSTORE_PASSWORD: ${{ secrets.LOOPLING_KEYSTORE_PASSWORD }}
          LOOPLING_KEY_ALIAS: ${{ secrets.LOOPLING_KEY_ALIAS }}
          LOOPLING_KEY_PASSWORD: ${{ secrets.LOOPLING_KEY_PASSWORD }}
          LOOPLING_REVIEWER_CODE: ${{ secrets.LOOPLING_REVIEWER_CODE }}
        working-directory: android
        run: |
          set -euo pipefail
          echo "$LOOPLING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/loopling-upload.jks"
          chmod 600 "$RUNNER_TEMP/loopling-upload.jks"
          export LOOPLING_KEYSTORE_PATH="$RUNNER_TEMP/loopling-upload.jks"
          gradle :app:bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/loopling-upload.jks"
      - name: Upload signed Google Play bundle
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: loopling-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
