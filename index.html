<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Loopling</title>
<meta name="theme-color" content="#140f33">
<meta name="description" content="Loopling: swirl your glowing tail into loops to catch stars and cheer up the Gloomies.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>window.LOOPLING_PWA = true;</script>
<style>
/* Layout: one full-bleed night-sky canvas; chunky toy-like buttons float over it in a centred column. */
:root {
  --night: #140f33;
  --night-2: #221a52;
  --ink: #fff8ec;
  --muted: #c4bbef;
  --sun: #ffcf4a;  --sun-deep: #e2862a;
  --mint: #6ff0c2; --mint-deep: #1d9e7b;
  --rose: #ff8fbd; --rose-deep: #d2477f;
  --lilac: #b9a2ff; --lilac-deep: #6f52d6;
  --sky: #8fd6ff;  --sky-deep: #3b84d6;
  --peach: #ffb37a; --peach-deep: #d9703a;
  --panel: rgba(30, 22, 78, .9);
  --line: rgba(255, 255, 255, .16);
  --shade: rgba(8, 5, 26, .55);
  --display: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --body: ui-rounded, "SF Pro Rounded", "Nunito", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--body);
  overflow: hidden; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ui { position: fixed; inset: 0; pointer-events: none; }
.screen {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  gap: 14px; overflow-y: auto; pointer-events: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 18px);
  animation: pop-in .28s cubic-bezier(.2, 1.4, .4, 1);
}
.screen.dim { background: var(--shade); }
.screen.pass { pointer-events: none; }
.screen.pass > * { pointer-events: auto; }
.screen > * { flex-shrink: 0; }
.spacer { flex: 1 1 auto; min-height: 4px; }
@keyframes pop-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }

/* Buttons: a candy-like face sitting on a darker "base" that sinks when pressed. */
.btn {
  --c: var(--sun); --d: var(--sun-deep);
  font: 800 1.15rem/1 var(--display); letter-spacing: .02em; color: #2a1a3d;
  background: linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, white) 0%, var(--c) 55%);
  border: 0; border-radius: 20px; padding: 15px 22px; min-width: 104px; cursor: pointer;
  box-shadow: 0 6px 0 var(--d), 0 10px 18px rgba(0, 0, 0, .35); touch-action: manipulation;
  transition: transform .08s, box-shadow .08s; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--d), 0 4px 10px rgba(0, 0, 0, .3); }
.btn:focus-visible, .icon-btn:focus-visible, .tab:focus-visible, .card:focus-visible, .seg button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn.big { font-size: 1.9rem; padding: 20px 56px; border-radius: 26px; box-shadow: 0 8px 0 var(--d), 0 14px 26px rgba(0, 0, 0, .4); animation: breathe 2.4s ease-in-out infinite; }
.btn.big:active { transform: translateY(7px); animation: none; }
@keyframes breathe { 50% { transform: scale(1.04); } }
.btn.mint { --c: var(--mint); --d: var(--mint-deep); }
.btn.rose { --c: var(--rose); --d: var(--rose-deep); }
.btn.lilac { --c: var(--lilac); --d: var(--lilac-deep); }
.btn.sky { --c: var(--sky); --d: var(--sky-deep); }
.btn.peach { --c: var(--peach); --d: var(--peach-deep); }
.btn.wide { width: min(100%, 330px); font-size: 1.3rem; padding: 16px 20px; }
.btn .tally { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 4px 9px; border-radius: 999px; background: rgba(42, 26, 61, .14); font-size: .85rem; font-variant-numeric: tabular-nums; }
.btn .tally svg { width: .95em; height: .95em; }
.btn.ghost { --c: #5a4b9e; --d: #352a6e; color: var(--ink); }
.btn[disabled] { filter: grayscale(.8) brightness(.7); pointer-events: none; }
.btn svg { width: 1.1em; height: 1.1em; fill: currentColor; }
.icon-btn {
  width: 48px; height: 48px; border-radius: 16px; border: 2px solid var(--line); background: var(--panel);
  color: var(--ink); display: grid; place-items: center; cursor: pointer; position: relative; touch-action: manipulation;
}
.icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
.icon-btn:active { transform: scale(.92); }
.badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--rose); color: #2a1a3d; font: 900 .8rem/20px var(--display); text-align: center; animation: wiggle 1.2s infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg); } 40% { transform: rotate(12deg); } 60% { transform: rotate(-6deg); } }
.row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.bar { width: 100%; max-width: 720px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bar-r { display: flex; gap: 10px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; border-radius: 999px; background: var(--panel);
  border: 2px solid var(--line); color: var(--sun); font: 900 1.1rem/1 var(--display); font-variant-numeric: tabular-nums;
}
.pill svg { width: 20px; height: 20px; fill: var(--sun); }
h2.title { margin: 0; font: 900 clamp(1.7rem, 6vw, 2.4rem)/1.1 var(--display); text-wrap: balance; text-align: center; text-shadow: 0 4px 0 rgba(0, 0, 0, .3); }
.sub { margin: 0; color: var(--muted); font-size: 1rem; text-align: center; max-width: 34ch; line-height: 1.4; text-wrap: balance; text-shadow: 0 1px 2px var(--night), 0 0 10px var(--night); }

/* Menu */
#logo { width: min(92vw, 560px); max-width: 100%; aspect-ratio: 760 / 300; height: auto; }
.best { font: 800 1.05rem/1 var(--display); color: var(--sun); font-variant-numeric: tabular-nums; letter-spacing: .03em; text-shadow: 0 1px 2px var(--night), 0 0 10px var(--night); }
.rank-box { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 8px; }
.rank-lvl { width: 34px; height: 34px; border-radius: 50%; background: var(--lilac); color: #2a1a3d; display: grid; place-items: center; font: 900 1rem/1 var(--display); }
.rank-txt { font: 800 .95rem/1.2 var(--display); }
.meter { width: 120px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden; }
.meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--lilac), var(--rose)); border-radius: 4px; }

.menu-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: min(100%, 330px); }
@media (min-width: 640px) { .menu-row { display: flex; width: auto; } }

/* Sticker book */
.grid.stickers { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); }
.sticker { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 10px 8px 12px; min-width: 0; }
.sticker canvas { width: 88px; height: 88px; }
.sticker b { font: 800 .95rem/1.2 var(--display); }
.sticker small { color: var(--muted); font: 700 .78rem/1.3 var(--body); }
.sticker.locked b { color: var(--muted); }

/* Adventure map: one card per zone, a painted strip of the zone, then its four levels */
.zones { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
.zone { background: var(--panel); border: 2px solid var(--line); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; }
.zone-art { width: 100%; height: auto; aspect-ratio: 600 / 220; display: block; }
.zone.locked .zone-art { filter: grayscale(.7) brightness(.55); }
.zone-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px 4px; }
.zone-head b { font: 900 1.12rem/1.2 var(--display); }
.zone-stars { display: inline-flex; align-items: center; gap: 4px; color: var(--sun); font: 900 .95rem/1 var(--display); font-variant-numeric: tabular-nums; }
.zone-stars svg { width: 16px; height: 16px; fill: var(--sun); }
.zone > .fine { padding: 4px 16px 16px; text-align: left; }
.zone > .fine svg { width: 1em; height: 1em; vertical-align: -.14em; margin-right: 5px; fill: currentColor; }
/* the full game: the one thing for sale, set apart from the zones but just as calm */
.full-card { border-color: var(--peach); align-items: center; gap: 10px; padding-bottom: 16px; }
.full-card .zone-head { align-self: stretch; }
.full-card .sub { margin: 0; padding: 0 16px; }
.full-card > .fine { padding: 0 16px; text-align: center; }
a.btn { text-decoration: none; }
.lvls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 8px 12px 14px; }
.lvl { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 10px 4px 9px; border-radius: 16px; border: 2px solid var(--line); background: rgba(0, 0, 0, .2); color: var(--ink); cursor: pointer; min-width: 0; touch-action: manipulation; }
.lvl:active { transform: scale(.95); }
.lvl:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.lvl .num { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--mint); color: #2a1a3d; font: 900 1.15rem/1 var(--display); box-shadow: 0 3px 0 var(--mint-deep); }
.lvl .num svg { width: 22px; height: 22px; fill: currentColor; }
.lvl.boss .num { background: var(--rose); box-shadow: 0 3px 0 var(--rose-deep); }
.lvl .what { font: 700 .72rem/1.2 var(--body); color: var(--muted); text-align: center; overflow-wrap: anywhere; min-height: 2.4em; }
.lvl .stars { display: flex; gap: 2px; }
.lvl .stars i { width: 12px; height: 12px; background: rgba(255, 255, 255, .18); clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 100%, 50% 77%, 20% 100%, 30% 60%, 0 38%, 38% 35%); }
.lvl .stars i.on { background: var(--sun); }
.lvl.here { border-color: var(--sun); animation: breathe 2.4s ease-in-out infinite; }
.lvl[disabled] { cursor: default; opacity: .55; }
.lvl[disabled] .num { background: #5a4b9e; color: var(--muted); box-shadow: 0 3px 0 #352a6e; }
.big-stars { display: flex; gap: 10px; align-items: flex-end; }
.big-stars i { display: block; line-height: 0; }
.big-stars svg { width: 64px; height: 64px; fill: rgba(255, 255, 255, .16); }
.big-stars i:nth-child(2) svg { width: 84px; height: 84px; }
.big-stars i.on svg { fill: var(--sun); filter: drop-shadow(0 0 10px rgba(255, 207, 74, .7)); }
.big-stars i.on { animation: star-pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes star-pop { from { transform: scale(0) rotate(-40deg); } to { transform: none; } }

/* Panels */
.panel { width: 100%; max-width: 560px; background: var(--panel); border: 2px solid var(--line); border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.head { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.head h2 { margin: 0; font: 900 1.6rem/1 var(--display); }

/* Shop */
#shop-preview { width: 100%; max-width: 560px; height: 150px; border-radius: 22px; background: rgba(0, 0, 0, .25); border: 2px solid var(--line); }
.tabs { display: flex; gap: 6px; background: var(--panel); border: 2px solid var(--line); padding: 5px; border-radius: 18px; width: 100%; max-width: 560px; }
.tab { flex: 1; border: 0; background: transparent; color: var(--muted); font: 800 .95rem/1 var(--display); padding: 11px 4px; border-radius: 13px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--lilac); color: #2a1a3d; }
.grid { width: 100%; max-width: 560px; display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
.card {
  background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 8px 6px 10px; display: flex; flex-direction: column;
  align-items: center; gap: 4px; color: var(--ink); cursor: pointer; font: 800 .85rem/1.15 var(--display); min-width: 0;
}
.card canvas { width: 72px; height: 72px; }
.card .price { color: var(--sun); display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
.card .price svg { width: 13px; height: 13px; fill: var(--sun); }
.card.owned .price { color: var(--mint); }
.card.equipped { border-color: var(--sun); box-shadow: 0 0 0 2px var(--sun) inset; }
.card.locked { opacity: .78; }
.card.sel { transform: translateY(-3px); border-color: var(--ink); }
.buybar { width: 100%; max-width: 560px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 10px 10px 10px 16px; }
.buybar b { font: 900 1.05rem/1.2 var(--display); }
.buybar small { display: block; color: var(--muted); font: 700 .85rem/1.3 var(--body); }
.upg { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 2px solid var(--line); border-radius: 18px; padding: 12px; width: 100%; max-width: 560px; }
.upg .txt { flex: 1; min-width: 0; }
.upg b { font: 900 1rem/1.2 var(--display); }
.upg small { display: block; color: var(--muted); font: 700 .85rem/1.3 var(--body); }
.pips { display: flex; gap: 4px; margin-top: 6px; }
.pips i { width: 18px; height: 7px; border-radius: 4px; background: rgba(255, 255, 255, .15); }
.pips i.on { background: var(--mint); }
.upg .btn { min-width: 88px; padding: 11px 12px; font-size: .95rem; border-radius: 15px; }

/* Missions */
.mission { display: flex; gap: 12px; align-items: center; background: rgba(0, 0, 0, .18); border-radius: 18px; padding: 12px; }
.mission .tick { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--lilac); flex: none; display: grid; place-items: center; }
.mission.done .tick { background: var(--mint); border-color: var(--mint); }
.mission .tick svg { width: 18px; height: 18px; fill: #2a1a3d; }
.mission .txt { flex: 1; min-width: 0; font: 800 .98rem/1.3 var(--display); }
.mission .bar2 { height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .14); margin-top: 7px; overflow: hidden; }
.mission .bar2 i { display: block; height: 100%; background: var(--mint); border-radius: 4px; transition: width .6s; }
.mission .rw { color: var(--sun); font: 900 .9rem/1 var(--display); display: inline-flex; gap: 3px; align-items: center; white-space: nowrap; }
.mission .rw svg { width: 13px; height: 13px; fill: var(--sun); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.stat { background: rgba(0, 0, 0, .18); border-radius: 14px; padding: 10px 12px; }
.stat b { display: block; font: 900 1.25rem/1.1 var(--display); color: var(--sun); font-variant-numeric: tabular-nums; }
.stat span { font: 700 .8rem/1.2 var(--body); color: var(--muted); }

/* Settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font: 800 1.02rem/1.2 var(--display); }
.switch { width: 58px; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, .18); border: 0; position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--mint-deep); }
.switch[aria-checked="true"]::after { left: 28px; }
.seg { display: flex; background: rgba(0, 0, 0, .25); border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 800 .85rem/1 var(--display); padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--sky); color: #1d2140; }
.fine { color: var(--muted); font: 700 .82rem/1.45 var(--body); text-align: center; margin: 0; }

/* Game over */
.score-big { font: 900 clamp(3rem, 15vw, 5rem)/1 var(--display); color: var(--sun); font-variant-numeric: tabular-nums; text-shadow: 0 5px 0 rgba(0, 0, 0, .3); }
.ribbon { font: 900 1.1rem/1 var(--display); color: #2a1a3d; background: var(--rose); padding: 9px 18px; border-radius: 12px; transform: rotate(-3deg); animation: wiggle 1.6s infinite; }
.earn { display: inline-flex; align-items: center; gap: 6px; font: 900 1.25rem/1 var(--display); color: var(--sun); }
.earn svg { width: 22px; height: 22px; fill: var(--sun); }

/* In-play overlays */
#pause-btn { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: max(12px, env(safe-area-inset-right, 0px)); pointer-events: auto; }
#tip {
  position: absolute; left: 0; right: 0; margin-inline: auto; top: calc(env(safe-area-inset-top, 0px) + 86px);
  width: min(88vw, 460px); background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 14px 18px;
  font: 800 1.12rem/1.35 var(--display); text-align: center; text-wrap: balance; pointer-events: none; animation: pop-in .3s;
}
.ring { width: 120px; height: 120px; }
#toasts { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--panel); border: 2px solid var(--mint); border-radius: 16px; padding: 10px 16px; font: 800 .98rem/1.3 var(--display); display: flex; align-items: center; gap: 10px; animation: toast 3.2s forwards; max-width: 460px; }
.toast svg { width: 20px; height: 20px; fill: var(--mint); flex: none; }
@keyframes toast { 0% { opacity: 0; transform: translateY(20px) scale(.9); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-10px); } }
.giftbox { width: 140px; height: 140px; cursor: pointer; border: 0; background: none; }
.giftbox svg { width: 100%; height: 100%; animation: wiggle 1s infinite; }
.confirm { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
@media (max-height: 640px) { .btn.big { padding: 15px 44px; font-size: 1.6rem; } #logo { width: min(70vw, 420px); } .screen { gap: 10px; } }
@media (prefers-reduced-motion: reduce) { .btn.big, .badge, .ribbon, .giftbox svg, .lvl.here, .big-stars i.on { animation: none; } .screen { animation: none; } }
</style>
</head>

  <symbol id="i-gift" viewBox="0 0 24 24"><path d="M3 9h18v4H3zM4.5 13h6.5v8H6a1.5 1.5 0 0 1-1.5-1.5zM13 13h6.5v6.5A1.5 1.5 0 0 1 18 21h-5zM11 9h2v4h-2zM12 8.5C10 4 6.5 4 6.5 6.3 6.5 8 9 8.5 12 8.5zm0 0c2-4.5 5.5-4.5 5.5-2.2 0 1.7-2.5 2.2-5.5 2.2z"/></symbol>

  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2"/><rect x="14" y="4" width="5" height="16" rx="2"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>

<script>
(() => {
'use strict';
// ===== core.js =====
// ---------- maths ----------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const d2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const easeOutBack = (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const fmt = (n) => Math.floor(n).toLocaleString('en-GB');

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Segment AB against CD. On a hit the crossing point is left in IX, IY.
let IX = 0, IY = 0;
function segHit(ax, ay, bx, by, cx, cy, dx, dy) {
  const rx = bx - ax, ry = by - ay, sx = dx - cx, sy = dy - cy;
  const den = rx * sy - ry * sx;
  if (den > -1e-9 && den < 1e-9) return false;
  const qx = cx - ax, qy = cy - ay;
  const t = (qx * sy - qy * sx) / den;
  const u = (qx * ry - qy * rx) / den;
  if (t < 0 || t > 1 || u < 0 || u > 1) return false;
  IX = ax + t * rx; IY = ay + t * ry;
  return true;
}
// Polygons are flat arrays: [x0, y0, x1, y1, ...]
function pointInPoly(x, y, p) {
  let inside = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function polyArea(p) {
  let a = 0;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) a += p[j] * p[i + 1] - p[i] * p[j + 1];
  return Math.abs(a / 2);
}
function polyPerimeter(p) {
  let s = 0;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) s += Math.hypot(p[i] - p[j], p[i + 1] - p[j + 1]);
  return s;
}
function polyCentre(p) {
  let x = 0, y = 0;
  const n = p.length / 2;
  for (let i = 0; i < p.length; i += 2) { x += p[i]; y += p[i + 1]; }
  return { x: x / n, y: y / n };
}
function distSeg2(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay;
  const len = vx * vx + vy * vy;
  let t = len > 0 ? ((px - ax) * vx + (py - ay) * vy) / len : 0;
  t = clamp(t, 0, 1);
  return d2(px, py, ax + vx * t, ay + vy * t);
}
const hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
function today(offsetDays = 0) {
  const d = new Date(Date.now() + offsetDays * 864e5);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

// ---------- DOM ----------
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
const icon = (name) => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;

// ---------- save data (per player, in this browser) ----------
const Save = {
  key: 'loopling.save.v1',
  data: null,
  // The Android app keeps progress in its own storage, written straight to disk (a WebView saves
  // localStorage a few seconds late, so closing the app just after a game could lose it).
  read() { return window.LooplingAndroid ? LooplingAndroid.load(this.key) : localStorage.getItem(this.key); },
  write(text) { if (window.LooplingAndroid) LooplingAndroid.save(this.key, text); else localStorage.setItem(this.key, text); },
  fresh() {
    return {
      best: 0, chillBest: 0, dust: 0,
      owned: { color: ['sunny'], hat: ['none'], trail: ['glow'] },
      eq: { color: 'sunny', hat: 'none', trail: 'glow' },
      upg: { tail: 0, power: 0, luck: 0, heart: 0 },
      missions: [], mstars: 0,
      stats: { runs: 0, stars: 0, loops: 0, cheer: 0, bestLoop: 0, bestChain: 0, time: 0, bosses: 0, maxStage: 0 },
      set: { music: true, sfx: true, vibe: true, shake: !matchMedia('(prefers-reduced-motion: reduce)').matches, ctrl: 'finger' },
      daily: { last: '', streak: 0 },
      tut: false,
      stickers: [], garden: 0,
      adv: {}, // Adventure: stars won per level, keyed "zone-level"
      full: false, // the full game (see full.js)
    };
  },
  load() {
    const base = this.fresh();
    let got = null;
    try { got = JSON.parse(this.read() || 'null'); } catch (e) { got = null; }
    if (got && typeof got === 'object') {
      for (const k in base) {
        if (!(k in got)) continue;
        const b = base[k], g = got[k];
        if (b && typeof b === 'object' && !Array.isArray(b) && g && typeof g === 'object') base[k] = Object.assign(b, g);
        else if (typeof g === typeof b) base[k] = g;
      }
    }
    this.data = base;
    return base;
  },
  save() {
    try { this.write(JSON.stringify(this.data)); } catch (e) { /* storage blocked: play on without saving */ }
  },
  reset() { this.data = this.fresh(); this.save(); },
};

// ---------- input ----------
// Mouse: Loopling chases the cursor. Touch (Settings > Touch controls): by default Loopling flies
// to your fingertip; "Above finger" keeps it just above the finger; "Drag" moves it with your
// finger from wherever you touch. Keys/gamepad: steer.
const Input = {
  kind: matchMedia('(pointer: coarse)').matches ? 'touch' : 'mouse',
  down: false, tid: null, px: 0, py: 0, dx: 0, dy: 0, hasMouse: false,
  keys: Object.create(null),
  onKey: null,
  attach(cv) {
    // Any tap or click (menus included) tells us which kind of control to describe and use.
    addEventListener('pointerdown', (e) => { this.kind = e.pointerType === 'mouse' ? 'mouse' : 'touch'; }, true);
    // Mouse and pen: pointer events.
    cv.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') return;
      this.down = true; this.hasMouse = true; this.px = e.clientX; this.py = e.clientY;
      Sound.unlock();
    });
    cv.addEventListener('pointermove', (e) => {
      if (e.pointerType === 'touch') return;
      this.kind = 'mouse'; this.hasMouse = true; this.px = e.clientX; this.py = e.clientY;
    });
    cv.addEventListener('pointerup', (e) => { if (e.pointerType !== 'touch') this.down = false; });
    // Fingers: touch events, cancelled, so the browser (or a page the game sits inside, like the
    // claude.ai viewer on iPhone) never turns a loop into a scroll, a zoom or a swipe.
    const grab = { passive: false };
    cv.addEventListener('touchstart', (e) => {
      e.preventDefault();
      this.kind = 'touch';
      if (this.tid === null) {
        const t = e.changedTouches[0];
        this.tid = t.identifier; this.down = true; this.px = t.clientX; this.py = t.clientY;
      }
      Sound.unlock();
    }, grab);
    cv.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier !== this.tid) continue;
        this.dx += t.clientX - this.px; this.dy += t.clientY - this.py;
        this.px = t.clientX; this.py = t.clientY;
      }
    }, grab);
    const lift = (e) => {
      for (const t of e.changedTouches) if (t.identifier === this.tid) { this.tid = null; this.down = false; }
      Sound.unlock();
    };
    cv.addEventListener('touchend', lift);
    cv.addEventListener('touchcancel', lift);
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    addEventListener('keydown', (e) => {
      if (e.repeat) return;
      this.keys[e.code] = true;
      if (/^(Arrow|Key[WASD])/.test(e.code)) { this.kind = 'keys'; e.preventDefault(); }
      if (this.onKey) this.onKey(e.code);
      Sound.unlock();
    });
    addEventListener('keyup', (e) => { this.keys[e.code] = false; });
    addEventListener('blur', () => { this.keys = Object.create(null); this.down = false; this.tid = null; });
  },
  takeDelta() { const r = { x: this.dx, y: this.dy }; this.dx = 0; this.dy = 0; return r; },
  // First connected gamepad: left stick, or the d-pad. Null when it is idle.
  pad() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) {
      if (!p) continue;
      const b = (i) => (p.buttons[i] && p.buttons[i].pressed ? 1 : 0);
      let x = p.axes[0] || 0, y = p.axes[1] || 0;
      if (Math.hypot(x, y) < 0.2) { x = b(15) - b(14); y = b(13) - b(12); }
      return x || y ? { x, y } : null;
    }
    return null;
  },
  steer() {
    const k = this.keys;
    let x = (k.ArrowRight || k.KeyD ? 1 : 0) - (k.ArrowLeft || k.KeyA ? 1 : 0);
    let y = (k.ArrowDown || k.KeyS ? 1 : 0) - (k.ArrowUp || k.KeyW ? 1 : 0);
    const g = this.pad();
    if (g) { x = g.x; y = g.y; }
    const m = Math.hypot(x, y);
    return m > 1 ? { x: x / m, y: y / m } : { x, y };
  },
};

function buzz(ms) {
  if (!Save.data.set.vibe) return;
  if (window.LooplingAndroid) { LooplingAndroid.vibrate(ms); return; }
  if (!navigator.vibrate) return;
  try { navigator.vibrate(ms); } catch (e) { /* vibration refused */ }
}

// ===== audio.js =====
// ---------- sound: every effect and every note of music is synthesised here ----------
const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
const PENTA = [0, 2, 4, 7, 9];

const Sound = {
  ctx: null, sfx: null, mus: null, musLP: null, noiseBuf: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      const c = (this.ctx = new AC());
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
      comp.connect(c.destination);
      this.sfx = c.createGain(); this.sfx.connect(comp);
      this.musLP = c.createBiquadFilter(); this.musLP.type = 'lowpass'; this.musLP.frequency.value = 16000;
      this.mus = c.createGain(); this.mus.connect(this.musLP); this.musLP.connect(comp);
      const len = c.sampleRate;
      this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
      const ch = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
      this.apply();
      Music.boot();
    } catch (e) { this.ctx = null; }
  },
  apply() {
    if (!this.ctx) return;
    const s = Save.data.set, t = this.ctx.currentTime;
    this.sfx.gain.setTargetAtTime(s.sfx ? 0.9 : 0, t, 0.05);
    this.mus.gain.setTargetAtTime(s.music ? 0.5 : 0, t, 0.1);
  },
  muffle(on) { if (this.ctx) this.musLP.frequency.setTargetAtTime(on ? 700 : 16000, this.ctx.currentTime, 0.25); },
  suspend(on) { if (!this.ctx) return; (on ? this.ctx.suspend() : this.ctx.resume()).catch(() => {}); },

  // One enveloped oscillator. o.t = absolute start time, o.at = delay from now.
  tone(f, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t = o.t != null ? o.t : c.currentTime + (o.at || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide || dur));
    if (o.detune) osc.detune.value = o.detune;
    const v = o.vol == null ? 0.2 : o.vol, a = o.attack || 0.004;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    if (o.hold) g.gain.setValueAtTime(v, t + a + o.hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = g;
    if (o.lp) { const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = o.lp; g.connect(f2); out = f2; }
    osc.connect(g); out.connect(o.dest || this.sfx);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  noise(dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const t = o.t != null ? o.t : c.currentTime + (o.at || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.filter || 'bandpass';
    f.frequency.setValueAtTime(o.freq || 1500, t);
    if (o.sweep) f.frequency.exponentialRampToValueAtTime(o.sweep, t + dur);
    f.Q.value = o.q || 0.8;
    const g = c.createGain(), v = o.vol == null ? 0.15 : o.vol;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(v, t + (o.attack || 0.003));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.dest || this.sfx);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },

  // ----- effects -----
  pick(i, gold) {
    i = Math.min(i, 14);
    const m = 72 + PENTA[i % 5] + 12 * Math.floor(i / 5);
    this.tone(mtof(m), 0.24, { type: 'triangle', vol: 0.2 });
    this.tone(mtof(m + 12), 0.14, { vol: 0.07 });
    if (gold) { this.tone(mtof(m + 19), 0.3, { type: 'triangle', vol: 0.08, at: 0.06 }); this.tone(mtof(m + 24), 0.3, { vol: 0.06, at: 0.11 }); }
  },
  loop(n, chain) {
    this.noise(0.32, { freq: 500, sweep: 2800, q: 1.2, vol: 0.11 });
    const base = 60 + Math.min(chain, 7) * 2, arp = [0, 4, 7, 12, 16, 19, 24, 28];
    const k = Math.min(n + 1, 8);
    for (let i = 0; i < k; i++) this.tone(mtof(base + arp[i]), 0.34, { type: 'triangle', vol: 0.15, at: i * 0.045 });
    this.tone(mtof(base + 36), 0.4, { vol: 0.05, at: k * 0.045 });
  },
  emptyLoop() { this.noise(0.22, { freq: 700, sweep: 1600, q: 1, vol: 0.06 }); },
  cheer() {
    this.tone(320, 0.22, { to: 780, slide: 0.16, vol: 0.18 });
    this.tone(990, 0.16, { type: 'triangle', vol: 0.08, at: 0.09 });
    this.tone(1320, 0.18, { type: 'triangle', vol: 0.07, at: 0.15 });
  },
  hurt() {
    this.tone(400, 0.3, { type: 'square', to: 110, vol: 0.08, lp: 1800 });
    this.tone(150, 0.32, { to: 55, vol: 0.32 });
  },
  boop() { this.tone(260, 0.18, { to: 180, vol: 0.14, type: 'triangle' }); },
  snip() { this.noise(0.12, { filter: 'highpass', freq: 3200, vol: 0.12 }); this.tone(900, 0.16, { type: 'triangle', to: 280, vol: 0.09 }); },
  power() {
    this.tone(330, 0.4, { type: 'triangle', to: 1320, slide: 0.32, vol: 0.12 });
    [76, 79, 84].forEach((m, i) => this.tone(mtof(m), 0.3, { type: 'triangle', vol: 0.08, at: 0.12 + i * 0.06 }));
  },
  pop() { this.tone(500, 0.1, { to: 1500, slide: 0.07, vol: 0.18 }); this.noise(0.06, { freq: 2500, vol: 0.08 }); },
  click() { this.tone(620, 0.08, { to: 880, slide: 0.05, vol: 0.1 }); },
  coin() { this.tone(988, 0.09, { type: 'square', vol: 0.05 }); this.tone(1319, 0.28, { type: 'square', vol: 0.05, at: 0.075 }); },
  zapCharge() { this.tone(180, 0.75, { type: 'sawtooth', to: 700, slide: 0.7, vol: 0.025, lp: 2400 }); },
  zap() { this.noise(0.22, { freq: 2200, sweep: 600, vol: 0.09 }); this.tone(900, 0.2, { type: 'square', to: 200, vol: 0.04 }); },
  plip() { this.tone(1300, 0.07, { to: 650, vol: 0.025 }); },
  bossIn() {
    this.tone(55, 2.0, { type: 'sawtooth', vol: 0.12, attack: 0.6, lp: 500 });
    this.tone(82, 2.0, { type: 'sawtooth', vol: 0.08, attack: 0.8, lp: 400 });
    this.noise(1.6, { filter: 'lowpass', freq: 260, vol: 0.18, attack: 0.5 });
  },
  giggle() { for (let i = 0; i < 6; i++) this.tone(i % 2 ? 780 : 620, 0.07, { type: 'triangle', vol: 0.1, at: i * 0.065 }); },
  fanfare() {
    [60, 64, 67, 72, 76, 79, 84].forEach((m, i) => this.tone(mtof(m), 0.35, { type: 'triangle', vol: 0.12, at: i * 0.085 }));
    [72, 76, 79, 84].forEach((m) => this.tone(mtof(m), 1.2, { type: 'square', vol: 0.03, at: 0.6, lp: 2600 }));
  },
  aww() { [72, 69, 67, 64, 60].forEach((m, i) => this.tone(mtof(m), 0.32, { type: 'triangle', vol: 0.12, at: i * 0.15 })); },
  jingle() { [76, 79, 84, 88].forEach((m, i) => this.tone(mtof(m), 0.25, { type: 'triangle', vol: 0.11, at: i * 0.075 })); },
  chime() { [84, 88, 91, 96].forEach((m, i) => this.tone(mtof(m), 0.55, { vol: 0.08, at: i * 0.06 })); },
  feverOn() {
    this.tone(220, 0.9, { type: 'sawtooth', to: 880, slide: 0.8, vol: 0.05, lp: 3000 });
    [72, 76, 79, 84, 88].forEach((m, i) => this.tone(mtof(m), 0.3, { type: 'triangle', vol: 0.1, at: 0.5 + i * 0.06 }));
  },
  whoosh() { this.noise(0.9, { freq: 300, sweep: 4000, q: 0.6, vol: 0.07, attack: 0.3 }); },
  // boss attacks
  thunder() {
    this.noise(0.08, { filter: 'highpass', freq: 2500, vol: 0.16 });
    this.noise(0.9, { filter: 'lowpass', freq: 900, sweep: 120, vol: 0.3, attack: 0.01 });
    this.tone(70, 0.7, { type: 'sawtooth', to: 38, vol: 0.12, lp: 300 });
  },
  puff() { this.noise(0.35, { freq: 900, sweep: 300, q: 0.7, vol: 0.08, attack: 0.05 }); this.tone(520, 0.12, { to: 900, vol: 0.05, at: 0.05 }); },
  molePop() { this.tone(240, 0.16, { to: 620, slide: 0.12, vol: 0.14, type: 'triangle' }); this.noise(0.1, { freq: 600, vol: 0.06 }); },
};

// ---------- music: a small step sequencer with a 4-bar chord loop ----------
const PROGS_MAJOR = [
  [[0, 4, 7], [7, 11, 14], [9, 12, 16], [5, 9, 12]],
  [[0, 4, 7], [9, 12, 16], [5, 9, 12], [7, 11, 14]],
  [[9, 12, 16], [5, 9, 12], [0, 4, 7], [7, 11, 14]],
  [[0, 4, 7], [5, 9, 12], [9, 12, 16], [7, 11, 14]],
];
const PROG_MINOR = [[0, 3, 7], [8, 12, 15], [3, 7, 10], [10, 14, 17]];
const KEYS = [60, 62, 65, 57, 63, 64, 58, 67];

const Music = {
  style: null, stage: 0, want: null, wantStage: 0, timer: null,
  step: 0, next: 0, bpm: 100, key: 60, prog: PROGS_MAJOR[0], mel: [],
  boot() {
    if (!Sound.ctx || this.timer) return;
    this.timer = setInterval(() => this.tick(), 25);
    if (this.want) this.play(this.want, this.wantStage, true);
  },
  play(style, stage = 0, force) {
    this.want = style; this.wantStage = stage;
    if (!Sound.ctx) return;
    if (!force && style === this.style && stage === this.stage) return;
    this.style = style; this.stage = stage;
    const rng = mulberry32(stage * 977 + (style === 'menu' ? 5 : style === 'chill' ? 11 : 3));
    this.key = KEYS[stage % KEYS.length];
    this.prog = style === 'boss' ? PROG_MINOR : PROGS_MAJOR[Math.floor(rng() * PROGS_MAJOR.length)];
    this.bpm = style === 'menu' ? 96 : style === 'chill' ? 80 : Math.min(134, 112 + stage * 4) + (style === 'boss' ? 8 : style === 'fever' ? 16 : 0);
    // 2-bar pentatonic motif, one slot per 16th step; null = rest
    const deg = style === 'boss' ? [0, 3, 5, 7, 10, 12, 15, 17] : [0, 2, 4, 7, 9, 12, 14, 16];
    this.mel = [];
    let d = 3;
    for (let s = 0; s < 32; s++) {
      const on = s % 2 === 0 && rng() < (style === 'chill' ? 0.3 : 0.55);
      if (on) { d = clamp(d + Math.floor(rng() * 5) - 2, 0, deg.length - 1); this.mel.push(deg[d]); } else this.mel.push(null);
    }
    this.step = 0;
    this.next = Sound.ctx.currentTime + 0.08;
  },
  stop() { this.style = null; this.want = null; },
  tick() {
    const c = Sound.ctx;
    if (!c || !this.style || c.state !== 'running') return;
    if (this.next < c.currentTime - 0.2) this.next = c.currentTime + 0.05;
    while (this.next < c.currentTime + 0.15) {
      this.playStep(this.step, this.next);
      this.next += 60 / this.bpm / 4;
      this.step++;
    }
  },
  playStep(s, t) {
    const st = this.style, sx = 60 / this.bpm / 4, dest = Sound.mus;
    const within = s % 16, bar = Math.floor(s / 16) % 4;
    const chord = this.prog[bar].map((x) => x + this.key);
    const drums = st === 'play' || st === 'boss' || st === 'fever';
    if (within === 0) for (const m of chord) {
      Sound.tone(mtof(m), sx * 16, { t, type: 'sawtooth', vol: 0.022, attack: 0.3, hold: sx * 12, lp: 900, dest });
      Sound.tone(mtof(m), sx * 16, { t, type: 'sawtooth', vol: 0.018, attack: 0.3, hold: sx * 12, lp: 900, detune: 9, dest });
    }
    const arpEvery = st === 'chill' ? 4 : st === 'fever' ? 1 : 2;
    if (within % arpEvery === 0) {
      const i = (within / arpEvery) % 4;
      const m = chord[[0, 1, 2, 1][i]] + 12 + (i === 2 ? 12 : 0);
      Sound.tone(mtof(m), 0.22, { t, type: 'triangle', vol: st === 'chill' ? 0.06 : 0.045, dest });
    }
    const bassHits = st === 'boss' ? [0, 2, 4, 6, 8, 10, 12, 14] : st === 'chill' ? [0] : st === 'menu' ? [0, 8] : [0, 6, 8, 14];
    if (bassHits.includes(within)) {
      const m = chord[0] - 24 + (st !== 'chill' && within === 14 ? 12 : 0);
      Sound.tone(mtof(m), sx * (st === 'chill' ? 14 : 3), { t, type: 'triangle', vol: 0.16, dest });
      Sound.tone(mtof(m), sx * 2, { t, vol: 0.1, dest });
    }
    if (drums) {
      const kick = st === 'boss' ? within % 4 === 0 : within === 0 || within === 8 || (within === 10 && bar === 3);
      if (kick) Sound.tone(140, 0.28, { t, to: 45, slide: 0.12, vol: 0.42, dest });
      if (within === 4 || within === 12) {
        Sound.noise(0.14, { t, freq: 1800, q: 0.7, vol: 0.12, dest });
        Sound.tone(210, 0.08, { t, type: 'triangle', vol: 0.05, dest });
      }
      if (within % 2 === 0) Sound.noise(0.035, { t, filter: 'highpass', freq: 7500, vol: within % 4 === 2 ? 0.05 : 0.03, dest });
      if (st === 'boss' && bar === 3 && within >= 12) Sound.tone(mtof(this.key - 12 + (16 - within) * 2), 0.16, { t, vol: 0.14, dest });
    } else if (st === 'menu' && within % 4 === 2) {
      Sound.noise(0.03, { t, filter: 'highpass', freq: 8000, vol: 0.018, dest });
    }
    const half = Math.floor(s / 32) % 2;
    const m = this.mel[s % 32];
    if (m != null && (st !== 'play' || half === 1 || bar >= 2)) {
      const note = this.key + 12 + m + (st === 'chill' ? 12 : 0);
      Sound.tone(mtof(note), sx * 2.2, { t, type: st === 'chill' ? 'sine' : 'square', vol: st === 'chill' ? 0.05 : 0.028, lp: 2200, dest });
      Sound.tone(mtof(note), sx * 2.2, { t, type: 'triangle', vol: 0.035, dest });
    }
  },
};

const byId = (list, id) => list.find((x) => x.id === id) || list[0];

// Body colour for a skin at time t (Galaxy and Golden shimmer).
function skinColors(id, t) {
  const c = byId(COLORS, id);
  // Quantised so the glow-sprite cache sees a few dozen colours, not a new one every frame.
  if (id === 'galaxy') { const h = Math.round(((t * 40) % 360) / 10) * 10; return { body: hsl(h, 90, 72), dark: hsl((h + 40) % 360, 70, 40), hue: h }; }
  if (id === 'gold') { const l = Math.round(70 + Math.sin(t * 3) * 6); return { body: hsl(45, 100, l), dark: '#c9861a' }; }

}

// Soft glow sprites, one per colour, scaled when drawn.
const glowCache = new Map();
function glowSprite(color) {
  let g = glowCache.get(color);
  if (g) return g;
  g = document.createElement('canvas'); g.width = g.height = 128;
  const c = g.getContext('2d'), grd = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0, color); grd.addColorStop(0.35, color.replace(/[\d.]+\)$/, '0.35)')); grd.addColorStop(1, 'rgba(0,0,0,0)');

  glowCache.set(color, g);
  return g;
}
function toRGBA(hex, a) {
  if (hex.startsWith('hsla')) return hex.replace(/[\d.]+\)$/, a + ')');
  const n = parseInt(hex.slice(1), 16);

function drawGlow(ctx, x, y, r, color, alpha = 1) {
  const op = ctx.globalCompositeOperation, ga = ctx.globalAlpha;
  ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = ga * alpha;
  ctx.drawImage(glowSprite(toRGBA(color, 0.9)), x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = op; ctx.globalAlpha = ga;

function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); }
function starPath(ctx, x, y, r, rot, points = 5, inner = 0.48) {
  ctx.beginPath();

    const a = rot + (i * Math.PI) / points - Math.PI / 2, rr = i % 2 ? r * inner : r;
    i ? ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);

}
function heartPath(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 0.1, y + s * 0.25, x - s * 0.55, y + s * 0.05, x - s * 0.5, y - s * 0.22);
  ctx.bezierCurveTo(x - s * 0.45, y - s * 0.5, x - s * 0.08, y - s * 0.52, x, y - s * 0.22);
  ctx.bezierCurveTo(x + s * 0.08, y - s * 0.52, x + s * 0.45, y - s * 0.5, x + s * 0.5, y - s * 0.22);
  ctx.bezierCurveTo(x + s * 0.55, y + s * 0.05, x + s * 0.1, y + s * 0.25, x, y + s * 0.35);
  ctx.closePath();
}
function drawHeart(ctx, x, y, s, fill = '#ff6b9a', line = '#9e2056') {
  heartPath(ctx, x, y, s);
  ctx.fillStyle = fill; ctx.fill();
  ctx.lineWidth = Math.max(1.5, s * 0.08); ctx.strokeStyle = line; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.beginPath(); ctx.ellipse(x - s * 0.25, y - s * 0.22, s * 0.1, s * 0.06, -0.6, 0, TAU); ctx.fill();
}
function drawStar(ctx, x, y, r, rot, color, gold) {
  drawGlow(ctx, x, y, r * (gold ? 3.4 : 2.6), color, gold ? 0.8 : 0.55);
  starPath(ctx, x, y, r, rot);
  ctx.fillStyle = color; ctx.lineJoin = 'round'; ctx.lineWidth = r * 0.3; ctx.strokeStyle = color;
  ctx.fill(); ctx.stroke();
  starPath(ctx, x - r * 0.08, y - r * 0.1, r * 0.5, rot);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill();
}

// ----- faces -----
function eye(ctx, x, y, r, lx, ly, blink) {
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x, y, r, r * 1.25 * Math.max(0.08, 1 - blink), 0, 0, TAU); ctx.fill();
  if (blink > 0.6) return;
  ctx.fillStyle = '#2a1a3d';
  circle(ctx, x + lx * r * 0.4, y + ly * r * 0.4, r * 0.62); ctx.fill();
  ctx.fillStyle = '#fff';
  circle(ctx, x + lx * r * 0.4 - r * 0.22, y + ly * r * 0.4 - r * 0.28, r * 0.22); ctx.fill();
}
function happyEye(ctx, x, y, r) {
  ctx.beginPath(); ctx.arc(x, y + r * 0.35, r * 0.8, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
}

  ctx.beginPath();

    ctx.lineTo(x + Math.cos(a + t * 8) * rr, y + Math.sin(a + t * 8) * rr);
  }
  ctx.stroke();
}

// ----- Loopling -----
function drawLoopling(ctx, x, y, r, o) {
  const t = o.t || 0, sk = skinColors(o.color || 'sunny', t);
  drawGlow(ctx, x, y, r * 3, sk.body, o.glow == null ? 0.55 : o.glow);

  ctx.strokeStyle = sk.dark; ctx.lineWidth = r * 0.16; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, -r * 0.92);
  ctx.quadraticCurveTo(r * 0.05, -r * 1.35, r * 0.32, -r * 1.42);
  ctx.arc(r * 0.32, -r * 1.24, r * 0.18, -Math.PI / 2, Math.PI * 1.2);

  ctx.beginPath(); ctx.ellipse(r * 0.56, r * 0.22, r * 0.17, r * 0.11, 0, 0, TAU); ctx.fill();

  else { eye(ctx, -ex + lx * r * 0.1, ey + ly * r * 0.08, er, lx, ly, o.blink || 0); eye(ctx, ex + lx * r * 0.1, ey + ly * r * 0.08, er, lx, ly, o.blink || 0); }

function drawHat(ctx, id, r, t) {

    ctx.fillStyle = '#ff5f7e';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(s * r * 0.95, -r * 0.05, r * 0.2, r * 0.32, 0, 0, TAU); ctx.fill(); }

    ctx.beginPath(); ctx.ellipse(0, top + r * 0.12, r * 0.85, r * 0.2, 0, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * 0.5, top + r * 0.08);

    ctx.lineTo(r * 0.25, top - r * 0.12); ctx.lineTo(r * 0.55, top - r * 0.38); ctx.lineTo(r * 0.5, top + r * 0.12);

  } else if (id === 'halo') {

// ----- Prickles (spiky, they snip your tail) -----
function drawPrickle(ctx, x, y, r, o) {

}
function drawDandelion(ctx, x, y, r, t, alpha) {

  ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.fillStyle = '#ffffff'; ctx.lineWidth = r * 0.06;

// ----- Zippers (sparky dashers) -----
function drawZipper(ctx, x, y, r, o) {
  const t = o.t || 0, charge = o.charge || 0;
  drawGlow(ctx, x, y, r * (2.4 + charge * 1.5), '#ffe14d', 0.35 + charge * 0.5);

    ctx.lineTo(Math.cos(a + 0.25) * r * 1.25, Math.sin(a + 0.25) * r * 1.25);
    ctx.lineTo(Math.cos(a + 0.1) * r * 1.4, Math.sin(a + 0.1) * r * 1.4);

    eye(ctx, -r * 0.32, -r * 0.05, r * 0.2, o.lookX || 0, o.lookY || 0, 0); eye(ctx, r * 0.32, -r * 0.05, r * 0.2, o.lookX || 0, o.lookY || 0, 0);
    ctx.beginPath(); ctx.moveTo(-r * 0.25, r * 0.4); ctx.lineTo(-r * 0.08, r * 0.3); ctx.lineTo(r * 0.08, r * 0.42); ctx.lineTo(r * 0.25, r * 0.3); ctx.stroke();
  }
  ctx.restore();
}

function drawDrop(ctx, x, y, r) {

// ----- Rainbow Comet (rare, worth a lot) and Sky Garden flowers -----
function drawComet(ctx, x, y, r, trail, t) {
  ctx.lineCap = 'round';
  for (let i = 1; i < trail.length; i++) {
    const f = i / trail.length;
    ctx.strokeStyle = hsl(Math.round(i * 14 + t * 200) % 360, 95, 70, f * 0.85);
    ctx.lineWidth = r * 1.5 * f;

  }
  drawGlow(ctx, x, y, r * 4, '#fff6c2', 0.9);
  drawStar(ctx, x, y, r, t * 3, '#ffffff', true);

const FLOWER_COLS = ['#ff8fbd', '#ffd84d', '#b9a2ff', '#8fd6ff', '#ff9566', '#ffffff', '#9ff5d6'];
function drawFlower(ctx, x, y, s, petal, grow = 1) {
  if (grow <= 0) return;

  ctx.fillStyle = '#ffe680'; circle(ctx, tx, ty, k * 0.26); ctx.fill();
}

// ----- power-ups -----
const POWERS = {
  heart: { name: 'Extra heart', color: '#ff6b9a', dur: 0 },
  magnet: { name: 'Star Magnet', color: '#ff9f43', dur: 8 },
  tail: { name: 'Super Tail', color: '#4dd8ff', dur: 10 },
  shield: { name: 'Bubble Shield', color: '#7cf0c0', dur: 0 },
  slow: { name: 'Moon Time', color: '#b69bff', dur: 6 },
  rainbow: { name: 'Rainbow Burst', color: '#ffd84d', dur: 0 },
  double: { name: 'Double Points', color: '#ffe066', dur: 10 },

function drawPowerIcon(ctx, kind, x, y, s, t = 0) {
  ctx.save(); ctx.translate(x, y); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (kind === 'heart') drawHeart(ctx, 0, s * 0.05, s * 1.5);
  else if (kind === 'magnet') {
    ctx.lineWidth = s * 0.42; ctx.strokeStyle = '#ff5a5a';
    ctx.beginPath(); ctx.moveTo(-s * 0.45, -s * 0.5); ctx.lineTo(-s * 0.45, s * 0.05); ctx.arc(0, s * 0.05, s * 0.45, Math.PI, 0, true); ctx.lineTo(s * 0.45, -s * 0.5); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(-s * 0.45, -s * 0.62); ctx.lineTo(-s * 0.45, -s * 0.35); ctx.moveTo(s * 0.45, -s * 0.62); ctx.lineTo(s * 0.45, -s * 0.35); ctx.stroke();
  } else if (kind === 'tail') {
    ctx.strokeStyle = '#4dd8ff'; ctx.lineWidth = s * 0.22; ctx.beginPath();
    for (let a = 0; a < TAU * 1.6; a += 0.2) { const rr = s * 0.08 + a * s * 0.07; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.stroke();
  } else if (kind === 'shield') {
    ctx.fillStyle = 'rgba(124,240,192,.5)'; ctx.strokeStyle = '#7cf0c0'; ctx.lineWidth = s * 0.14;
    circle(ctx, 0, 0, s * 0.62); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, s * 0.4, Math.PI * 1.1, Math.PI * 1.5); ctx.stroke();
  } else if (kind === 'slow') {
    ctx.fillStyle = '#d9ccff'; ctx.beginPath(); ctx.arc(0, 0, s * 0.6, 0, TAU); ctx.arc(s * 0.28, -s * 0.18, s * 0.5, 0, TAU, true); ctx.fill('evenodd');
  } else if (kind === 'rainbow') {
    ['#ff7a8a', '#ffd84d', '#7fe08a', '#6cc6ff'].forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = s * 0.16; ctx.beginPath(); ctx.arc(0, s * 0.35, s * (0.75 - i * 0.17), Math.PI, 0); ctx.stroke(); });
  } else if (kind === 'double') {
    ctx.fillStyle = '#ffe066'; ctx.strokeStyle = '#8a5a00'; ctx.lineWidth = s * 0.1;
    ctx.font = `900 ${s * 1.05}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeText('x2', 0, s * 0.05); ctx.fillText('x2', 0, s * 0.05);
  }
  ctx.restore();
}
function drawBubble(ctx, x, y, r, kind, t, alpha = 1) {
  ctx.save(); ctx.globalAlpha *= alpha;

// ----- the glowing tail -----
// pts: [{x, y, id}], drawn in bands so the width can taper without one stroke per segment.
function drawTrail(ctx, pts, hx, hy, style, colorId, t, scale = 1) {
  const n = pts.length;
  if (n < 2) return;
  const sk = skinColors(colorId, t), B = Math.min(16, n - 1);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const prevOp = ctx.globalCompositeOperation;
  for (let pass = 0; pass < 2; pass++) {
    ctx.globalCompositeOperation = pass === 0 ? 'lighter' : prevOp;
    for (let b = 0; b < B; b++) {
      const i0 = Math.floor((b * (n - 1)) / B), i1 = Math.floor(((b + 1) * (n - 1)) / B);
      const f = (b + 1) / B, w = lerp(2, 12, f) * scale;
      let col = sk.body;
      if (style === 'rainbow') col = hsl((b * 22 + t * 140) % 360, 95, 68);
      else if (style === 'comet') col = hsl(lerp(10, 50, f), 100, lerp(55, 70, f));
      else if (style === 'bubbles') col = '#bfeaff';
      ctx.beginPath(); ctx.moveTo(pts[i0].x, pts[i0].y);
      for (let i = i0 + 1; i <= i1; i++) ctx.lineTo(pts[i].x, pts[i].y);
      if (b === B - 1) ctx.lineTo(hx, hy);
      if (pass === 0) { ctx.strokeStyle = toRGBA(col, 0.18 * f); ctx.lineWidth = w * 2.8; }
      else { ctx.strokeStyle = toRGBA(col, 0.25 + 0.75 * f); ctx.lineWidth = w; }
      ctx.stroke();
      if (pass === 1 && f > 0.3) {
        ctx.strokeStyle = `rgba(255,255,255,${0.55 * f})`; ctx.lineWidth = w * 0.35; ctx.stroke();
      }
    }
  }
  ctx.globalCompositeOperation = prevOp;
  if (style === 'glow' || style === 'rainbow' || style === 'comet') return;
  for (let i = 0; i < n; i++) {
    const p = pts[i], f = i / n;
    if (style === 'sparkle' && p.id % 6 === 0) {
      const s = (3 + 3 * Math.sin(t * 9 + p.id)) * scale * f;
      if (s > 0.5) { ctx.fillStyle = '#ffffff'; starPath(ctx, p.x, p.y, s * 1.6, t * 2, 4, 0.3); ctx.fill(); }
    } else if (style === 'hearts' && p.id % 9 === 0) {
      drawHeart(ctx, p.x, p.y, 9 * scale * (0.4 + f), '#ff8fbd', '#c2357a');
    } else if (style === 'bubbles' && p.id % 5 === 0) {
      ctx.strokeStyle = `rgba(220,245,255,${0.4 + f * 0.5})`; ctx.lineWidth = 1.5 * scale;
      circle(ctx, p.x + Math.sin(p.id) * 5, p.y + Math.cos(p.id) * 5, (3 + (p.id % 3) * 2) * scale); ctx.stroke();
    } else if (style === 'notes' && p.id % 10 === 0) {
      ctx.fillStyle = hsl((p.id * 37) % 360, 90, 75); ctx.font = `900 ${14 * scale * (0.5 + f)}px ${FONT}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.id % 20 ? '♪' : '♫', p.x, p.y);
    }
  }
}

// ----- title lettering: thick rounded strokes, one colour per letter -----
const LOGO = 'LOOPLING';
const LETTER_W = { L: 74, O: 124, P: 86, I: 18, N: 96, G: 124 };
function letterPath(ctx, ch, x, H) {
  ctx.beginPath();
  if (ch === 'L') { ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.lineTo(x + 74, H); }
  else if (ch === 'O') { ctx.ellipse(x + 62, H / 2, 62, H / 2, 0, 0, TAU); }
  else if (ch === 'P') { ctx.moveTo(x, H); ctx.lineTo(x, 0); ctx.lineTo(x + 42, 0); ctx.arc(x + 42, H * 0.29, H * 0.29, -Math.PI / 2, Math.PI / 2); ctx.lineTo(x, H * 0.58); }
  else if (ch === 'I') { ctx.moveTo(x + 9, 0); ctx.lineTo(x + 9, H); }
  else if (ch === 'N') { ctx.moveTo(x, H); ctx.lineTo(x, 0); ctx.lineTo(x + 96, H); ctx.lineTo(x + 96, 0); }
  else if (ch === 'G') { ctx.ellipse(x + 62, H / 2, 62, H / 2, 0, -Math.PI * 0.24, 0, true); ctx.lineTo(x + 70, H / 2); }
}

// ---------- art for the bosses and their attacks (all canvas paths, like art.js) ----------

// Eyes, brows, mouth and cheeks that cheer up as h goes from 0 to 1. ey: the eye line.
function grumpFace(ctx, r, o, h, ey = -0.08) {

}
function flashFill(ctx, o) { if (o.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${o.flash})`; ctx.fill(); } }

  const h = w * 0.55;

  ctx.fillStyle = '#e8c9a8'; ctx.beginPath(); ctx.ellipse(0, r * 0.55, r * 0.55, r * 0.5, 0, 0, TAU); ctx.fill();

// A boss on its own, for the Adventure map and the stickers.

// ----- the attacks -----
function drawBolt(ctx, e, bottom, t) {
  const x = e.x, w = e.w;
  if (e.warn > 0) {
    // a flickering stripe where the lightning will strike
    const a = 0.1 + 0.12 * (Math.sin(t * 24) * 0.5 + 0.5) + (1.1 - e.warn) * 0.15;
    ctx.fillStyle = `rgba(255,236,140,${a})`; ctx.fillRect(x - w / 2, 0, w, bottom);
    ctx.setLineDash([10, 10]); ctx.lineDashOffset = -t * 80; ctx.strokeStyle = 'rgba(255,236,140,.6)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - w / 2, 0); ctx.lineTo(x - w / 2, bottom); ctx.moveTo(x + w / 2, 0); ctx.lineTo(x + w / 2, bottom); ctx.stroke();
    ctx.setLineDash([]);
    return;
  }
  const f = clamp(e.strike / 0.32, 0, 1), rng = mulberry32(Math.floor(t * 30) + Math.round(x));
  ctx.fillStyle = `rgba(255,250,210,${0.35 * f})`; ctx.fillRect(x - w, 0, w * 2, bottom);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x, 0);
  for (let yy = 0; yy < bottom; yy += 40) ctx.lineTo(x + (rng() - 0.5) * w * 0.8, yy + 40);
  ctx.strokeStyle = `rgba(255,255,255,${f})`; ctx.lineWidth = 8; ctx.stroke();
  ctx.strokeStyle = `rgba(255,225,77,${f})`; ctx.lineWidth = 3; ctx.stroke();
}
function drawShot(ctx, e, t) {
  const grow = e.spawn > 0 ? Math.max(0.2, 1 - e.spawn / 0.3) : 1;
  if (e.type === 'bubble') {
    const r = e.r * grow * (1 + Math.sin(t * 5 + e.ph) * 0.05);
    ctx.save(); ctx.globalAlpha *= Math.min(1, Math.max(0, e.life - e.t));
    ctx.fillStyle = 'rgba(200,235,255,.2)'; circle(ctx, e.x, e.y, r); ctx.fill();
    ctx.strokeStyle = hsl(Math.round(t * 120 + e.ph * 60) % 360, 90, 80, 0.9); ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.85)'; circle(ctx, e.x - r * 0.35, e.y - r * 0.35, r * 0.22); ctx.fill();
    ctx.restore();
  } else if (e.type === 'needle') {
    if (e.kind === 'candy') { drawCandy(ctx, e.x, e.y, e.r, e.id, t); return; }
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(Math.atan2(e.vy, e.vx));
    ctx.fillStyle = '#ff6fa8'; ctx.strokeStyle = '#ffd6ec'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(e.r * 1.7, 0); ctx.lineTo(-e.r, -e.r * 0.55); ctx.lineTo(-e.r * 0.55, 0); ctx.lineTo(-e.r, e.r * 0.55); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  } else if (e.type === 'rock') drawCandy(ctx, e.x, e.y, e.r * grow, e.col, t);
  else if (e.type === 'pebble') {
    // a glowing crystal pebble
    drawGlow(ctx, e.x, e.y, e.r * 2.6, '#8ff0ff', 0.5);
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
    ctx.fillStyle = '#9ff4ff'; ctx.strokeStyle = '#3aa6c8'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -e.r); ctx.lineTo(e.r * 0.75, 0); ctx.lineTo(0, e.r); ctx.lineTo(-e.r * 0.75, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
  }
}
// Where the loop will close: a ring on the tail that brightens as Loopling gets near it.
function drawSnapHint(ctx, h, px, py, t) {
  const near = clamp(1 - (h.d - SNAP) / (SNAP * 1.4), 0, 1), r = 12 + Math.sin(t * 10) * 2;
  ctx.save();
  ctx.globalAlpha = 0.35 + near * 0.6;
  drawGlow(ctx, h.x, h.y, r * 2.4, '#fff3b0', 0.8);
  ctx.strokeStyle = '#fff3b0'; ctx.lineWidth = 3; circle(ctx, h.x, h.y, r); ctx.stroke();
  ctx.setLineDash([4, 7]); ctx.strokeStyle = 'rgba(255,243,176,.7)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(h.x, h.y); ctx.stroke();

  ctx.restore();
}

// ===== sky.js =====
// ---------- skies: one painted backdrop per stage, cross-faded between stages ----------
const STAGES = [
  { name: 'Sunset Meadow', top: '#2a1858', mid: '#7d3b8c', low: '#f2906a', hill: ['#5a3080', '#3b205f', '#24133f'], glow: '#ffcf6b', sun: true, boss: 'gloom' },

  { name: 'Moonlit Sea', top: '#0a0d2c', mid: '#1b2868', low: '#4060b0', hill: ['#22337a', '#152259', '#0b143c'], glow: '#dfe9ff', moon: true, sea: true, boss: 'jelly' },

  { name: 'Crystal Caves', top: '#08051a', mid: '#1a1140', low: '#35215f', hill: ['#2d2155', '#1e163d', '#130d29'], glow: '#8ff0ff', cave: true, peaks: true, boss: 'mole' },
  { name: 'Rainbow Palace', top: '#160a38', mid: '#4a1f7e', low: '#ff9fc6', hill: ['#5f2c90', '#41196c', '#29104b'], glow: '#ffe28a', rainbow: true, palace: true, boss: 'king' },
];
// the sticker for reaching each zone (the first two are where everyone starts)
const ZONE_STICKERS = [null, null, 'aurora', 'moon', 'cosmos', 'castle', 'caves', 'palace'];
const stageInfo = (i) => STAGES[i % STAGES.length];

const Sky = {
  w: 1, h: 1, px: 1, t: 0, cache: {}, ridges: {}, thumbs: {}, stars: [], from: 0, to: 0, blend: 1, shoot: null,
  born: {}, gCanvas: null, gKey: '',
  resize(w, h, px) {
    this.w = w; this.h = h; this.px = Math.min(px, 1.5); this.cache = {}; this.ridges = {}; this.gKey = '';
    const rng = mulberry32(7), n = Math.floor((w * h) / 7000);
    this.stars = [];
    for (let i = 0; i < n; i++) this.stars.push({ x: rng() * w, y: rng() * h * 0.8, r: 0.6 + rng() * 1.6, sp: 0.6 + rng() * 2.2, ph: rng() * TAU });
  },
  set(i, instant) {
    i %= STAGES.length;
    if (instant) { this.from = this.to = i; this.blend = 1; return; }
    if (i === this.to) return;
    this.from = this.to; this.to = i; this.blend = 0;
  },
  layer(i) {
    if (!this.cache[i]) this.cache[i] = this.paint(i);
    return this.cache[i];
  },
  paint(i) { return this.paintStage(i, this.w, this.h, this.px, (this.ridges[i] = { step: 8, mid: [], front: [] })); },
  // a small picture of a zone for the Adventure map, painted as if on a 600 x 300 screen
  thumb(i, px) {
    const k = i + '|' + px;
    return this.thumbs[k] || (this.thumbs[k] = this.paintStage(i, 600, 300, px, null));
  },
  // ridge: if given, the two nearest ridge lines are kept in it, for planting the Sky Garden
  paintStage(i, w, h, px, ridge) {
    const st = STAGES[i], c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * px)); c.height = Math.max(1, Math.round(h * px));
    const g = c.getContext('2d'), rng = mulberry32(100 + i);
    g.scale(px, px);
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, st.top); sky.addColorStop(0.55, st.mid); sky.addColorStop(1, st.low);
    g.fillStyle = sky; g.fillRect(0, 0, w, h);

      const sx = w * 0.72, sy = h * 0.8, rg = g.createRadialGradient(sx, sy, 0, sx, sy, m * 0.7);
      rg.addColorStop(0, 'rgba(255,214,120,.75)'); rg.addColorStop(0.15, 'rgba(255,170,110,.35)'); rg.addColorStop(1, 'rgba(255,150,120,0)');

      g.fillStyle = '#ffd98a'; g.beginPath(); g.arc(sx, sy, m * 0.09, 0, TAU); g.fill();
    }
    if (st.moon) {
      const mx = w * 0.78, my = h * 0.18, mr = m * 0.08, rg = g.createRadialGradient(mx, my, 0, mx, my, mr * 5);
      rg.addColorStop(0, 'rgba(220,230,255,.45)'); rg.addColorStop(1, 'rgba(220,230,255,0)');
      g.fillStyle = rg; g.fillRect(0, 0, w, h);
      g.fillStyle = '#eef2ff'; g.beginPath(); g.arc(mx, my, mr, 0, TAU); g.fill();
      g.fillStyle = 'rgba(160,170,210,.45)';
      [[-0.3, -0.2, 0.22], [0.25, 0.1, 0.16], [-0.05, 0.35, 0.12]].forEach(([a, b, r]) => { g.beginPath(); g.arc(mx + a * mr, my + b * mr, r * mr, 0, TAU); g.fill(); });
    }
    if (st.planets) {
      [[0.18, 0.2, 0.07, '#ffb36b'], [0.85, 0.32, 0.045, '#7fe0ff']].forEach(([px, py, pr, col], k) => {
        const x = w * px, y = h * py, r = m * pr;
        g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        g.fillStyle = 'rgba(0,0,0,.18)'; g.beginPath(); g.arc(x + r * 0.35, y + r * 0.2, r * 0.85, 0, TAU); g.fill();
        if (k === 0) { g.strokeStyle = 'rgba(255,230,200,.7)'; g.lineWidth = r * 0.18; g.beginPath(); g.ellipse(x, y, r * 1.7, r * 0.45, -0.3, 0, TAU); g.stroke(); }
      });
    }
    if (st.rainbow) {
      // a great rainbow over the palace
      ['#ff7a8a', '#ffb35c', '#ffe066', '#7fe08a', '#6cc6ff', '#b18cff'].forEach((col, k) => {
        g.strokeStyle = toRGBA(col, 0.3); g.lineWidth = m * 0.036;
        g.beginPath(); g.arc(w * 0.5, h * 0.95, m * (0.78 - k * 0.036), Math.PI, TAU); g.stroke();
      });
    }
    if (st.cave) {

      for (let x = 0; x <= w + 30; x += 30) { g.lineTo(x, h * 0.03 + rng() * m * 0.03); g.lineTo(x + 15, h * 0.03 + m * (0.05 + rng() * 0.12)); }
      g.lineTo(w, 0); g.closePath(); g.fill();
    } else {
      // soft clouds (fluffier and brighter round the Cloud Castle)
      for (let k = 0; k < (st.puffy ? 8 : 5); k++) {
        const cx = rng() * w, cy = h * (0.15 + rng() * 0.45), cr = m * (0.08 + rng() * 0.1);
        g.fillStyle = st.puffy ? 'rgba(255,255,255,.1)' : 'rgba(255,255,255,.05)';
        for (let j = 0; j < 4; j++) { g.beginPath(); g.ellipse(cx + (j - 1.5) * cr * 0.8, cy + Math.sin(j) * cr * 0.2, cr, cr * 0.5, 0, 0, TAU); g.fill(); }
      }
    }
    // hills, back to front
    const back = [];
    for (let k = 0; k < 3; k++) {
      const base = h * (0.8 + k * 0.065), amp = m * (st.peaks ? 0.14 - k * 0.03 : st.puffy ? 0.06 - k * 0.01 : 0.05 - k * 0.008);
      const f1 = (2 + rng() * 3) / w * TAU, f2 = (5 + rng() * 6) / w * TAU, p1 = rng() * TAU, p2 = rng() * TAU;
      g.fillStyle = st.hill[k]; g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w + 8; x += 8) {
        // peaks: jagged; puffy: banks of round cloud tops; otherwise rolling hills
        const wave = st.peaks ? 1 - Math.abs(Math.sin(x * f1 * 0.7 + p1)) * 1.4 + Math.sin(x * f2 + p2) * 0.15
          : st.puffy ? Math.abs(Math.sin(x * f1 * 2.2 + p1)) * 0.9 + Math.sin(x * f2 + p2) * 0.2
          : Math.sin(x * f1 + p1) * 0.6 + Math.sin(x * f2 + p2) * 0.4;
        g.lineTo(x, base - amp * wave);
        if (k === 0) back.push(base - amp * wave);

      if (k === 0 && st.palace) this.paintPalace(g, w * 0.5, back[Math.round((w * 0.5) / 8)], m);
      if (k === 1 && st.cave) this.paintCrystals(g, w, h, m, rng);
      if (st.sea && k === 2) {
        const sea = g.createLinearGradient(0, h * 0.9, 0, h);
        sea.addColorStop(0, '#24357e'); sea.addColorStop(1, '#0b133a');
        g.fillStyle = sea; g.fillRect(0, h * 0.9, w, h * 0.1);
        g.strokeStyle = 'rgba(220,230,255,.25)'; g.lineWidth = 2;
        for (let j = 0; j < 14; j++) { const y = h * (0.915 + rng() * 0.08), x = w * 0.78 + (rng() - 0.5) * m * 0.3; g.beginPath(); g.moveTo(x - 20, y); g.lineTo(x + 20, y); g.stroke(); }
      }
    }
    // tiny glowing flowers on the nearest hill (they twinkle in the meadow stages)
    if (!st.sea && !st.peaks && !st.puffy) {
      for (let k = 0; k < 26; k++) {
        const x = rng() * w, y = h * (0.94 + rng() * 0.05);
        g.fillStyle = k % 3 ? 'rgba(255,240,180,.55)' : 'rgba(255,160,210,.55)';
        g.beginPath(); g.arc(x, y, 1.5 + rng() * 2, 0, TAU); g.fill();
      }
    }
    return c;
  },
  paintCastle(g, x, y, m) {
    const u = m * 0.03, wall = '#8a76cf', roof = '#6a55b8', lit = '#ffe9a8';
    g.fillStyle = wall; g.fillRect(x - u * 4, y - u * 5, u * 8, u * 6);
    for (let k = 0; k < 4; k++) g.fillRect(x - u * 4 + k * u * 2.3, y - u * 6, u * 1.2, u * 1.2);
    [[-4.6, 9, 1.8], [0, 12, 2.2], [4.6, 8, 1.8]].forEach(([dx, th, tw]) => {
