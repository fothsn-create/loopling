// ---------- the autopilot used by the title-screen demo (and by the self-test) ----------
class Bot {
  constructor() { this.speed = 560; this.cx = 0; this.cy = 0; this.R = 80; this.a = 0; this.left = 0; this.dir = 1; this.focus = null; }
  target(w, dt) {
    if (this.left <= 0) this.choose(w);
    if (this.focus && !this.focus.dead) {
      const k = Math.min(1, dt * 2.5);
      this.cx += (this.focus.x - this.cx) * k; this.cy += (this.focus.y - this.cy) * k;
    }
    const om = (this.speed * 0.92) / this.R;
    this.a += this.dir * om * dt; this.left -= om * dt;
    let tx = this.cx + Math.cos(this.a) * this.R, ty = this.cy + Math.sin(this.a) * this.R;
    // steer round anything that would bump it, a rough stand-in for a player dodging
    for (const e of w.ents) {
      if (e.dead) continue;
      if (e.type === 'bolt') { if (Math.abs(tx - e.x) < e.w / 2 + 30) tx = e.x + (tx < e.x ? -1 : 1) * (e.w / 2 + 30); continue; }
      if (!e.hurts || e.type === 'boss') continue;
      const min = e.r + w.p.r + (e === this.focus ? 8 : 26), dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
      if (d < min && d > 0.01) { tx = e.x + (dx / d) * min; ty = e.y + (dy / d) * min; }
    }
    return { x: tx, y: ty };
  }
  choose(w) {
    const p = w.p, goal = w.lv && !w.lv.boss ? w.lv.goal : null;
    let best = null, bs = -Infinity;
    for (const e of w.ents) {
      if (e.dead || !e.loopable || (e.type === 'boss' && e.state !== 'fight')) continue;
      let n = 0;
      for (const f of w.ents) if (!f.dead && f.loopable && d2(e.x, e.y, f.x, f.y) < 70 * 70) n++;
      const wanted = (goal === 'cheer' && e.type === 'gloomy') || (goal === 'prickle' && e.type === 'prickle') || (goal === 'zipper' && e.type === 'zipper') || (goal === 'gold' && e.gold);
      const sc = n * 100 - Math.sqrt(d2(e.x, e.y, p.x, p.y)) * 0.15 + (e.type === 'boss' ? 500 : 0) + (e.type === 'gloomy' ? 60 : 0) + (wanted ? 400 : 0);
      if (sc > bs) { bs = sc; best = e; }
    }
    if (!best) { this.focus = null; this.cx = w.W / 2 + rand(-w.W * 0.25, w.W * 0.25); this.cy = w.H / 2 + rand(-w.H * 0.2, w.H * 0.2); this.R = 80; }
    else if (best.type === 'star' || best.type === 'power') {
      // circle the middle of the group, wide enough to take it all in
      const near = w.ents.filter((f) => !f.dead && f.loopable && d2(best.x, best.y, f.x, f.y) < 80 * 80);
      let sx = 0, sy = 0, far = 0;
      for (const f of near) { sx += f.x / near.length; sy += f.y / near.length; }
      for (const f of near) far = Math.max(far, Math.hypot(f.x - sx, f.y - sy) + f.r);
      this.focus = null; this.cx = sx; this.cy = sy; this.R = Math.max(64, far + 40);
    } else {
      this.focus = best.type === 'star' || best.type === 'power' ? null : best;
      this.cx = best.x; this.cy = best.y;
      this.R = best.type === 'boss' ? bossRing(best) + 14 : best.kind === 'big' ? 86 : best.type === 'prickle' ? 96 : 64 + rand(0, 24);
    }
    this.cx = clamp(this.cx, this.R * 0.6, w.W - this.R * 0.6); this.cy = clamp(this.cy, this.R * 0.6, w.bottom - this.R * 0.6);
    this.a = Math.atan2(p.y - this.cy, p.x - this.cx);
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.left = TAU + 0.9;
  }
}

// ---------- first-run tutorial ----------
class Tutorial {
  constructor(w) { this.w = w; this.step = 0; this.t = 0; this.moved = 0; this.cluster = []; this.respawn = 0; this.enter(); }
  message() {
    const how = Input.kind === 'keys' ? 'Use the arrow keys or WASD to fly'
      : Input.kind !== 'touch' ? 'Move your mouse to fly'
      : Save.data.set.ctrl === 'drag' ? 'Drag anywhere on the screen to fly'
      : 'Put your finger on the screen and move it. Loopling follows!';
    return [how, 'Fly into the stars to grab them',
      'Now draw a circle all the way round these stars to loop them all at once',
      'A grumpy Gloomy! Loop round it to cheer it up. Try not to bump into it.',
      'Brilliant! The more you catch in one loop, the more points you get.'][this.step];
  }
  enter() {
    const w = this.w, W = w.W, H = w.H;
    this.t = 0;
    if (this.step === 1) [[0.28, 0.42], [0.72, 0.42], [0.5, 0.28]].forEach(([x, y]) => w.spawnStar(W * x, H * y, { life: 999, dx: 0, dy: 0, gold: false }));
    if (this.step === 2) this.spawnCluster();
    if (this.step === 3) w.add('gloomy', { kind: 'gloomy', x: W / 2, y: H * 0.3, r: 26, spd: 22, hurts: true, spawn: 0.35 });
    UI.tip(this.message());
  }
  spawnCluster() {
    const w = this.w, cx = w.W / 2, cy = w.H * 0.42;
    this.cluster = [];
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU;
      this.cluster.push(w.spawnStar(cx + Math.cos(a) * 34, cy + Math.sin(a) * 34, { life: 999, dx: 0, dy: 0, gold: i === 0, spawn: 0.35 + i * 0.08 }));
    }
    this.cx = cx; this.cy = cy;
  }
  update(dt) {
    const w = this.w, p = w.p;
    this.t += dt;
    if (this.step === 0) { this.moved += Math.hypot(p.vx, p.vy) * dt; if (this.moved > 700) this.next(); }
    else if (this.step === 1) { if (!w.count('star')) this.next(); }
    else if (this.step === 2) {
      if (this.cluster.filter((e) => !e.dead).length < 2) { this.respawn -= dt; if (this.respawn <= 0) { this.spawnCluster(); UI.tip('Close! Fly round them in a circle without touching them'); } }
      else this.respawn = 0.8;
    } else if (this.step === 3) { if (!w.count('gloomy')) this.next(); }
    else if (this.step === 4 && this.t > 2.8) App.tutorialDone();
  }
  onStar() {}
  onSnip() {}
  onLoop(caught) { if (this.step === 2 && caught.filter((e) => e.type === 'star').length >= 2) this.next(); }
  onCheer() {}
  next() { this.step++; Sound.jingle(); this.enter(); }
  draw(ctx) {
    const t = this.t;
    let cx, cy, R;
    if (this.step === 2) { cx = this.cx; cy = this.cy; R = 80; }
    else if (this.step === 3) { const g = this.w.ents.find((e) => e.type === 'gloomy' && !e.dead); if (!g) return; cx = g.x; cy = g.y; R = 74; }
    else return;
    ctx.setLineDash([8, 10]); ctx.lineDashOffset = -t * 40;
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 3; circle(ctx, cx, cy, R); ctx.stroke(); ctx.setLineDash([]);
    const a = t * 2.4;
    drawGlow(ctx, cx + Math.cos(a) * R, cy + Math.sin(a) * R, 26, '#ffffff', 0.8);
  }
}

// ===== bosses.js =====
// ---------- bosses: one for each zone, and the attacks they use ----------
// A boss is cheered up a little each time you fly right round it: with a closed loop, or simply by
// circling it once (windBoss), so a circle that never quite closes still counts.
const BOSSES = {
  gloom: { name: 'Big Gloom', sub: 'Circle right round it to cheer it up!', hp: 3, r: 80 },
  thunder: { name: 'Thunder Puff', sub: 'Dodge the lightning and circle the cloud!', hp: 4, r: 76 },
  prickle: { name: 'Prickle King', sub: 'Circle him while his spikes are down!', hp: 4, r: 62 },
  jelly: { name: 'Wobble Jelly', sub: 'Circle it, then circle all the little ones!', hp: 7, r: 70 },
  moon: { name: 'Gobble Moon', sub: 'Circle wide, round its candy moons!', hp: 5, r: 56 },
  dragon: { name: 'Bubble Dragon', sub: 'Loop bubbles to pop them, and circle the dragon!', hp: 5, r: 60 },
  mole: { name: 'Grumble Mole', sub: 'Circle him when he pops out of a hole!', hp: 5, r: 50 },
  king: { name: 'King Grump', sub: 'The grumpiest of them all. Circle round him!', hp: 7, r: 84 },
};
const BOSS_ORDER = STAGES.map((st) => st.boss);
const BOSS_STICKER = { gloom: 'boss', thunder: 'thunder', prickle: 'pking', jelly: 'jelly', moon: 'gmoon', dragon: 'dragon', mole: 'mole', king: 'king' };
const BOSS_LINES = ['Hee hee!', 'That tickles!', 'Haha!', 'Hehe, stop!', 'Wheee!', 'Oh, you!'];
const MOLE_HOLES = [[0.27, 0.36], [0.73, 0.32], [0.3, 0.64], [0.72, 0.6]];
// How far out to fly to circle a boss: the dotted guide ring. The Gobble Moon's candy moons push it out.
function bossRing(b) { return b.kind === 'moon' ? b.r + 100 : b.r + 30; }

Object.assign(World.prototype, {
  spawnBoss(kind = stageInfo(this.stage).boss) {
    const B = BOSSES[kind], lap = Math.floor(this.stage / STAGES.length);
    const hp = kind === 'jelly' ? 7 : B.hp + Math.min(2, lap);
    const b = this.add('boss', { kind, x: this.W / 2, y: -B.r * 1.6, r: B.r, hp, maxHp: hp, state: 'enter', loopCD: 0, attackT: 2.4, attacks: 0,
      hurts: false, flash: 0, squish: 0, drizzle: 0, dropT: 0, spawn: 0, wind: 0, windA: null, gen: 0, phase: 'soft', phaseT: 4.5, spike: 0, face: 1 });
    this.boss = b;
    if (kind === 'mole') {
      b.hole = randi(0, 3); b.mole = 'hide'; b.mt = 1.4; b.pop = 0; b.state = 'fight'; b.loopable = false; b.home = b.t;
      this.placeMole(b);
    }
    this.banner = { title: B.name + '!', sub: B.sub, t: 0 };
    Music.play('boss', this.stage); Sound.bossIn();
    return b;
  },

  updateBoss(b, dt) {
    b.loopCD = Math.max(0, b.loopCD - dt); b.flash = Math.max(0, b.flash - dt * 3); b.squish *= Math.exp(-8 * dt);
    if (b.state === 'cheered') {
      b.y -= 70 * dt; b.x += Math.sin(b.t * 2) * 30 * dt;
      if (b.t - b.doneT > 2.6) b.dead = true;
      return;
    }
    if (b.kind === 'mole') { this.updateMole(b, dt); this.windBoss(b, dt); return; }
    const homeY = this.H * 0.36;
    if (b.state === 'enter') {
      b.y += (homeY - b.y) * Math.min(1, dt * 1.4);
      if (Math.abs(b.y - homeY) < 6) {
        b.state = 'fight'; b.home = b.t;
        if (b.kind === 'moon') for (let i = 0; i < 3; i++) this.addRock(b);
      }
      return;
    }
    this.moveBoss(b, dt, homeY);
    b.attackT -= dt;
    if (b.attackT <= 0) { b.attacks++; b.attackT = this.bossAttack(b); }
    if (b.drizzle > 0) {
      b.drizzle -= dt; b.dropT -= dt;
      if (b.dropT <= 0) {
        b.dropT = 0.16;
        this.add('drop', { x: b.x + rand(-b.r * 0.8, b.r * 0.8), y: b.y + b.r * 0.5, r: 7, vx: rand(-30, 30), vy: rand(200, 260), hurts: true, loopable: false, spawn: 0 });
        Sound.plip();
      }
    }
    if (b.kind === 'prickle') this.updateSpikes(b, dt);
    this.windBoss(b, dt);
  },
  moveBoss(b, dt, homeY) {
    const W = this.W, ft = b.t - b.home;
    if (b.kind === 'jelly') {
      // jellies drift, give a little push every so often, and bounce off the edges
      b.swimT = (b.swimT || 0) - dt;
      if (b.swimT <= 0) {
        b.swimT = rand(1.4, 2.2); b.squish = 0.12;
        const a = Math.atan2(this.p.y - b.y, this.p.x - b.x) + rand(-1.6, 1.6);
        b.vx += Math.cos(a) * 90; b.vy += Math.sin(a) * 90;
      }
      const k = Math.exp(-1.2 * dt), top = b.r + 10, low = Math.max(top + 10, this.bottom * 0.8 - b.r);
      b.vx *= k; b.vy *= k;
      b.x += b.vx * dt; b.y += (b.vy + Math.sin(b.t * 2 + b.ph) * 14) * dt;
      if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); } else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
      if (b.y < top) { b.y = top; b.vy = Math.abs(b.vy); } else if (b.y > low) { b.y = low; b.vy = -Math.abs(b.vy); }
      return;
    }
    // everyone else sways about the top half, leaving room to circle round them
    const ax = Math.max(0, W / 2 - bossRing(b) - 20), ay = this.H * (b.kind === 'dragon' ? 0.18 : 0.14);
    const fast = b.kind === 'king' ? 1.2 : b.kind === 'prickle' ? 0.8 : 1;
    let tx, ty;
    if (b.kind === 'dragon') { tx = W / 2 + Math.sin(ft * 0.45) * ax * 0.8; ty = homeY + Math.sin(ft * 0.9) * ay; } // a figure of eight
    else { tx = W / 2 + Math.sin(ft * 0.33 * fast) * ax * 0.75; ty = homeY + Math.sin(ft * 0.52 * fast) * ay; }
    const k = Math.min(1, dt * 1.2), mx = (tx - b.x) * k;
    if (Math.abs(mx) > dt * 12) b.face = Math.sign(mx);
    b.x += mx; b.y += (ty - b.y) * k;
  },
  // Starts the next attack and returns the time until the one after.
  bossAttack(b) {
    const hurt = 1 - b.hp / b.maxHp, n = b.attacks;
    const pace = Math.max(1.8, 3.4 - hurt * 1.2 - Math.min(this.stage, 8) * 0.08);
    switch (b.kind) {
      case 'gloom': if (n % 2) this.bossMinis(b); else b.drizzle = 1.3; return pace;
      case 'thunder': if (n % 3 === 2) b.drizzle = 1.1; else this.bossBolts(b, 1 + Math.round(hurt * 2)); return pace;
      case 'jelly': this.shoot(b, 'bubble', 2, 0.5, 120); return rand(2.8, 3.8);
      case 'moon': this.shoot(b, 'candy', 3, 0.35, 150); return pace + 0.6;
      case 'dragon': if (n % 3 === 0) this.ringShots(b, 'bubble', 10, 90); else this.shoot(b, 'bubble', 5, 0.28, 150); Sound.puff(); return pace;
      case 'king':
        // King Grump borrows everybody's tricks in turn
        [() => this.bossMinis(b), () => (b.drizzle = 1.3), () => this.bossBolts(b, 2), () => this.ringShots(b, 'needle', 10, 200), () => this.shoot(b, 'bubble', 5, 0.28, 150)][n % 5]();
        return pace;
    }
    return pace; // the Prickle King's attack is its spikes (updateSpikes)
  },
  bossMinis(b) { this.spawnMinis(3 + (this.stage > 2 ? 1 : 0), { x: b.x, y: b.y + b.r * 0.5 }); Sound.boop(); b.squish = 0.12; },
  // Lightning: a flickering stripe first (one right where Loopling is), then the strike.
  bossBolts(b, n) {
    const xs = [clamp(this.p.x, 30, this.W - 30)];
    for (let tries = 0; xs.length < n && tries < 30; tries++) { const x = rand(30, this.W - 30); if (xs.every((q) => Math.abs(q - x) > 110)) xs.push(x); }
    for (const x of xs) this.add('bolt', { x, y: 0, w: 46, warn: 1.1, strike: 0, hurts: false, loopable: false, spawn: 0 });
    Sound.zapCharge();
  },
  // n shots fanned out towards Loopling
  shoot(b, kind, n, spread, speed) {
    const a0 = Math.atan2(this.p.y - b.y, this.p.x - b.x);
    for (let i = 0; i < n; i++) this.addShot(b, kind, a0 + (i - (n - 1) / 2) * spread, speed);
    b.squish = 0.12;
  },
  ringShots(b, kind, n, speed) {
    const a0 = rand(0, TAU);
    for (let i = 0; i < n; i++) this.addShot(b, kind, a0 + (i / n) * TAU, speed);
    b.squish = 0.15;
  },
  addShot(b, kind, a, speed) {
    const x = b.x + Math.cos(a) * b.r * 0.8, y = b.y + Math.sin(a) * b.r * 0.8, vx = Math.cos(a) * speed, vy = Math.sin(a) * speed;
    if (kind === 'bubble') this.add('bubble', { x, y, r: 14, vx, vy, life: 7, hurts: true, loopable: true, spawn: 0.2 });
    else this.add('needle', { kind, x, y, r: kind === 'candy' ? 11 : 9, vx, vy, hurts: true, loopable: false, spawn: 0 });
  },
  // The Prickle King's spikes come out every few seconds. Then he can't be circled, and he flings needles.
  updateSpikes(b, dt) {
    b.phaseT -= dt;
    const hurt = 1 - b.hp / b.maxHp;
    if (b.phase === 'soft' && b.phaseT <= 0) { b.phase = 'warn'; b.phaseT = 0.9; Sound.zapCharge(); }
    else if (b.phase === 'warn' && b.phaseT <= 0) { b.phase = 'spiky'; b.phaseT = 2.4; this.ringShots(b, 'needle', 8 + Math.round(hurt * 4), 200); Sound.snip(); this.addShake(4); }
    else if (b.phase === 'spiky' && b.phaseT <= 0) { b.phase = 'soft'; b.phaseT = rand(4, 5) - hurt; }
    b.spike += ((b.phase === 'spiky' ? 1 : 0) - b.spike) * Math.min(1, dt * 10);
    b.loopable = b.phase !== 'spiky';
  },
  // The Gobble Moon gains another candy moon every time it's circled.
  addRock(b) {
    const rocks = this.ents.filter((e) => !e.dead && e.type === 'rock' && e.owner === b);
    if (rocks.length >= 7) return;
    const base = rocks.length ? rocks[0].ang : 0, n = rocks.length + 1;
    rocks.forEach((e, i) => (e.ang = base + (i * TAU) / n));
    this.add('rock', { owner: b, ang: base + ((n - 1) * TAU) / n, spin: 1.1, x: b.x, y: b.y, r: 15, hurts: true, loopable: false, spawn: 0.3, col: n });
  },
  // The Grumble Mole pops up out of one of four holes, throws crystal pebbles, then ducks back down.
  placeMole(b) { const [fx, fy] = MOLE_HOLES[b.hole]; b.x = fx * this.W; b.y = Math.min(fy * this.H, this.bottom - 110); },
  updateMole(b, dt) {
    b.mt -= dt;
    this.placeMole(b);
    if (b.mole === 'hide') { if (b.mt <= 0) { b.mole = 'rise'; b.mt = 0.45; Sound.molePop(); } }
    else if (b.mole === 'rise') { b.pop = 1 - Math.max(0, b.mt) / 0.45; if (b.mt <= 0) { b.mole = 'up'; b.mt = 4.2 - (1 - b.hp / b.maxHp) * 1.2; b.throwT = 0.9; } }
    else if (b.mole === 'up') {
      b.pop = 1;
      if ((b.throwT -= dt) <= 0) { b.throwT = 1.3; this.throwPebble(b); }
      if (b.mt <= 0) this.moleDuck(b);
    } else if (b.mole === 'duck') {
      b.pop = Math.max(0, b.mt) / 0.35;
      if (b.mt <= 0) { b.mole = 'hide'; b.mt = rand(0.8, 1.4); b.hole = (b.hole + randi(1, 3)) % 4; }
    }
    b.loopable = b.mole === 'up' || (b.mole === 'rise' && b.pop > 0.5);
  },
  moleDuck(b) { if (b.mole === 'up' || b.mole === 'rise') { b.mole = 'duck'; b.mt = 0.35; b.loopable = false; } },
  throwPebble(b) {
    // aimed to land where Loopling is now, a second from now
    const p = this.p, g = 520;
    this.add('pebble', { x: b.x, y: b.y - b.r * 0.6, r: 10, vx: p.x - b.x, vy: p.y - (b.y - b.r * 0.6) - g / 2, hurts: true, loopable: false, spawn: 0, rot: 0 });
    b.squish = 0.1; Sound.boop();
  },

  // ----- circling and hitting -----
  bossOpen(b) { return b.state === 'fight' && b.loopable && !b.dead; },
  // Circling right round a boss is a hit, even if the tail never closes into a loop.
  windBoss(b, dt) {
    const p = this.p, dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy), a = Math.atan2(dy, dx);
    if (b.windA == null) { b.windA = a; return; }
    let da = a - b.windA;
    da -= TAU * Math.round(da / TAU);
    b.windA = a;
    if (!this.bossOpen(b) || this.dying > 0 || this.result || d > bossRing(b) + 230 || d < b.r * 0.6) { b.wind *= Math.exp(-5 * dt); return; }
    if (da * b.wind < 0) b.wind *= Math.exp(-3 * dt); // turning back the other way loses some of the circle
    b.wind += da;
    if (Math.abs(b.wind) >= TAU * 0.95 && b.loopCD <= 0) {
      b.wind = 0;
      const R = Math.max(d, bossRing(b)), poly = [];
      for (let i = 0; i < 28; i++) { const q = (i / 28) * TAU; poly.push(b.x + Math.cos(q) * R, b.y + Math.sin(q) * R); }
      this.onLoop(poly, true);
      p.trail.length = 0; this.len = 0;
    }
  },
  // Bosses are solid but gentle: flying into one just bounces you off. The Prickle King's spikes do sting.
  bumpBoss(b) {
    const p = this.p;
    if (b.state !== 'fight' || (b.kind === 'mole' && b.pop < 0.5) || this.dying > 0) return;
    const min = b.r * 0.78 + p.r * 0.8, dx = p.x - b.x, dy = p.y - b.y, d = Math.hypot(dx, dy) || 1;
    if (d >= min) return;
    if (b.kind === 'prickle' && b.phase === 'spiky') this.hurt(b);
    p.x = clamp(b.x + (dx / d) * min, p.r, this.W - p.r); p.y = clamp(b.y + (dy / d) * min, p.r, this.bottom - p.r);
    if (p.bumpT <= 0) { p.bumpT = 0.35; Sound.boop(); this.addShake(2); b.squish = 0.1; }
  },
  bossHit(b) {
    b.loopCD = 0.5; b.flash = 1; b.squish = 0.18; b.wind = 0;
    Sound.giggle();
    this.fx.text(b.x, b.y - b.r - 14, pick(BOSS_LINES), { size: 24, col: '#ffd6ec', life: 1.2 });
    this.fx.burst(b.x, b.y, 24, ['#ffd6ec', '#ffffff', '#ffe066'], { kind: 'star', max: 320 });
    // a Wobble Jelly's hit points belong to the whole fight, which this.boss holds
    const fight = b.kind === 'jelly' && this.boss ? this.boss : b;
    fight.hp--;
    if (b.kind === 'jelly' && fight.hp > 0) this.jellyHit(b);
    else if (b.kind === 'mole') this.moleDuck(b);
    else if (b.kind === 'moon' && fight.hp > 0) this.addRock(b);
    return fight.hp > 0 ? VALUE.boss : this.bossCheered(b);
  },
  // A Wobble Jelly splits in two when circled, twice over: 1 big one, then 2, then 4 little ones (7 hits).
  jellyHit(b) {
    if (b.gen >= 2) { this.cheerBlob(b); return; }
    b.gen++; b.r = Math.round(b.r * 0.72); b.loopCD = 0.6;
    const a = rand(0, TAU);
    this.add('boss', { kind: 'jelly', gen: b.gen, x: b.x, y: b.y, r: b.r, hp: 1, maxHp: 1, state: 'fight', home: b.home, loopCD: 0.6, attackT: rand(1.5, 3), attacks: 0,
      hurts: false, flash: 1, squish: 0.2, drizzle: 0, dropT: 0, spawn: 0, wind: 0, windA: null, face: 1, vx: -Math.cos(a) * 160, vy: -Math.sin(a) * 160 });
    b.vx = Math.cos(a) * 160; b.vy = Math.sin(a) * 160;
    Sound.pop();
  },
  cheerBlob(b) {
    b.state = 'cheered'; b.loopable = false; b.doneT = b.t;
    this.fx.confetti(b.x, b.y, 24); this.plant(b.x, b.y, 1);
    if (this.boss === b) {
      // hand the fight over to a jelly that is still grumpy
      const next = this.ents.find((e) => !e.dead && e.type === 'boss' && e !== b && e.state === 'fight');
      if (next) { next.hp = b.hp; next.maxHp = b.maxHp; this.boss = next; }
    }
  },
  bossCheered(b) {
    b.state = 'cheered'; b.hurts = false; b.loopable = false; b.doneT = b.t;
    this.boss = null; this.run.boss++; this.ev('boss', 1); this.sticker(BOSS_STICKER[b.kind]);
    this.plant(b.x, b.y, 5);
    Sound.fanfare(); buzz(60); this.flash = 0.6; this.flashCol = '#fff3c4'; this.addShake(10);
    this.fx.confetti(b.x, b.y, 90);
    for (let i = 0; i < 14; i++) { const a = (i / 14) * TAU; this.spawnStar(b.x, b.y, { vx: Math.cos(a) * 280, vy: Math.sin(a) * 280, spawn: 0.1 }); }
    for (const e of this.ents) {
      if (e.dead || e === b) continue;
      if (SHOTS.has(e.type)) this.popShot(e, true);
      else if (e.type === 'rock') { e.dead = true; this.spawnStar(e.x, e.y, { gold: true, spawn: 0.1 }); }
      else if (e.type === 'gloomy') this.cheer(e, true);
      else if (e.type === 'boss' && e.state === 'fight') { e.state = 'cheered'; e.loopable = false; e.doneT = e.t; }
    }
    this.spawnPower(clamp(b.x, 60, this.W - 60), clamp(b.y + 40, 80, this.H - 60));
    if (this.hearty && this.p.hearts < this.p.maxHearts) {
      this.p.hearts++; this.heartPop = 1;
      this.fx.text(this.p.x, this.p.y - 50, '+1 heart', { size: 22, col: '#ff8fbd', life: 1.4 });
    }
    this.stageClearT = 2.6;
    return 1000 + this.stage * 500;
  },

  // ----- the attacks themselves -----
  popShot(e, quiet) {
    e.dead = true;
    if (e.type === 'bubble') { this.fx.burst(e.x, e.y, 8, ['#ffffff', '#bfe9ff', '#ffd6f5'], { max: 140 }); if (!quiet) Sound.pop(); }
    else this.fx.burst(e.x, e.y, 5, '#ffffff', { max: 90 });
  },
  updateShot(e, dt) {
    if (e.type === 'bolt') {
      if (e.warn > 0) {
        if ((e.warn -= dt) <= 0) { e.strike = 0.32; Sound.thunder(); this.addShake(5); this.flash = Math.max(this.flash, 0.25); this.flashCol = '#fff6c2'; }
      } else if ((e.strike -= dt) <= 0) e.dead = true;
      return;
    }
    if (e.type === 'rock') {
      const b = e.owner;
      if (!b || b.dead || b.state !== 'fight') { e.dead = true; return; }
      e.ang += e.spin * dt * (1 + 0.12 * (b.maxHp - b.hp));
      const R = b.r + 46 + Math.sin(b.t * 0.9) * 14;
      e.x = b.x + Math.cos(e.ang) * R; e.y = b.y + Math.sin(e.ang) * R;
      return;
    }
    if (e.type === 'bubble') {
      const k = Math.exp(-0.9 * dt);
      e.vx *= k; e.vy *= k;
      e.x += (e.vx + Math.sin(e.t * 2.4 + e.ph) * 26) * dt; e.y += (e.vy - 14) * dt; // they drift upwards a little
      if (e.t > e.life) this.popShot(e, true);
    } else if (e.type === 'pebble') {
      e.vy += 520 * dt; e.x += e.vx * dt; e.y += e.vy * dt; e.rot += dt * 8;
    } else { e.x += e.vx * dt; e.y += e.vy * dt; } // needles and candy
    if (e.x < -60 || e.x > this.W + 60 || e.y < -60 || e.y > this.H + 60) e.dead = true;
  },

  // ----- drawing -----
  drawBossUnder(ctx, b) {
    const t = this.t;
    if (b.kind === 'mole' && b.state === 'fight') {
      MOLE_HOLES.forEach(([fx, fy]) => drawHole(ctx, fx * this.W, Math.min(fy * this.H, this.bottom - 110) + b.r * 0.55, b.r * 1.15, t));
    }
    if (!this.bossOpen(b)) return;
    // a dotted guide ring shows where to fly; it fills in gold as you circle
    const R = bossRing(b);
    ctx.setLineDash([6, 12]); ctx.lineDashOffset = -t * 30;
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 3; circle(ctx, b.x, b.y, R); ctx.stroke();
    ctx.setLineDash([]);
    if (Math.abs(b.wind) > 0.25 && b.windA != null) {
      ctx.strokeStyle = 'rgba(255,216,77,.9)'; ctx.lineWidth = 7; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(b.x, b.y, R, b.windA - b.wind, b.windA, b.wind < 0); ctx.stroke();
    }
  },
  drawBossEnt(ctx, b) {
    const t = this.t, done = b.state === 'cheered', fade = done ? clamp(1 - (b.t - b.doneT) / 2.6, 0, 1) : 1;
    if (done && (b.kind === 'gloom' || b.kind === 'thunder' || b.kind === 'king')) {
      drawSunny(ctx, b.x, b.y, b.r, t, fade);
      if (b.kind === 'king') { ctx.save(); ctx.globalAlpha *= fade; drawCrown(ctx, b.x, b.y - b.r * 0.92, b.r * 0.7); ctx.restore(); }
      return;
    }
    const happy = done ? 1 : b.kind === 'jelly' ? b.gen / 3 : 1 - b.hp / b.maxHp;
    const o = { t, happy, flash: b.flash, squish: b.squish, lookX: b.lookX, lookY: b.lookY, ph: b.ph };
    ctx.save(); ctx.globalAlpha *= fade;
    switch (b.kind) {
      case 'gloom': drawBoss(ctx, b.x, b.y, b.r, o); break;
      case 'thunder': drawThunder(ctx, b.x, b.y, b.r, o); break;
      case 'prickle': drawPrickleKing(ctx, b.x, b.y, b.r, Object.assign(o, { spike: b.spike, warn: b.phase === 'warn' && !done })); break;
      case 'jelly': drawJelly(ctx, b.x, b.y, b.r, o); break;
      case 'moon': drawGobbleMoon(ctx, b.x, b.y, b.r, o); break;
      case 'dragon': drawDragon(ctx, b.x, b.y, b.r, Object.assign(o, { face: b.face })); break;
      case 'mole': drawMole(ctx, b.x, b.y, b.r, Object.assign(o, { pop: done ? 1 : b.pop, free: done })); break;
      case 'king': drawKing(ctx, b.x, b.y, b.r, o); break;
    }
    ctx.restore();
  },
});

// ===== missions.js =====
// ---------- missions, ranks and the daily gift ----------
const MISSION_DEFS = [
  { id: 'stars', ev: 'star', scope: 'run', tiers: [20, 40, 70, 110, 160], text: (n) => `Collect ${n} stars in one run` },
  { id: 'cheer', ev: 'cheer', scope: 'total', tiers: [5, 15, 30, 50, 80], text: (n) => `Cheer up ${n} Gloomies` },
  { id: 'bigloop', ev: 'loopcount', scope: 'max', tiers: [3, 4, 5, 7, 9], text: (n) => `Catch ${n} things in one loop` },
  { id: 'score', ev: 'score', scope: 'best', tiers: [1000, 3000, 6000, 12000, 25000], text: (n) => `Score ${fmt(n)} in one run` },
  { id: 'chain', ev: 'chain', scope: 'max', tiers: [2, 3, 5, 7, 9], text: (n) => `Make a chain of ${n} loops in a row` },
  { id: 'power', ev: 'power', scope: 'total', tiers: [3, 6, 10, 15, 20], text: (n) => `Grab ${n} power-ups` },
  { id: 'prickle', ev: 'prickle', scope: 'total', tiers: [1, 3, 5, 8, 12], text: (n) => `Loop ${n} Prickle${n > 1 ? 's' : ''}` },
  { id: 'boss', ev: 'boss', scope: 'total', tiers: [1, 2, 3, 5, 8], text: (n) => (n > 1 ? `Cheer up ${n} bosses` : 'Cheer up a boss') },
  { id: 'time', ev: 'time', scope: 'best', tiers: [60, 90, 150, 240, 360], text: (n) => `Keep flying for ${n} seconds in one run` },
  { id: 'gold', ev: 'gold', scope: 'total', tiers: [3, 8, 15, 25, 40], text: (n) => `Collect ${n} golden stars` },
  { id: 'loops', ev: 'loop', scope: 'total', tiers: [20, 50, 100, 180, 300], text: (n) => `Make ${n} loops` },
  { id: 'nohit', ev: 'nohit', scope: 'best', tiers: [500, 1500, 3000, 6000, 10000], text: (n) => `Score ${fmt(n)} without a bump` },
  { id: 'zipper', ev: 'zipper', scope: 'total', tiers: [1, 3, 6, 10, 15], text: (n) => `Loop ${n} Zipper${n > 1 ? 's' : ''}`, need: 2 },
  { id: 'perfect', ev: 'perfect', scope: 'total', tiers: [1, 3, 6, 10, 15], text: (n) => `Draw ${n} perfect round loop${n > 1 ? 's' : ''}` },
  { id: 'fever', ev: 'fever', scope: 'total', tiers: [1, 2, 4, 6, 10], text: (n) => (n > 1 ? `Start Glow Fever ${n} times` : 'Start Glow Fever') },
  { id: 'comet', ev: 'comet', scope: 'total', tiers: [1, 2, 3, 5, 8], text: (n) => `Catch ${n} Rainbow Comet${n > 1 ? 's' : ''}` },
  { id: 'flowers', ev: 'flower', scope: 'run', tiers: [5, 10, 20, 35, 50], text: (n) => `Grow ${n} flowers in one run` },
  { id: 'levels', ev: 'level', scope: 'total', tiers: [1, 3, 5, 8, 12], text: (n) => (n > 1 ? `Win ${n} Adventure levels` : 'Win an Adventure level') },
];
const RANKS = ['Sprout', 'Glimmer', 'Twinkler', 'Sparkler', 'Star Whirler', 'Loop Hero', 'Sky Dancer', 'Moon Racer', 'Cosmic Looper', 'Legend'];
const REVIVE_COST = 40;

const Missions = {
  level() { return 1 + Math.floor(Save.data.mstars / 3); },
  rank(level = this.level()) { return level <= RANKS.length ? RANKS[level - 1] : `Legend ${level - RANKS.length + 1}`; },
  def(id) { return MISSION_DEFS.find((d) => d.id === id); },
  make() {
    const s = Save.data, have = new Set(s.missions.map((m) => m.id));
    const pool = MISSION_DEFS.filter((d) => !have.has(d.id) && (d.need || 0) <= s.stats.maxStage);
    const d = pick(pool.length ? pool : MISSION_DEFS);
    const tier = clamp(Math.floor((this.level() - 1) / 2) + randi(0, 1), 0, d.tiers.length - 1);
    return { id: d.id, tier, target: d.tiers[tier], prog: 0, run: 0, done: false };
  },
  ensure() {
    const s = Save.data;
    s.missions = s.missions.filter((m) => this.def(m.id));
    while (s.missions.length < 3) s.missions.push(this.make());
  },
  refresh() {
    const s = Save.data;
    s.missions = s.missions.filter((m) => !m.done);
    this.ensure(); Save.save();
  },
  text(m) { return this.def(m.id).text(m.target); },
  reward(m) { return 40 + m.tier * 30; },
  startRun() { for (const m of Save.data.missions) m.run = 0; },
  event(name, v) {
    for (const m of Save.data.missions) {
      const d = this.def(m.id);
      if (m.done || d.ev !== name) continue;
      if (d.scope === 'total') m.prog += v;
      else if (d.scope === 'run') { m.run += v; m.prog = Math.max(m.prog, m.run); }
      else m.prog = Math.max(m.prog, v);
      if (m.prog >= m.target) this.complete(m);
    }
  },
  complete(m) {
    const s = Save.data, before = this.level();
    m.done = true; m.prog = m.target;
    const r = this.reward(m);
    s.dust += r; s.mstars++;
    Sound.jingle();
    UI.toast(`Mission done: ${this.text(m)} <b>+${r}</b>`, 'check');
    const after = this.level();
    if (after > before) {
      const bonus = 50 * after;
      s.dust += bonus;
      setTimeout(() => { Sound.fanfare(); UI.toast(`Rank up! You're now a ${this.rank(after)} <b>+${bonus}</b>`, 'trophy'); }, 900);
    }
    Save.save();
  },
};

const Daily = {
  ready() { return Save.data.daily.last !== today(); },
  claim() {
    const d = Save.data.daily;
    d.streak = d.last === today(-1) ? d.streak + 1 : 1;
    d.last = today();
    const amt = 40 + 15 * Math.min(d.streak, 7) + randi(0, 30);
    Save.data.dust += amt;
    Save.save();
    return { amt, streak: d.streak };
  },
};

// ===== levels.js =====
// ---------- Adventure: eight zones of short levels, each zone ending with its boss ----------
// A goal level runs for LEVEL_TIME seconds: reach the goal to win, and win quickly for more stars.
// A boss level is just the zone's boss; the fewer hearts you lose, the more stars.
const GOALS = {
  stars: { ev: 'star', text: (n) => `Collect ${n} stars`, unit: 'stars' },
  cheer: { ev: 'cheer', text: (n) => `Cheer up ${n} Gloomies`, unit: 'Gloomies' },
  big: { ev: 'loopcount', max: true, text: (n) => `Catch ${n} things in one loop`, unit: 'in one loop' },
  score: { ev: 'score', max: true, text: (n) => `Score ${fmt(n)} points`, unit: 'points' },
  chain: { ev: 'chain', max: true, text: (n) => `Make a chain of ${n} loops`, unit: 'loop chain' },
  gold: { ev: 'gold', text: (n) => `Collect ${n} golden stars`, unit: 'golden stars' },
  perfect: { ev: 'perfect', text: (n) => `Draw ${n} perfect round loops`, unit: 'perfect loops' },
  prickle: { ev: 'prickle', text: (n) => `Loop ${n} Prickles`, unit: 'Prickles' },
  zipper: { ev: 'zipper', text: (n) => `Loop ${n} Zippers`, unit: 'Zippers' },
};
// three goal levels per zone; the fourth level is always the zone's boss
const LEVELS = [
  [['stars', 20], ['cheer', 4], ['big', 3]],
  [['score', 1500], ['chain', 3], ['gold', 3]],
  [['stars', 32], ['prickle', 2], ['perfect', 2]],
  [['cheer', 7], ['big', 4], ['score', 3000]],
  [['gold', 5], ['zipper', 2], ['chain', 4]],
  [['stars', 42], ['perfect', 3], ['cheer', 8]],
  [['big', 5], ['prickle', 3], ['score', 5000]],
  [['chain', 5], ['gold', 6], ['cheer', 10]],
];
const LEVEL_TIME = 60;

const Levels = {
  id(z, i) { return `${z}-${i}`; },
  stars(z, i) { return Save.data.adv[this.id(z, i)] || 0; },
  // the first level of a zone opens when the boss before it is beaten; the rest open one by one.
  // Zones past the free ones also need the full game.
  open(z, i) { return Full.zoneOpen(z) && (i > 0 ? this.stars(z, i - 1) > 0 : z === 0 || this.stars(z - 1, 3) > 0); },
  zoneStars(z) { let n = 0; for (let i = 0; i < 4; i++) n += this.stars(z, i); return n; },
  total() { let n = 0; for (let z = 0; z < STAGES.length; z++) n += this.zoneStars(z); return n; },
  // the level to suggest next: the first one that is open but not yet won
  next() {
    for (let z = 0; z < STAGES.length; z++) for (let i = 0; i < 4; i++) if (this.open(z, i) && !this.stars(z, i)) return { z, i };
    return null;
  },
  config(z, i) {
    const g = i < 3 ? LEVELS[z][i] : null;
    return { zone: z, index: i, goal: g ? g[0] : 'boss', target: g ? g[1] : 1, boss: g ? null : STAGES[z].boss, time: g ? LEVEL_TIME : 0, d0: z * 0.32, prog: 0 };
  },
  title(L) { return L.boss ? BOSSES[L.boss].name : GOALS[L.goal].text(L.target); },
  progressText(L) {
    const G = GOALS[L.goal], n = Math.min(L.prog, L.target);
    return L.goal === 'score' ? `${fmt(n)} / ${fmt(L.target)} points` : `${n} / ${L.target} ${G.unit}`;
  },
  // the world reports what happened (see World.ev); goal levels count towards their goal
  track(w, name, v) {
    const L = w.lv;
    if (!L || L.boss || w.result) return;
    const G = GOALS[L.goal];
    if (G.ev !== name) return;
    L.prog = G.max ? Math.max(L.prog, v) : L.prog + v;
    if (L.prog >= L.target) this.win(w);
  },
  win(w) {
    if (w.result) return;
    const L = w.lv;
    // goal levels: stars for time to spare. Boss levels: stars for hearts kept.
    const stars = L.boss ? Math.max(1, 3 - w.run.hits) : w.timeLeft >= L.time * 0.5 ? 3 : w.timeLeft >= L.time * 0.25 ? 2 : 1;
    w.result = { win: true, stars };
    w.p.inv = 99; w.p.mood = 'happy'; w.p.moodT = 99;
    w.banner = { title: L.boss ? 'Boss cheered up!' : 'Goal!', sub: '★'.repeat(stars), t: 0 };
    Sound.fanfare(); w.fx.confetti(w.p.x, w.p.y - 40, 70);
  },
  fail(w, why) {
    if (w.result) return;
    w.result = { win: false, why };
    w.banner = { title: why === 'time' ? "Time's up!" : 'Oh no!', sub: 'Have another go!', t: 0 };
    Sound.aww();
  },
  // Saves the result of a level and returns the stardust it earns:
  // the first win pays a bonus, and every star more than you had before pays too.
  record(L, stars) {
    const id = this.id(L.zone, L.index), before = Save.data.adv[id] || 0;
    if (stars <= before) return { dust: 0, first: false, gained: 0 };
    Save.data.adv[id] = stars;
    const first = before === 0, gained = stars - before;
    const dust = gained * (10 + L.zone * 3) + (first ? (L.boss ? 80 + L.zone * 10 : 20 + L.zone * 4) : 0);
    Save.data.dust += dust; Save.save();
    return { dust, first, gained };
  },
};

// ===== full.js =====
// ---------- the full game: Adventure zones 3 to 8 ----------
// Endless Play, Chill and the first FREE_ZONES Adventure zones are free everywhere. The rest of
// Adventure is the full game: one purchase through Google Play, in the Android app only. The app
// passes on what Google Play says (Loopling.store), and the save keeps a copy so the full game stays
// open with no connection. On the website the full game isn't for sale: it points to the app.
const FREE_ZONES = 2;
const PLAY_URL = ''; // Loopling's Google Play page once it is public: the website then links to it

const Full = {
  price: '',       // Google Play's price in the player's own currency, once the app has it
  pending: false,  // bought, but the payment hasn't gone through yet
  get owned() { return !!Save.data.full; },
  get forSale() { return !!(window.LooplingAndroid && LooplingAndroid.buy); },
  zoneOpen(z) { return z < FREE_ZONES || this.owned; },
  boot() {
    if (!this.forSale) return;
    try { this.store(JSON.parse(LooplingAndroid.store() || '{}')); } catch (e) { /* the app has nothing to say yet */ }
  },
  buy() { if (this.forSale) LooplingAndroid.buy(); },
  // From the Android app: {price}, {owned}, {pending}, or {event: 'cancelled' | 'error' | 'unavailable'}.
  store(m) {
    if (m.price) this.price = m.price;
    if ('pending' in m) this.pending = !!m.pending;
    if ('owned' in m) this.set(!!m.owned);
    if (m.event === 'unavailable') UI.toast("Google Play isn't available right now. Try again later.", 'lock');
    else if (m.event === 'error') UI.toast("That didn't work. Nothing was paid, so try again later.", 'lock');
    if (UI.cur === 'adventure' && App.state === 'menu') UI.show('adventure');
  },
  set(owned) {
    const s = Save.data;
    if (owned === !!s.full) return;
    s.full = owned;
    if (owned) {
      this.pending = false;
      if (!s.owned.hat.includes('heart')) s.owned.hat.push('heart');
      UI.toast('Thank you! The full game is open, and your Thank-you Heart hat is in the Shop.', 'star');
      Sound.fanfare();
      if (App.demo) App.demo.fx.confetti(App.demo.W / 2, App.demo.H * 0.3, 90);
    }
    Save.save();
  },
};

  now: null,
  at(d = new Date()) {
    const m = d.getMonth() + 1, day = d.getDate();
    if ((m === 10 && day >= 20) || (m === 11 && day <= 3)) return 'halloween';
    if (m === 12 || (m === 1 && day <= 6)) return 'winter';
    return null;

  init() {

};

    g.fillStyle = owned ? hsl((i * 47) % 360, 70, 86) : 'rgba(20,12,50,.55)';
    circle(g, 0, 0, s * 0.4); g.fill();
    circle(g, 0, 0, s * 0.4); g.clip();

    }

  },
};

      el('p', { class: 'sub' }, tip),
      r.dust ? el('div', { class: 'earn', html: `+${fmt(r.dust)} ${icon('star')}` }) : null,
      r.run.stickers.length ? el('p', { class: 'fine', style: 'color:var(--sun)' }, 'New stickers: ' + r.run.stickers.map((id) => STICKERS.find((x) => x.id === id).name).join(', ')) : null,
      after ? el('button', { class: 'btn big', 'data-focus': true, onclick: this.tap(() => App.playLevel(after.z, after.i)), html: icon('play') + 'Next level' })
        : paid ? el('button', { class: 'btn big', 'data-focus': true, onclick: this.tap(() => App.home('adventure')), html: icon('map') + 'See the full game' })
        : el('button', { class: 'btn big', 'data-focus': true, onclick: this.tap(() => App.playLevel(z, L.index)), html: icon('retry') + (r.win ? 'Play again' : 'Try again') }),
      el('div', { class: 'row' },
        after || paid ? el('button', { class: 'btn sky', onclick: this.tap(() => App.playLevel(z, L.index)), html: icon('retry') + 'Replay' }) : null,
        el('button', { class: 'btn lilac', onclick: this.tap(() => App.home('adventure')), html: icon('map') + 'Map' })),
      el('div', { class: 'spacer' }));
  },
  s_gift() {
    const box = el('button', { class: 'giftbox', 'aria-label': 'Open the present', html: '<svg viewBox="0 0 24 24" style="fill:var(--rose)" aria-hidden="true"><use href="#i-gift"/></svg>' });
    const area = el('div', { class: 'panel', style: 'align-items:center;text-align:center;max-width:380px' },
      el('h2', { class: 'title' }, 'Daily gift'), el('p', { class: 'sub' }, 'Tap the present to open it'), box);
    box.onclick = this.tap(() => {
      const r = Daily.claim();
      Sound.fanfare(); App.demo.fx.confetti(App.demo.W / 2, App.demo.H * 0.4, 90);
      area.replaceChildren(
        el('h2', { class: 'title' }, 'Hooray!'),
        el('div', { class: 'earn', html: `+${r.amt} ${icon('star')}` }),
        el('p', { class: 'sub' }, r.streak > 1 ? `That's ${r.streak} days in a row! Come back tomorrow for an even bigger gift.` : 'Come back tomorrow for another one. Visit every day to grow your streak.'),
        el('button', { class: 'btn mint', onclick: this.tap(() => this.show('menu')) }, 'Lovely!'));
      area.querySelector('.btn').focus({ preventScroll: true });
    });
    return el('section', { class: 'screen dim' }, el('div', { class: 'spacer' }), area,
      el('button', { class: 'btn ghost', onclick: this.tap(() => this.show('menu')) }, 'Later'), el('div', { class: 'spacer' }));
  },

  // ----- shop -----
  s_shop() {
    const tab = this.shopTab;
    this.prev = el('canvas', { id: 'shop-preview', 'aria-hidden': 'true' });
    this.prevCtx = this.prev.getContext('2d');
    const tabs = el('div', { class: 'tabs', role: 'tablist' },
      [['color', 'Colours'], ['hat', 'Hats'], ['trail', 'Tails'], ['upg', 'Upgrades']].map(([id, label]) =>
        el('button', { class: 'tab', role: 'tab', 'aria-selected': String(tab === id), onclick: this.tap(() => { this.shopTab = id; this.shopSel = null; this.show('shop'); }) }, label)));
    return el('section', { class: 'screen' }, this.head('Shop'), this.prev, tabs, tab === 'upg' ? this.upgrades() : this.grid(tab));
  },
  grid(cat) {
    const list = CATS[cat], s = Save.data, sel = this.shopSel || s.eq[cat];
    const cards = list.map((item) => {
      const owned = s.owned[cat].includes(item.id), on = s.eq[cat] === item.id, seasonal = item.season && !owned, gift = item.full && !owned;
      const c = el('canvas', { width: 144, height: 144, 'aria-hidden': 'true' });
      this.thumb(c, cat, item.id);
      return el('button', { class: `card ${owned ? 'owned' : 'locked'}${on ? ' equipped' : ''}${sel === item.id ? ' sel' : ''}`,
        'aria-label': `${item.name}, ${on ? 'wearing' : owned ? 'owned' : seasonal ? 'seasonal gift' : gift ? 'comes with the full game' : item.price + ' stardust'}`, onclick: this.tap(() => this.choose(cat, item)) },
        c, el('span', null, item.name),
        el('span', { class: 'price', html: on ? 'Wearing' : owned ? 'Owned' : seasonal ? 'Seasonal' : gift ? 'Full game' : icon('star') + fmt(item.price) }));
    });
    const out = [el('div', { class: 'grid' }, cards)];
    const item = byId(list, sel);
    if (item.season && !s.owned[cat].includes(item.id)) {
      out.unshift(el('div', { class: 'buybar' }, el('div', null, el('b', null, item.name),
        el('small', null, item.season === 'halloween' ? 'A free gift that comes back every Halloween.' : 'A free gift that comes back every December.'))));
    } else if (item.full && !s.owned[cat].includes(item.id)) {
      out.unshift(el('div', { class: 'buybar' }, el('div', null, el('b', null, item.name), el('small', null, 'A thank-you that comes with the full game.'))));
    } else if (!s.owned[cat].includes(item.id)) {
      const can = s.dust >= item.price;
      out.unshift(el('div', { class: 'buybar' },
        el('div', null, el('b', null, item.name), el('small', null, can ? 'Looks great on you!' : `You need ${fmt(item.price - s.dust)} more stardust. Play to earn more!`)),
        el('button', { class: 'btn', disabled: !can, onclick: this.tap(() => this.buy(cat, item)), html: `Buy ${icon('star')}${fmt(item.price)}` })));
    }
    return out;
  },
  thumb(c, cat, id) {
    const g = c.getContext('2d'), s = Save.data;
    g.scale(2, 2);
    if (cat === 'color') drawLoopling(g, 36, 40, 19, { color: id, t: 1.2, glow: 0.4 });
    else if (cat === 'hat') drawLoopling(g, 36, 44, 18, { color: s.eq.color, hat: id, t: 1.2, glow: 0.3 });
    else {
      const pts = [];
      for (let i = 0; i < 44; i++) { const a = i * 0.24, r = 4 + i * 0.62; pts.push({ x: 36 + Math.cos(a) * r, y: 36 + Math.sin(a) * r, id: i }); }
      drawTrail(g, pts, pts[43].x, pts[43].y, id, s.eq.color, 1.5, 0.6);
    }
  },
  choose(cat, item) {
    const s = Save.data;
    this.shopSel = item.id;
    if (s.owned[cat].includes(item.id)) { s.eq[cat] = item.id; Save.save(); App.demo.cosm[cat] = item.id; }
    this.show('shop');
  },
  buy(cat, item) {
    const s = Save.data;
    if (s.dust < item.price || s.owned[cat].includes(item.id)) return;
    s.dust -= item.price; s.owned[cat].push(item.id); s.eq[cat] = item.id; Save.save();
    App.demo.cosm[cat] = item.id;
    Sound.coin(); App.demo.fx.confetti(App.demo.W / 2, App.demo.H * 0.25, 60);
    this.toast(`${item.name} unlocked!`);
    if (cat === 'hat') Stickers.give('hat');
    this.show('shop');
  },
  upgrades() {
    const s = Save.data;
    return UPGRADES.map((u) => {
      const lv = s.upg[u.id], max = u.cost.length, cost = u.cost[lv];
      return el('div', { class: 'upg' },
        el('div', { class: 'txt' }, el('b', null, u.name), el('small', null, u.desc),
          el('div', { class: 'pips', html: Array.from({ length: max }, (_, i) => `<i class="${i < lv ? 'on' : ''}"></i>`).join('') })),
        lv >= max ? el('button', { class: 'btn ghost', disabled: true }, 'Maxed')
          : el('button', { class: 'btn mint', disabled: s.dust < cost, 'aria-label': `Upgrade ${u.name} for ${cost} stardust`,
            onclick: this.tap(() => { if (s.dust < cost) return; s.dust -= cost; s.upg[u.id]++; Save.save(); Sound.coin(); this.toast(`${u.name} is now level ${s.upg[u.id]}`); this.show('shop'); }),
            html: icon('star') + fmt(cost) }));
    });
  },
  drawPreview(t) {
    const c = this.prev;
    if (!c || !c.isConnected) return;
    const w = c.clientWidth, h = c.clientHeight, dpr = App.dpr;
    if (!w || !h) return;
    if (c.width !== Math.round(w * dpr) || c.height !== Math.round(h * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); this.prevTrail = []; }
    const g = this.prevCtx, s = Save.data, look = Object.assign({}, s.eq);
    if (this.shopSel && this.shopTab !== 'upg') look[this.shopTab] = this.shopSel;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, h);
    const a = t * 1.7, x = w / 2 + Math.sin(a) * Math.min(w * 0.32, 170), y = h / 2 + 6 + Math.sin(a * 2) * h * 0.24;
    this.prevTrail.push({ x, y, id: this.prevId++ });
    if (this.prevTrail.length > 64) this.prevTrail.shift();
    drawTrail(g, this.prevTrail, x, y, look.trail, look.color, t, 0.8);
    drawLoopling(g, x, y, 24, { t, color: look.color, hat: look.hat, lookX: Math.cos(a), lookY: Math.cos(a * 2) * 0.6, tilt: Math.cos(a) * 0.2 });
  },
};

// ===== main.js =====
// ---------- the app: screens, the frame loop and run bookkeeping ----------
const App = {
  S: 1, W: 1, H: 1, dpr: 1, uiS: 1, safeTop: 0, cssW: 1, cssH: 1, ox: 0, oy: 0, padB: 0, cv: null, ctx: null, probe: null,
  world: null, demo: null, state: 'menu', last: 0, t: 0,
  boot() {
    Save.load(); Missions.ensure(); Save.save();
    this.cv = document.getElementById('cv'); this.ctx = this.cv.getContext('2d');
    this.probe = el('div', { style: 'position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none' });
    document.body.append(this.probe);
    Input.attach(this.cv);
    Input.onKey = (code) => this.key(code);
    addEventListener('pointerdown', () => Sound.unlock());
    UI.init();
    Full.boot();
    Season.init();
    this.resize();
    addEventListener('resize', () => this.resize());
    this.demo = new World('demo', this.W, this.H, this.floor());
    Sky.set(0, true);
    UI.show('menu');
    Music.play('menu');
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (this.state === 'play') this.pause(); Sound.suspend(true); }
      else Sound.suspend(false);
    });
    if (window.LOOPLING_PWA && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
    // the Android app (android/) calls these for its back button, when it goes into the background,
    // and with what Google Play says about the full game
    window.Loopling = { back: () => this.back(), hide: () => { if (this.state === 'play') this.pause(); Sound.suspend(true); }, show: () => Sound.suspend(false),
      store: (m) => Full.store(m) };
    requestAnimationFrame((ts) => this.frame(ts));
  },
  resize() {
    // Size from the canvas itself: inside an embedding page (like the claude.ai viewer on iPhone)
    // that can differ from innerWidth/innerHeight, and iOS may settle it late.
    const r = this.cv.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width || innerWidth)), h = Math.max(1, Math.round(r.height || innerHeight));
    this.cssW = w; this.cssH = h; this.ox = r.left; this.oy = r.top;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = Math.round(w * this.dpr); this.cv.height = Math.round(h * this.dpr);
    this.S = clamp(Math.min(w, h) / 600, 0.5, 1.4);
    this.W = w / this.S; this.H = h / this.S;
    this.uiS = clamp(Math.min(w, h) / 430, 0.85, 1.3);
    this.safeTop = this.probe.getBoundingClientRect().height || 0;
    // On touch screens keep play clear of the bottom 80px: on iPhone that is under Safari's
    // floating toolbar, and on phones generally it is where the swipe-home gesture lives.
    // The Android app runs full screen, so it only needs to clear the gesture edge.
    this.padB = window.LooplingAndroid ? 28 : matchMedia('(pointer: coarse)').matches ? 80 : 0;
    Sky.resize(this.W, this.H, this.S * this.dpr);
    if (this.world) this.world.resize(this.W, this.H, this.floor());
    if (this.demo) this.demo.resize(this.W, this.H, this.floor());
  },
  floor() { return this.padB / this.S; },
  frame(ts) {
    requestAnimationFrame((t) => this.frame(t));
    const r = this.cv.getBoundingClientRect();
    if (Math.round(r.width) !== this.cssW || Math.round(r.height) !== this.cssH || r.left !== this.ox || r.top !== this.oy) this.resize();
    const dt = this.last ? Math.min(0.05, Math.max(0, (ts - this.last) / 1000)) : 1 / 60;
    this.last = ts; this.t += dt;
    Sky.update(dt);
    if (this.state === 'play') {
      this.world.update(dt);
      if (this.world.over) this.onOver();
      else if (this.world.result && this.world.resultT > 1.4) this.levelEnd();
    }
    else if (this.state === 'menu') this.demo.update(dt);
    else if (this.state === 'over') this.world.update(dt);
    else if (this.state === 'revive') { this.world.update(dt * 0.3); UI.drawRevive(dt); }
    this.render();
  },
  render() {
    const ctx = this.ctx, w = this.state === 'menu' ? this.demo : this.world, k = this.dpr * this.S;
    let ox = 0, oy = 0;
    if (w.shake > 0.2) { ox = rand(-1, 1) * w.shake; oy = rand(-1, 1) * w.shake; }
    ctx.setTransform(k, 0, 0, k, ox * k, oy * k);
    Sky.draw(ctx, this.t);
    w.draw(ctx);
    if (w !== this.demo) {
      const u = this.dpr * this.uiS;
      ctx.setTransform(u, 0, 0, u, 0, 0);
      w.drawHUD(ctx, this.cssW / this.uiS, this.cssH / this.uiS, this.safeTop / this.uiS + 4);
    }
    if (UI.cur === 'menu') drawLogo(UI.logoCtx, 760, 300, this.t);
    else if (UI.cur === 'shop') UI.drawPreview(this.t);
  },

  play(mode) {
    if (mode === 'arcade' && !Save.data.tut) mode = 'tutorial';
    Missions.refresh();
    this.world = null;
    this.state = 'play';
    UI.show('play');
    this.world = new World(mode, this.W, this.H, this.floor());
    Missions.startRun();
    Input.takeDelta();
    Sky.set(0, true);
    Sound.muffle(false);
    Music.play(mode === 'chill' ? 'chill' : 'play', 0);
    this.awake(true);
    if (mode !== 'tutorial') {
      this.world.banner = mode === 'chill'
        ? { title: 'Chill mode', sub: 'No bumps and no rush. Just loops.', t: 0 }
        : { title: 'Ready, set, loop!', sub: 'Stage 1 · ' + stageInfo(0).name, t: 0 };
    }
  },
  // An Adventure level: z is the zone (0-7), i the level in it (0-2 goals, 3 the boss).
  playLevel(z, i) {
    Missions.refresh();
    this.world = null;
    this.state = 'play';
    UI.show('play');
    const L = Levels.config(z, i);
    this.world = new World('level', this.W, this.H, this.floor(), L);
    Missions.startRun();
    Input.takeDelta();
    Sky.set(z, true);
    Sound.muffle(false);
    Music.play('play', z);
    this.awake(true);
    this.world.banner = L.boss ? { title: STAGES[z].name, sub: 'Boss level: ' + BOSSES[L.boss].name, t: 0 }
      : { title: Levels.title(L) + '!', sub: `${STAGES[z].name} · Level ${i + 1} · ${L.time} seconds`, t: 0 };
    this.world.zoneSticker();
  },
  tutorialDone() { Save.data.tut = true; Save.save(); UI.hideTip(); this.play('arcade'); },
  pause() { if (this.state !== 'play') return; this.state = 'paused'; UI.show('pause'); Sound.muffle(true); this.awake(false); },
  resume() { if (this.state !== 'paused') return; this.state = 'play'; UI.show('play'); Input.takeDelta(); Sound.muffle(this.world.pw.slow > 0); this.awake(true); },
  restart() {
    const w = this.world;
    this.finish(true);
    if (w.mode === 'level') this.playLevel(w.lv.zone, w.lv.index);
    else this.play(w.mode === 'chill' ? 'chill' : 'arcade');
  },
  onOver() {
    const w = this.world;
    if (w.mode === 'level') { Levels.fail(w, 'hearts'); this.levelEnd(); return; }
    if (w.mode === 'arcade' && !w.revived && Save.data.dust >= REVIVE_COST) { this.state = 'revive'; UI.show('revive'); return; }
    this.finish();
  },
  levelEnd() {
    const w = this.world, L = w.lv, r = w.result, s = Save.data, st = s.stats, run = w.run;
    st.runs++; st.stars += run.stars; st.loops += run.loops; st.cheer += run.cheer; st.bosses += run.boss; st.time += run.time;
    st.bestLoop = Math.max(st.bestLoop, run.maxLoop); st.bestChain = Math.max(st.bestChain, run.maxChain);
    let rec = { dust: 0, first: false };
    if (r.win) {
      rec = Levels.record(L, r.stars);
      Missions.event('level', 1);
      w.sticker('adv1');
      if (r.stars === 3) w.sticker('adv3');
      if ([0, 1, 2, 3].every((i) => Levels.stars(L.zone, i) > 0)) w.sticker('advzone');
    }
    // a little stardust for playing, win or lose
    const dust = rec.dust + Math.floor(w.score / 80) + run.gold + run.bonus;
    s.dust += dust - rec.dust;
    Save.save();
    this.state = 'over';
    UI.show('level', { L, win: r.win, stars: r.stars || 0, why: r.why, dust, first: rec.first, run, score: w.score });
    Music.stop(); this.awake(false);
  },
  revive() {
    if (this.state !== 'revive' || Save.data.dust < REVIVE_COST) return;
    Save.data.dust -= REVIVE_COST; Save.save();
    this.world.revive();
    this.state = 'play'; UI.show('play'); Input.takeDelta();
  },
  finish(silent) {
    const w = this.world;
    if (!w || this.state === 'over') return;
    if (w.mode === 'tutorial') { if (!silent) this.home(); return; }
    if (w.mode === 'level') { if (!silent) this.home('adventure'); return; } // left part-way: nothing to record
    const s = Save.data, r = w.run, chill = w.mode === 'chill';
    let dust = Math.floor(w.score / 60) + r.gold * 2 + r.bonus;
    if (chill) dust = Math.floor(dust / 2);
    s.dust += dust;
    const prev = chill ? s.chillBest : s.best, isBest = w.score > prev && w.score > 0;
    if (chill) s.chillBest = Math.max(prev, w.score); else s.best = Math.max(prev, w.score);
    const st = s.stats;
    st.runs++; st.stars += r.stars; st.loops += r.loops; st.cheer += r.cheer; st.bosses += r.boss; st.time += r.time;
    st.bestLoop = Math.max(st.bestLoop, r.maxLoop); st.bestChain = Math.max(st.bestChain, r.maxChain); st.maxStage = Math.max(st.maxStage, w.stage + 1);
    if (chill && w.score >= 2000 && Stickers.give('chill')) r.stickers.push('chill');
    Save.save();
    Sound.muffle(false);
    if (silent) return;
    this.state = 'over';
    UI.show('over', { score: w.score, dust, isBest, run: r, chill });
    Music.stop(); this.awake(false);
    if (isBest) { Sound.fanfare(); w.fx.confetti(w.W / 2, w.H * 0.3, 100); } else Sound.jingle();
  },
  home(screen = 'menu') {
    this.state = 'menu'; this.world = null;
    UI.hideTip(); Missions.refresh(); Save.save();
    Sky.set(0);
    this.demo.cosm = Object.assign({}, Save.data.eq);
    Sound.muffle(false); this.awake(false);
    UI.show(screen); Music.play('menu');
  },
  // What the Android back button does. False means there is nothing to go back to, so leave the app.
  back() {
    if (this.state === 'play') this.pause();
    else if (this.state === 'paused') this.resume();
    else if (this.state === 'revive') this.finish();
    else if (this.state === 'over') this.home(this.world && this.world.mode === 'level' ? 'adventure' : 'menu');
    else if (UI.cur !== 'menu') UI.show('menu');
    else return false;
    return true;
  },
  // keep the screen on while playing (the Android app does it natively)
  awake(on) {
    if (window.LooplingAndroid) LooplingAndroid.keepAwake(!!on);
    else if (on && navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
  },
  key(code) {
    if (code !== 'Escape' && code !== 'KeyP') return;
    if (this.state === 'play') this.pause();
    else if (this.state === 'paused') this.resume();
    else if (this.state === 'menu' && UI.cur !== 'menu') UI.show('menu');
  },
  canFull() { return !window.LooplingAndroid && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled); },
  toggleFull() {
    const d = document, e = d.documentElement;
    try {
      if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else {
        const go = e.requestFullscreen || e.webkitRequestFullscreen, p = go && go.call(e, { navigationUI: 'hide' });
        if (p && p.catch) p.catch(() => UI.toast('Full screen is not available here', 'full'));
      }
    } catch (err) { UI.toast('Full screen is not available here', 'full'); }
  },
};

function start() {
  App.boot();
  if (typeof Dev !== 'undefined') Dev.run();
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start();
})();
</script>
</body>
