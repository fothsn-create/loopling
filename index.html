      g.fillStyle = wall; g.fillRect(tx - tw * u / 2, y - th * u, tw * u, th * u);
      g.fillStyle = roof; g.beginPath(); g.moveTo(tx - tw * u * 0.7, y - th * u); g.lineTo(tx, y - th * u - u * 3.2); g.lineTo(tx + tw * u * 0.7, y - th * u); g.closePath(); g.fill();
      g.strokeStyle = roof; g.lineWidth = u * 0.25; g.beginPath(); g.moveTo(tx, y - th * u - u * 3.2); g.lineTo(tx, y - th * u - u * 4.6); g.stroke();
      g.fillStyle = '#ff8fbd'; g.beginPath(); g.moveTo(tx, y - th * u - u * 4.6); g.lineTo(tx + u * 1.4, y - th * u - u * 4.1); g.lineTo(tx, y - th * u - u * 3.7); g.closePath(); g.fill();
      g.fillStyle = lit; g.fillRect(tx - u * 0.3, y - th * u + u * 1.5, u * 0.6, u * 1.1);
    });
    g.fillStyle = lit; g.beginPath(); g.arc(x, y - u * 1.6, u * 1.1, Math.PI, TAU); g.fillRect(x - u * 1.1, y - u * 1.6, u * 2.2, u * 1.6); g.fill();
  },
  paintPalace(g, x, y, m) {
    const u = m * 0.03, gold = '#e9b949', shade = '#c48a2a', lit = '#fff3c4';
    const dome = (dx, dy, r) => {
      g.fillStyle = gold; g.beginPath(); g.moveTo(x + dx - r, dy);
      g.bezierCurveTo(x + dx - r * 1.3, dy - r * 1.2, x + dx - r * 0.2, dy - r * 1.6, x + dx, dy - r * 2.2);
      g.bezierCurveTo(x + dx + r * 0.2, dy - r * 1.6, x + dx + r * 1.3, dy - r * 1.2, x + dx + r, dy); g.closePath(); g.fill();
      g.fillStyle = lit; circle(g, x + dx, dy - r * 2.35, r * 0.18); g.fill();
    };
    g.fillStyle = shade; g.fillRect(x - u * 7, y - u * 4, u * 14, u * 5);
    [[-6, 8], [6, 8], [-3, 6], [3, 6]].forEach(([dx, th]) => { g.fillStyle = shade; g.fillRect(x + dx * u - u, y - th * u, u * 2, th * u); dome(dx * u, y - th * u, u * 1.2); });
    g.fillStyle = gold; g.fillRect(x - u * 3, y - u * 7, u * 6, u * 8); dome(0, y - u * 7, u * 3.2);
    g.fillStyle = lit;
    for (const dx of [-2, 0, 2]) { g.beginPath(); g.arc(x + dx * u, y - u * 3.6, u * 0.6, Math.PI, TAU); g.fillRect(x + dx * u - u * 0.6, y - u * 3.6, u * 1.2, u * 1.6); g.fill(); }
  },
  paintCrystals(g, w, h, m, rng) {
    const cols = ['#8ff0ff', '#ff9fe0', '#c7a8ff'];
    for (let k = 0; k < 7; k++) {
      const cx = (k + 0.3 + rng() * 0.4) / 7 * w, cy = h * (0.88 + rng() * 0.05), col = cols[k % 3], s = m * (0.018 + rng() * 0.016);
      const rg = g.createRadialGradient(cx, cy, 0, cx, cy, s * 6);
      rg.addColorStop(0, toRGBA(col, 0.35)); rg.addColorStop(1, toRGBA(col, 0));
      g.fillStyle = rg; g.fillRect(cx - s * 6, cy - s * 6, s * 12, s * 12);
      g.fillStyle = col;
      for (const [dx, hh, lean] of [[-1.1, 2.2, -0.35], [0, 3.4, 0], [1.1, 2.6, 0.3]]) {
        g.save(); g.translate(cx + dx * s, cy); g.rotate(lean);
        g.beginPath(); g.moveTo(-s * 0.5, 0); g.lineTo(-s * 0.5, -hh * s * 0.75); g.lineTo(0, -hh * s); g.lineTo(s * 0.5, -hh * s * 0.75); g.lineTo(s * 0.5, 0); g.closePath(); g.fill();
        g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(-s * 0.22, -hh * s * 0.7, s * 0.16, hh * s * 0.55); g.fillStyle = col;
        g.restore();
      }
    }
  },
  // ----- the Sky Garden: one flower on the hills for every Gloomy ever cheered up -----
  ridgeY(x) {
    this.layer(this.to);
    const R = this.ridges[this.to], i = clamp(Math.round(x / R.step), 0, R.mid.length - 1);
    return Math.min(R.mid[i], R.front[i]);
  },
  flowerPos(i) {
    const r = mulberry32(5000 + i), x = (0.02 + r() * 0.96) * this.w;
    return { x, y: this.ridgeY(x) + 3, s: 4 + r() * 4, col: FLOWER_COLS[Math.floor(r() * FLOWER_COLS.length)] };
  },
  bloom(i, delay) { this.born[i] = this.t + delay; },
  drawGarden(ctx) {
    const n = Math.min(Save.data.garden || 0, 300);
    if (!n) return;
    const growing = [];
    for (const k in this.born) {
      if (this.t - this.born[k] > 0.7) delete this.born[k];
      else if (+k < n) growing.push(+k);
    }
    // settled flowers are painted once into a cached layer; only new ones are drawn live
    const key = `${this.to}|${this.w}|${this.h}|${n}|${growing.join(',')}`;
    if (key !== this.gKey) {
      this.gKey = key;
      const c = this.gCanvas || (this.gCanvas = document.createElement('canvas'));
      c.width = Math.max(1, Math.round(this.w * this.px)); c.height = Math.max(1, Math.round(this.h * this.px));
      const g = c.getContext('2d');
      g.setTransform(this.px, 0, 0, this.px, 0, 0);
      for (let i = 0; i < n; i++) if (!growing.includes(i)) { const f = this.flowerPos(i); drawFlower(g, f.x, f.y, f.s, f.col); }
    }
    ctx.drawImage(this.gCanvas, 0, 0, this.w, this.h);
    for (const i of growing) {
      const age = this.t - this.born[i];
      if (age < 0) continue; // its seed is still floating down
      const f = this.flowerPos(i);
      drawFlower(ctx, f.x, f.y, f.s, f.col, easeOutBack(Math.min(1, age / 0.6)));
    }
  },
  drawBats(ctx, t) {
    ctx.fillStyle = 'rgba(30,14,48,.85)';
    for (let k = 0; k < 3; k++) {
      const x = ((t * (34 + k * 9) + k * 380) % (this.w + 160)) - 80, s = 9 + k * 2, flap = Math.sin(t * 14 + k) * 0.6;
      const y = this.h * (0.12 + k * 0.09) + Math.sin(t * 1.7 + k * 2) * 18;
      ctx.beginPath(); ctx.ellipse(x, y, s * 0.35, s * 0.45, 0, 0, TAU); ctx.fill();
      for (const d of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + d * s * 0.9, y - s * (0.9 + flap), x + d * s * 1.8, y - s * flap * 0.5);
        ctx.quadraticCurveTo(x + d * s * 1.2, y + s * 0.1, x + d * s * 0.9, y + s * 0.35);
        ctx.quadraticCurveTo(x + d * s * 0.6, y, x, y + s * 0.2); ctx.fill();
      }
    }
  },
  drawSnow(ctx, t) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    const rng = mulberry32(42);
    for (let i = 0; i < 80; i++) {
      const sx = rng(), sy = rng(), sp = 0.4 + rng() * 0.8, r = 2 + rng() * 3;
      const y = (sy * this.h + t * 40 * sp) % this.h, x = (sx * this.w + Math.sin(t * 0.8 + i) * 18 + this.w) % this.w;
      circle(ctx, x, y, r); ctx.fill();
    }
  },
  update(dt) {
    this.t += dt;
    if (this.blend < 1) this.blend = Math.min(1, this.blend + dt / 2.5);
    if (!this.shoot && Math.random() < dt * 0.08) this.shoot = { x: rand(0, this.w), y: rand(0, this.h * 0.35), vx: rand(380, 560) * (Math.random() < 0.5 ? -1 : 1), vy: rand(120, 220), life: 0.9 };
    if (this.shoot) { const s = this.shoot; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; if (s.life <= 0) this.shoot = null; }
  },
  draw(ctx, t) {
    const w = this.w, h = this.h;
    ctx.drawImage(this.layer(this.from), 0, 0, w, h);
    if (this.blend < 1) { ctx.globalAlpha = this.blend; ctx.drawImage(this.layer(this.to), 0, 0, w, h); ctx.globalAlpha = 1; }
    this.drawGarden(ctx);
    if (Season.now === 'halloween') this.drawBats(ctx, t);
    else if (Season.now === 'winter') this.drawSnow(ctx, t);
    const st = STAGES[this.blend < 0.5 ? this.from : this.to];
    ctx.fillStyle = '#ffffff';
    for (const s of this.stars) {
      const a = 0.25 + 0.75 * Math.pow(Math.sin(t * s.sp + s.ph) * 0.5 + 0.5, 2);
      ctx.globalAlpha = a; ctx.fillRect(s.x - s.r / 2, s.y - s.r / 2, s.r, s.r);
    }
    ctx.globalAlpha = 1;
    if (st.aurora) {
      const op = ctx.globalCompositeOperation; ctx.globalCompositeOperation = 'lighter';
      for (let k = 0; k < 3; k++) {
        ctx.beginPath();
        for (let x = 0; x <= w; x += 16) {
          const y = h * (0.2 + k * 0.07) + Math.sin(x * 0.006 + t * 0.4 + k) * h * 0.05 + Math.sin(x * 0.013 - t * 0.3) * h * 0.02;
          x ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.strokeStyle = k === 1 ? 'rgba(140,120,255,.12)' : 'rgba(110,255,200,.12)'; ctx.lineWidth = h * 0.06; ctx.stroke();
      }
      ctx.globalCompositeOperation = op;
    }
    if (st.palace || st.cave) {
      // twinkling sparkles round the palace; glints on the crystals in the caves
      const rng = mulberry32(st.cave ? 77 : 99);
      for (let k = 0; k < 9; k++) {
        const x = rng() * w, y = st.cave ? h * (0.8 + rng() * 0.12) : h * (0.1 + rng() * 0.6), a = Math.pow(Math.max(0, Math.sin(t * (1.2 + rng()) + k * 2)), 8);
        if (a < 0.05) continue;
        ctx.globalAlpha = a; ctx.fillStyle = '#ffffff';
        starPath(ctx, x, y, 4 + rng() * 5, 0, 4, 0.25); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    if (this.shoot) {
      const s = this.shoot, len = 0.08;
      ctx.strokeStyle = `rgba(255,255,255,${clamp(s.life, 0, 1) * 0.8})`; ctx.lineWidth = 2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * len, s.y - s.vy * len); ctx.stroke();
    }
  },
};

// ===== fx.js =====
// ---------- particles, pop-up text, ripples and loop flashes ----------
class FX {
  constructor() { this.p = []; this.texts = []; this.rings = []; this.loops = []; this.seeds = []; }
  clear() { this.p.length = 0; this.texts.length = 0; this.rings.length = 0; this.loops.length = 0; this.seeds.length = 0; }
  // a glowing seed that floats from (x, y) down to its spot in the Sky Garden
  seed(x, y, tx, ty, dur) { this.seeds.push({ x, y, tx, ty, life: 0, max: dur }); }
  burst(x, y, n, col, o = {}) {
    for (let i = 0; i < n && this.p.length < 700; i++) {
      const a = rand(0, TAU), sp = rand(o.min || 60, o.max || 260);
      this.p.push({
        x, y, vx: Math.cos(a) * sp + (o.vx || 0), vy: Math.sin(a) * sp + (o.vy || 0),
        life: 0, max: rand(0.4, 0.9) * (o.life || 1), size: rand(2, 4.5) * (o.size || 1),
        col: Array.isArray(col) ? pick(col) : col, kind: o.kind || 'dot', grav: o.grav || 0, drag: o.drag == null ? 2.6 : o.drag,
        rot: rand(0, TAU), vr: rand(-8, 8),
      });
    }
  }
  confetti(x, y, n) { this.burst(x, y, n, ['#ff7a8a', '#ffd84d', '#7fe08a', '#6cc6ff', '#b18cff', '#ff9fd0'], { kind: 'confetti', min: 150, max: 520, grav: 420, drag: 1.4, life: 2.2, size: 1.4 }); }
  text(x, y, str, o = {}) {
    this.texts.push({ x, y, str, life: 0, max: o.life || 1.1, size: o.size || 22, col: o.col || '#fff8ec', vy: o.vy == null ? -46 : o.vy });
  }
  ring(x, y, col, maxR = 120, life = 0.5, width = 6) { this.rings.push({ x, y, col, maxR, life: 0, max: life, width }); }
  loopFlash(poly, col, strength = 1) { this.loops.push({ poly, col, life: 0, max: 0.55, strength }); }
  update(dt) {
    for (let i = this.p.length - 1; i >= 0; i--) {
      const q = this.p[i];
      q.life += dt;
      if (q.life >= q.max) { this.p[i] = this.p[this.p.length - 1]; this.p.pop(); continue; }
      const k = Math.exp(-q.drag * dt);
      q.vx *= k; q.vy = q.vy * k + q.grav * dt;
      q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt;
    }
    for (const list of [this.texts, this.rings, this.loops, this.seeds]) {
      for (let i = list.length - 1; i >= 0; i--) { list[i].life += dt; if (list[i].life >= list[i].max) list.splice(i, 1); }
    }
    for (const t of this.texts) t.y += t.vy * dt * (1 - t.life / t.max);
  }
  drawUnder(ctx) {
    for (const L of this.loops) {
      const f = 1 - L.life / L.max, p = L.poly;
      ctx.beginPath(); ctx.moveTo(p[0], p[1]);
      for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]);
      ctx.closePath();
      ctx.fillStyle = toRGBA(L.col, 0.42 * f * L.strength); ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${0.9 * f * L.strength})`; ctx.lineWidth = 4 + 10 * (1 - f); ctx.lineJoin = 'round'; ctx.stroke();
    }
  }
  draw(ctx) {
    const op = ctx.globalCompositeOperation;
    for (const r of this.rings) {
      const f = r.life / r.max;
      ctx.strokeStyle = toRGBA(r.col, 1 - f); ctx.lineWidth = r.width * (1 - f) + 1;
      circle(ctx, r.x, r.y, r.maxR * easeOutCubic(f)); ctx.stroke();
    }
    for (const q of this.p) {
      const f = 1 - q.life / q.max;
      if (q.kind === 'dot') {
        ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = f;
        ctx.fillStyle = q.col; circle(ctx, q.x, q.y, q.size * (0.5 + f)); ctx.fill();
        ctx.globalCompositeOperation = op;
      } else if (q.kind === 'star') {
        ctx.globalAlpha = f; ctx.fillStyle = q.col; starPath(ctx, q.x, q.y, q.size * 1.8, q.rot, 4, 0.35); ctx.fill();
      } else if (q.kind === 'confetti') {
        ctx.globalAlpha = Math.min(1, f * 2); ctx.fillStyle = q.col;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillRect(-q.size * 1.6, -q.size * 0.8, q.size * 3.2, q.size * 1.6); ctx.restore();
      } else if (q.kind === 'heart') {
        ctx.globalAlpha = f; drawHeart(ctx, q.x, q.y, q.size * 3, q.col, '#b02a66');
      } else if (q.kind === 'seed') {
        ctx.globalAlpha = f; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x, q.y + q.size * 2.5); ctx.stroke();
        ctx.fillStyle = '#fff'; circle(ctx, q.x, q.y, q.size * 0.9); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
    for (const s of this.seeds) {
      const f = easeOutCubic(s.life / s.max), x = lerp(s.x, s.tx, f), y = lerp(s.y, s.ty, f) - Math.sin(f * Math.PI) * 80;
      drawGlow(ctx, x, y, 16, '#c8ffb0', 0.9);
      ctx.fillStyle = '#f0ffe0'; circle(ctx, x, y, 3.5); ctx.fill();
    }
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (const t of this.texts) {
      const f = t.life / t.max, s = f < 0.18 ? easeOutBack(f / 0.18) : 1;
      ctx.globalAlpha = f > 0.7 ? (1 - f) / 0.3 : 1;
      ctx.font = `900 ${Math.max(1, t.size * s)}px ${FONT}`;
      ctx.lineWidth = t.size * 0.22; ctx.strokeStyle = 'rgba(25,12,60,.85)';
      ctx.strokeText(t.str, t.x, t.y); ctx.fillStyle = t.col; ctx.fillText(t.str, t.x, t.y);
    }
    ctx.globalAlpha = 1;
  }
}

// ===== world.js =====
// ---------- the play world: player, tail, loops, things to catch ----------
const BASE_TAIL = 960, TAIL_LIFE = 3.2, SEG = 7, MIN_LOOP_AREA = 1100, CHAIN_WINDOW = 3.2;
// Closing a loop is forgiving: flying back to within SNAP of your own tail closes it (once there is
// at least SNAP_RUN of tail between), so a wobbly circle that never quite crosses still counts.
const SNAP = 46, SNAP_RUN = 260;
const VALUE = { star: 10, gold: 50, gloomy: 25, mini: 15, big: 60, prickle: 100, zipper: 40, power: 20, boss: 150, bubble: 5 };
const LOOP_WORDS = ['', '', 'Double!', 'Triple!', 'Quad loop!', 'Mega loop!', 'Mega loop!', 'Super mega!', 'Super mega!'];
const STAR_COLS = ['#fff6c2', '#ffe680', '#ffc6ea', '#c4f3ff', '#dcffb8'];
const HAZARDS = new Set(['gloomy', 'prickle', 'zipper', 'boss', 'drop', 'bolt', 'needle', 'bubble', 'rock', 'pebble']);
// boss attacks: they vanish when they bump you, and when the boss is cheered up
const SHOTS = new Set(['drop', 'bolt', 'needle', 'bubble', 'pebble']);

class World {
  // floor: a strip at the bottom (world units) that nothing plays in. On phones it keeps the game
  // clear of the browser's bottom toolbar and the swipe-home gesture.
  // lv: the Adventure level being played (mode 'level'), from Levels.config().
  constructor(mode, W, H, floor = 0, lv = null) { this.mode = mode; this.W = W; this.H = H; this.floor = floor; this.lv = lv; this.fx = new FX(); this.reset(); }
  get bottom() { return this.H - this.floor; }
  get scored() { return this.mode === 'arcade' || this.mode === 'chill' || this.mode === 'level'; }
  // modes where bumps cost hearts
  get hearty() { return this.mode === 'arcade' || this.mode === 'level'; }
  reset() {
    const s = Save.data;
    this.t = 0; this.ents = []; this.idSeq = 1;
    this.score = 0; this.shownScore = 0; this.scorePop = 0;
    this.stage = this.lv ? this.lv.zone : 0; this.stageT = 0; this.boss = null; this.breather = 0; this.stageClearT = 0;
    this.timeLeft = this.lv ? this.lv.time : 0; this.result = null; this.resultT = 0; this.snapHint = null;
    if (this.lv) this.lv.prog = 0;
    this.chain = 0; this.chainT = 0; this.pickRun = 0; this.pickT = 0;
    this.pw = { magnet: 0, tail: 0, slow: 0, double: 0 }; this.shield = false;
    this.run = { stars: 0, gold: 0, loops: 0, cheer: 0, prickle: 0, zipper: 0, boss: 0, power: 0, maxLoop: 0, maxChain: 0, hits: 0, time: 0,
      perfect: 0, comets: 0, flowers: 0, bonus: 0, stickers: [] };
    this.timers = { star: 0.2, gloom: 5, prickle: 26, zipper: 6, power: rand(12, 16), mini: 18, big: 10, shower: rand(18, 26), comet: rand(28, 40) };
    this.fever = 0; this.feverT = 0;
    this.showerT = 0; this.showerSpawn = 0; this.showerId = 0; this.showerCaught = 0;
    this.shake = 0; this.flash = 0; this.flashCol = '#ffffff'; this.hitStop = 0;
    this.over = false; this.dying = 0; this.banner = null; this.heartPop = 0; this.revived = false; this.beatBest = false;
    const hearts = 3 + (this.hearty ? s.upg.heart : 0);
    this.p = { x: this.W / 2, y: this.H * 0.6, vx: 0, vy: 0, kvx: 0, kvy: 0, r: 20, hearts, maxHearts: Math.max(5, hearts), inv: 0, bumpT: 0,
      mood: 'normal', moodT: 0, blink: 0, blinkT: 2, trail: [], tilt: 0, lookX: 0, lookY: 0, squash: 0, dir: 0 };
    this.len = 0; this.trailId = 0;
    this.tailMax = BASE_TAIL * (this.mode === 'demo' ? 1 : 1 + 0.08 * s.upg.tail);
    this.cosm = { color: s.eq.color, hat: s.eq.hat, trail: s.eq.trail };
    this.bot = this.mode === 'demo' || this.autoplay ? new Bot() : null;
    this.tut = this.mode === 'tutorial' ? new Tutorial(this) : null;
    this.fx.clear();
    if (this.mode === 'demo') for (let i = 0; i < 9; i++) this.spawnStar();
  }
  resize(W, H, floor = this.floor) {
    const kx = W / this.W, ky = H / this.H;
    for (const e of this.ents) { e.x *= kx; e.y *= ky; }
    for (const q of this.p.trail) { q.x *= kx; q.y *= ky; }
    this.p.x *= kx; this.p.y *= ky; this.W = W; this.H = H; this.floor = floor;
    this.p.y = Math.min(this.p.y, this.bottom - this.p.r);
    this.recalcLen();
  }
  ev(name, v) {
    if (this.hearty) Missions.event(name, v, this);
    if (this.lv) Levels.track(this, name, v);
  }
  sticker(id) { if (this.mode !== 'demo' && Stickers.give(id)) this.run.stickers.push(id); }
  // Glow Fever: loops fill the meter; when it is full, 8 seconds of x3 points and a longer tail.
  addFever(v) {
    if (this.feverT > 0 || this.mode === 'tutorial') return;
    this.fever = Math.min(1, this.fever + v);
    if (this.fever >= 1) this.startFever();
  }
  startFever() {
    this.fever = 1; this.feverT = 8;
    this.banner = { title: 'Glow Fever!', sub: 'Everything scores x3', t: 0 };
    Sound.feverOn(); buzz(40); this.flash = 0.5; this.flashCol = '#ffe9a8';
    this.fx.confetti(this.p.x, this.p.y, 40);
    if (this.scored) Music.play('fever', this.stage);
    this.sticker('fever'); this.ev('fever', 1);
  }
  // Every cheered-up creature plants a flower in the Sky Garden (kept between games).
  plant(x, y, n = 1) {
    if (this.mode === 'demo') return;
    for (let k = 0; k < n; k++) {
      const i = Save.data.garden++, f = Sky.flowerPos(i), delay = 0.9 + k * 0.15;
      this.run.flowers++;
      Sky.bloom(i, delay);
      this.fx.seed(x, y, f.x, f.y, delay);
      this.ev('flower', 1);
      const g = Save.data.garden;
      if ([10, 25, 50, 100, 200, 300, 500].includes(g)) UI.toast(`Your Sky Garden has ${g} flowers!`, 'star');
      if (g >= 25) this.sticker('garden25');
      if (g >= 100) this.sticker('garden100');
    }
  }
  catchComet(e) {
    e.dead = true;
    this.run.comets++; this.run.bonus += 10;

    this.fx.text(e.x, e.y - 50, 'Comet caught! +10 stardust', { size: 22, col: '#fff6c2', life: 1.6 });

  add(type, o) {

  count(type, kind) { let n = 0; for (const e of this.ents) if (!e.dead && e.type === type && (!kind || e.kind === kind)) n++; return n; }
  addShake(v) { if (Save.data.set.shake) this.shake = Math.min(14, this.shake + v); }

    if (this.mode === 'demo') return;

    const best = Save.data.best;

  // ----- movement -----
  updatePlayer(dt) {
    const p = this.p, ox = p.x, oy = p.y, S = App.S;
    let mx = 0, my = 0, target = null;
    if (!this.bot && Input.kind !== 'keys' && Input.pad()) Input.kind = 'keys';
    if (this.bot) target = this.bot.target(this, dt);
    else if (Input.kind === 'touch') {
      const d = Input.takeDelta(), ctrl = Save.data.set.ctrl;
      if (ctrl === 'drag') { mx = (d.x / S) * 1.25; my = (d.y / S) * 1.25; }
      else if (Input.down) target = { x: (Input.px - App.ox) / S, y: (Input.py - App.oy - (ctrl === 'above' ? 56 : 0)) / S };
    } else if (Input.kind === 'mouse') {
      Input.takeDelta();
      if (Input.hasMouse) target = { x: (Input.px - App.ox) / S, y: (Input.py - App.oy) / S };
    } else if (Input.kind === 'keys') {
      const st = Input.steer();
      p.kvx += st.x * 4200 * dt; p.kvy += st.y * 4200 * dt;
      if (!st.x) p.kvx *= Math.exp(-10 * dt);
      if (!st.y) p.kvy *= Math.exp(-10 * dt);
      const sp = Math.hypot(p.kvx, p.kvy);
      if (sp > 640) { p.kvx *= 640 / sp; p.kvy *= 640 / sp; }
      mx = p.kvx * dt; my = p.kvy * dt;
    }
    if (target) {
      const finger = !this.bot && Input.kind === 'touch', gain = finger ? 18 : 14;
      let vx = (target.x - p.x) * gain, vy = (target.y - p.y) * gain;
      const sp = Math.hypot(vx, vy), max = this.bot ? this.bot.speed : finger ? 2600 : 1500;
      if (sp > max) { vx *= max / sp; vy *= max / sp; }
      mx = vx * dt; my = vy * dt;

    const ml = Math.hypot(mx, my);
    if (ml > 90) { mx *= 90 / ml; my *= 90 / ml; }
    if (this.dying > 0) mx = my = 0;
    p.x = clamp(p.x + mx, p.r, this.W - p.r); p.y = clamp(p.y + my, p.r, this.bottom - p.r);
    const k = Math.min(1, dt * 12), idt = 1 / Math.max(dt, 1e-4);
    p.vx = lerp(p.vx, (p.x - ox) * idt, k); p.vy = lerp(p.vy, (p.y - oy) * idt, k);
    const sp = Math.hypot(p.vx, p.vy);
    p.lookX = lerp(p.lookX, clamp(p.vx / 500, -1, 1), Math.min(1, dt * 8));
    p.lookY = lerp(p.lookY, clamp(p.vy / 500, -1, 1), Math.min(1, dt * 8));
    p.tilt = lerp(p.tilt, clamp(p.vx / 2500, -0.3, 0.3), Math.min(1, dt * 8));
    p.squash = Math.min(0.16, sp / 4000); p.dir = Math.atan2(p.vy, p.vx);
    p.blinkT -= dt; if (p.blinkT <= 0) { p.blink = 1; p.blinkT = rand(2, 5); }
    p.blink = Math.max(0, p.blink - dt * 7);
    if (p.moodT > 0) { p.moodT -= dt; if (p.moodT <= 0) p.mood = 'normal'; }
    p.inv = Math.max(0, p.inv - dt); p.bumpT = Math.max(0, p.bumpT - dt);
    return [ox, oy];
  }

  // ----- the tail and loop detection -----
  recalcLen() {
    const tr = this.p.trail; let L = 0;
    for (let i = 1; i < tr.length; i++) L += Math.hypot(tr[i].x - tr[i - 1].x, tr[i].y - tr[i - 1].y);
    this.len = L;
  }
  dropTail() {
    const tr = this.p.trail;
    if (tr.length > 1) this.len -= Math.hypot(tr[1].x - tr[0].x, tr[1].y - tr[0].y);
    tr.shift();
    if (tr.length <= 1) this.len = 0;
  }
  updateTrail() {
    const p = this.p, tr = p.trail, last = tr[tr.length - 1];
    if (this.dying > 0) { while (tr.length) this.dropTail(); this.snapHint = null; return; }
    if (!last || d2(last.x, last.y, p.x, p.y) >= SEG * SEG) this.addPoint(p.x, p.y);
    const boost = this.pw.tail > 0 ? 1.8 : this.feverT > 0 ? 1.5 : 1, lenMax = this.tailMax * boost, life = TAIL_LIFE * (1 + (boost - 1) * 0.75);
    while (tr.length > 1 && (this.len > lenMax || tr[0].t < this.t - life)) this.dropTail();
    // where the loop would close if you flew a little further: drawn as a glowing target
    this.snapHint = this.findSnap(p.x, p.y, SNAP * 2.4);
  }
  // The nearest bit of tail (at least SNAP_RUN back along it) within reach of (x, y), if closing
  // the loop there would make a roundish loop rather than a thin hairpin. { i, x, y, d, poly } or null.
  findSnap(x, y, reach) {
    const tr = this.p.trail, n = tr.length;
    if (n < 8) return null;
    let run = Math.hypot(x - tr[n - 1].x, y - tr[n - 1].y), best = -1, bd = reach * reach;
    for (let i = n - 2; i >= 0; i--) {
      run += Math.hypot(tr[i + 1].x - tr[i].x, tr[i + 1].y - tr[i].y);
      if (run < SNAP_RUN) continue;
      const dd = d2(x, y, tr[i].x, tr[i].y);
      if (dd < bd) { bd = dd; best = i; }
    }
    if (best < 0) return null;
    const poly = [];
    for (let k = best; k < n; k++) poly.push(tr[k].x, tr[k].y);
    poly.push(x, y);
    // roundish (4πA/P²) and not too narrow (2A/P is about the radius of a circle, the half-width of a strip)
    const area = polyArea(poly), per = polyPerimeter(poly);
    if (area < 2500 || (4 * Math.PI * area) / (per * per) < 0.4 || (2 * area) / per < 30) return null;
    return { i: best, x: tr[best].x, y: tr[best].y, d: Math.sqrt(bd), poly };
  }
  addPoint(x, y) {
    const tr = this.p.trail, n = tr.length;
    if (n >= 3) {
      const a = tr[n - 1];
      for (let i = n - 3; i >= 0; i--) {
        const q = tr[i], r = tr[i + 1];
        if (!segHit(a.x, a.y, x, y, q.x, q.y, r.x, r.y)) continue;
        const hx = IX, hy = IY, poly = [hx, hy];
        for (let k = i + 1; k < n; k++) poly.push(tr[k].x, tr[k].y);
        if (poly.length >= 6 && polyArea(poly) >= MIN_LOOP_AREA) {
          this.onLoop(poly);
          tr.length = 0; this.len = 0;
          tr.push({ x, y, t: this.t, id: this.trailId++ });
          return;
        }
        // a tiny knot from a wobbly finger: snip it out quietly
        tr.length = i + 1;
        tr.push({ x: hx, y: hy, t: this.t, id: this.trailId++ });
        this.recalcLen();

    }
    // coming back close to the tail closes the loop too, so it need not cross exactly
    const s = this.findSnap(x, y, SNAP);

      tr.push({ x, y, t: this.t, id: this.trailId++ });
      return;
    }
    const L = tr[tr.length - 1];

  // orbit: the loop came from circling a boss (see windBoss), so it is never a "perfect" loop
  onLoop(poly, orbit = false) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (let i = 0; i < poly.length; i += 2) {
      minX = Math.min(minX, poly[i]); maxX = Math.max(maxX, poly[i]);
      minY = Math.min(minY, poly[i + 1]); maxY = Math.max(maxY, poly[i + 1]);
    }
    const caught = [];
    for (const e of this.ents) {
      if (e.dead || !e.loopable || e.x < minX || e.x > maxX || e.y < minY || e.y > maxY) continue;
      if (e.type === 'boss' && e.loopCD > 0) continue;
      if (pointInPoly(e.x, e.y, poly)) caught.push(e);
    }
    const c = polyCentre(poly), col = skinColors(this.cosm.color, this.t).body;

    this.sticker('loop');
    if (this.tut) this.tut.onLoop(caught);
    if (!caught.length) { this.fx.loopFlash(poly, col, 0.35); Sound.emptyLoop(); return; }
    this.chain = this.chainT > 0 ? this.chain + 1 : 1;
    this.chainT = CHAIN_WINDOW;
    // A loop as round as a circle (4πA/P² near 1) and not tiny is a "perfect loop".
    const per = polyPerimeter(poly), area = polyArea(poly), perfect = !orbit && area >= 5000 && (4 * Math.PI * area) / (per * per) >= 0.8;
    let base = 0;

    this.addScore(pts);
    const word = n >= 9 ? 'Looptastic!' : LOOP_WORDS[n];
    if (this.mode !== 'demo') this.fx.text(c.x, c.y, '+' + fmt(pts), { size: 26 + Math.min(n, 8) * 3, col: '#ffe066' });
    if (word) this.fx.text(c.x, c.y - 36 - n * 2, word, { size: 22 + Math.min(n, 8) * 2.5, life: 1.3 });
    if (this.chain >= 2) this.fx.text(c.x, c.y + 32, 'Chain x' + this.chain, { size: 19, col: '#9ff5d6' });
    if (perfect) {
      this.fx.text(c.x, c.y + (this.chain >= 2 ? 58 : 34), 'Perfect loop!', { size: 20, col: '#ffd84d', life: 1.4 });
      this.fx.ring(c.x, c.y, '#ffd84d', Math.sqrt(area / Math.PI) * 1.15, 0.7, 10);
      Sound.chime();
      this.run.perfect++; this.ev('perfect', 1); this.sticker('perfect');
    }
    if (n >= 5) this.sticker('mega');
    if (n >= 9) this.sticker('looptastic');
    if (this.chain >= 5) this.sticker('chain');
    this.addFever(0.05 + 0.03 * Math.min(n, 8) + (perfect ? 0.1 : 0));
    this.fx.loopFlash(poly, col, 1);
    this.fx.ring(c.x, c.y, col, 160 + n * 20, 0.6, 8);
    Sound.loop(n, this.chain);
    this.addShake(Math.min(3 + n * 1.5, 12));
    if (n >= 5) this.hitStop = 0.07;
    buzz(n >= 4 ? 30 : 12);
    this.p.mood = 'happy'; this.p.moodT = 0.7;
    this.run.maxLoop = Math.max(this.run.maxLoop, n); this.run.maxChain = Math.max(this.run.maxChain, this.chain);
    this.ev('loopcount', n); this.ev('chain', this.chain);
  }

  // ----- catching things -----
  capture(e) {
    switch (e.type) {
      case 'star': this.collectStar(e, false); return e.gold ? VALUE.gold : VALUE.star;
      case 'power': this.collectPower(e); return VALUE.power;
      case 'gloomy': this.cheer(e); return VALUE[e.kind];
      case 'prickle': this.cheer(e); return VALUE.prickle;
      case 'zipper': this.cheer(e); return VALUE.zipper;
      case 'boss': return this.bossHit(e);
      case 'comet': this.catchComet(e); return 300;
      case 'bubble': this.popShot(e); return VALUE.bubble;
    }
    return 0;
  }
  collectStar(e, touched) {
    e.dead = true;
    this.pickRun = this.pickT > 0 ? this.pickRun + 1 : 0; this.pickT = 1.2;
    Sound.pick(this.pickRun, e.gold);
    this.fx.burst(e.x, e.y, e.gold ? 16 : 8, e.gold ? ['#ffd84d', '#fff6c2'] : [e.col, '#ffffff'], { kind: 'star', max: 200 });
    this.run.stars++; this.ev('star', 1);
    if (e.gold) { this.run.gold++; this.ev('gold', 1); this.sticker('gold'); }
    if (e.shower && e.shower === this.showerId && ++this.showerCaught >= 10) this.sticker('shower');
    if (this.tut) this.tut.onStar();
    if (touched) {
      this.addFever(0.01);
      const v = (e.gold ? VALUE.gold : VALUE.star) * (this.pw.double > 0 ? 2 : 1) * (this.feverT > 0 ? 3 : 1);
      this.addScore(v);
      if (this.mode !== 'demo') this.fx.text(e.x, e.y - 10, '+' + v, { size: e.gold ? 22 : 16, col: e.gold ? '#ffd84d' : '#fff8ec', life: 0.7 });
    }
  }
  collectPower(e) {
    e.dead = true;
    const k = e.kind, P = POWERS[k], p = this.p;
    if (k === 'heart') { if (this.hearty) { p.hearts = Math.min(p.hearts + 1, p.maxHearts); this.heartPop = 1; } }
    else if (k === 'shield') this.shield = true;
    else if (k === 'rainbow') this.rainbowBurst();
    else { this.pw[k] = P.dur + Save.data.upg.power; if (k === 'slow') Sound.muffle(true); }
    Sound.power();
    this.fx.ring(e.x, e.y, P.color, 110, 0.5, 6);
    this.fx.burst(e.x, e.y, 14, [P.color, '#ffffff'], { max: 240 });

  cheer(e, quiet) {
    e.dead = true;

    this.add(deco, { x: e.x, y: e.y, r: e.r, life: 1.8, loopable: false, spawn: 0 });
    this.fx.burst(e.x, e.y, big ? 26 : 14, ['#ff7a8a', '#ffd84d', '#7fe08a', '#6cc6ff', '#b18cff'], { kind: 'star', max: 280 });
    if (e.type === 'prickle') this.fx.burst(e.x, e.y, 16, '#ffffff', { kind: 'seed', min: 20, max: 120, vy: -60, drag: 1, life: 2 });
    if (!quiet) Sound.cheer();
    const drops = e.type === 'prickle' ? 2 : big ? 3 : e.kind === 'mini' ? (Math.random() < 0.35 ? 1 : 0) : 1;
    for (let i = 0; i < drops; i++) {
      const a = rand(0, TAU), sp = rand(120, 220);
      this.spawnStar(e.x, e.y, { vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, spawn: 0.15 });
    }
    if (e.type === 'gloomy') { this.run.cheer++; this.ev('cheer', 1); this.sticker('cheer'); if (this.tut) this.tut.onCheer(); }
    else if (e.type === 'prickle') { this.run.prickle++; this.ev('prickle', 1); this.sticker('prickle'); }

  rainbowBurst() {

      else if (SHOTS.has(e.type)) this.popShot(e);

    ['#ff7a8a', '#ffd84d', '#7fe08a', '#6cc6ff', '#b18cff'].forEach((c, i) => this.fx.ring(p.x, p.y, c, Math.max(this.W, this.H) * (0.6 + i * 0.1), 0.8 + i * 0.08, 14));

  // ----- getting bumped -----
  hurt(src) {
    const p = this.p;
    if (p.inv > 0 || this.dying > 0) return;
    const dx = p.x - src.x, dy = p.y - src.y, d = Math.hypot(dx, dy) || 1;
    if (src.type === 'gloomy') { src.vx = (-dx / d) * 260; src.vy = (-dy / d) * 260; src.stun = 1.2; }
    if (SHOTS.has(src.type)) src.dead = true;
    p.x = clamp(p.x + (dx / d) * 40, p.r, this.W - p.r); p.y = clamp(p.y + (dy / d) * 40, p.r, this.bottom - p.r);
    if (!this.hearty) { p.inv = 0.7; Sound.boop(); this.addShake(3); p.mood = 'hurt'; p.moodT = 0.4; return; }
    if (this.shield) {
      this.shield = false; p.inv = 1.2; Sound.pop(); this.fx.ring(p.x, p.y, '#7cf0c0', 90, 0.4, 6);
      this.fx.burst(p.x, p.y, 18, ['#7cf0c0', '#ffffff'], { max: 260 });
      return;
    }

    this.chain = 0; this.chainT = 0; this.run.hits++;
    Sound.hurt(); buzz(70); this.addShake(12); this.flash = 0.35; this.flashCol = '#ff9fbf';
    this.fx.burst(p.x, p.y - p.r, 10, '#ffe680', { kind: 'star', min: 40, max: 140 });
    if (p.hearts <= 0) { this.dying = 1.4; Sound.aww(); this.p.mood = 'hurt'; this.p.moodT = 99; }
  }
  revive() {
    const p = this.p;

    }
    this.fx.ring(p.x, p.y, '#ffe066', 340, 0.8, 14);
    this.fx.confetti(p.x, p.y, 40);
    Sound.power();
  }

  // ----- per-type behaviour -----
  updateEnts(dt) {
    const p = this.p, es = this.pw.slow > 0 ? 0.4 : 1, W = this.W, H = this.H, B = this.bottom;
    const calm = this.mode === 'demo' || this.mode === 'chill' || this.mode === 'tutorial';
    for (const e of this.ents) {
      if (e.dead) continue;
      e.t += dt; e.spawn = Math.max(0, e.spawn - dt);
      const lx = p.x - e.x, ly = p.y - e.y, ld = Math.hypot(lx, ly) || 1;
      e.lookX = lx / ld; e.lookY = ly / ld;
      switch (e.type) {
        case 'star': {
          e.rot += e.vr * dt;
          const k = Math.exp(-2.2 * dt);
          e.vx = e.vx * k + e.dx * (1 - k); e.vy = e.vy * k + e.dy * (1 - k);
          e.x += e.vx * dt; e.y += (e.vy + Math.sin(e.t * 2 + e.ph) * 8) * dt;
          if (e.x < e.r) { e.x = e.r; e.vx = Math.abs(e.vx); e.dx = Math.abs(e.dx); }
          if (e.x > W - e.r) { e.x = W - e.r; e.vx = -Math.abs(e.vx); e.dx = -Math.abs(e.dx); }
          if (e.fall) { if (e.y > H + 30) e.dead = true; } // Star Shower stars fall right through
          else {
            if (e.y < e.r) { e.y = e.r; e.vy = Math.abs(e.vy); e.dy = Math.abs(e.dy); }

        }
        case 'gloomy': {
          e.stun = Math.max(0, e.stun - dt);
          let ang;
          if (calm) { e.wander = (e.wander == null ? rand(0, TAU) : e.wander) + Math.sin(e.t * 0.7 + e.ph) * dt; ang = e.wander; }
          else ang = Math.atan2(ly, lx) + Math.sin(e.t * 1.3 + e.ph) * 0.6;
          if (e.group) {
            const g = e.group, gx = g.x - e.x, gy = g.y - e.y, gd = Math.hypot(gx, gy);
            if (gd > 34) ang = Math.atan2(gy + Math.sin(ang) * gd, gx + Math.cos(ang) * gd);

          }
          const sp = e.spd * (e.stun > 0 ? 0.15 : 1), k = Math.min(1, dt * (e.stun > 0 ? 0.8 : 1.8));
          e.vx += (Math.cos(ang) * sp - e.vx) * k; e.vy += (Math.sin(ang) * sp - e.vy) * k;
          e.x += e.vx * dt * es; e.y += e.vy * dt * es;
          if (e.inside) {
            // once on screen, a Gloomy stays on screen: it bounces off the edges
            let hit = true;
            if (e.x < e.r) { e.x = e.r; e.vx = Math.abs(e.vx); }
            else if (e.x > W - e.r) { e.x = W - e.r; e.vx = -Math.abs(e.vx); }
            else if (e.y < e.r) { e.y = e.r; e.vy = Math.abs(e.vy); }
            else if (e.y > B - e.r) { e.y = B - e.r; e.vy = -Math.abs(e.vy); }
            else hit = false;
            if (hit && calm) e.wander = Math.atan2(e.vy, e.vx);
          }
          break;
        }
        case 'prickle': {
          e.x += e.vx * dt * es; e.y += e.vy * dt * es;
          if (e.entering) { if (e.x > e.r && e.x < W - e.r && e.y > e.r && e.y < B - e.r) e.entering = false; }
          else {
            if (e.x < e.r) { e.x = e.r; e.vx = Math.abs(e.vx); }
            if (e.x > W - e.r) { e.x = W - e.r; e.vx = -Math.abs(e.vx); }
            if (e.y < e.r) { e.y = e.r; e.vy = Math.abs(e.vy); }
            if (e.y > B - e.r) { e.y = B - e.r; e.vy = -Math.abs(e.vy); }
          }
          break;
        }
        case 'zipper': this.updateZipper(e, dt * es); break;
        case 'boss': this.updateBoss(e, dt * es); break;
        case 'power':
          e.y += Math.sin(e.t * 1.6 + e.ph) * 14 * dt; e.x += Math.cos(e.t * 1.1 + e.ph) * 10 * dt;
          if (e.t > e.life) e.dead = true;
          break;
        case 'drop':
          e.x += e.vx * dt * es; e.y += e.vy * dt * es;
          if (e.y > H + 30) e.dead = true;
          break;
        case 'bolt': case 'needle': case 'bubble': case 'rock': case 'pebble': this.updateShot(e, dt * es); break;
        case 'comet':
          e.x += e.vx * dt * es; e.y = e.y0 + Math.sin(e.t * 1.6) * 50;
          e.trail.push({ x: e.x, y: e.y });
          if (e.trail.length > 26) e.trail.shift();
          if (e.t > 1 && (e.x < -90 || e.x > W + 90)) e.dead = true;
          break;
        case 'sunny': case 'dande':
          e.y -= 55 * dt; e.x += Math.sin(e.t * 2 + e.ph) * 24 * dt;
          if (e.t > e.life) e.dead = true;
          break;
      }
    }
    // keep Gloomies from piling on top of each other
    const gl = this.ents.filter((e) => !e.dead && e.type === 'gloomy');
    for (let i = 0; i < gl.length; i++) for (let j = i + 1; j < gl.length; j++) {
      const a = gl[i], b = gl[j], min = (a.r + b.r) * 0.85, dd = d2(a.x, a.y, b.x, b.y);
      if (dd < min * min && dd > 0.01) {
        const d = Math.sqrt(dd), push = (min - d) / 2, ux = (b.x - a.x) / d, uy = (b.y - a.y) / d;
        a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push;
      }
    }
    // mini-Gloomy groups move as a flock
    const groups = new Map();
    for (const e of gl) if (e.group) { const g = groups.get(e.group) || { n: 0, x: 0, y: 0 }; g.n++; g.x += e.x; g.y += e.y; groups.set(e.group, g); }
    for (const [grp, g] of groups) { grp.x = g.x / g.n; grp.y = g.y / g.n; }
  }
  updateZipper(e, dt) {
    const p = this.p;
    e.stateT -= dt;
    if (e.state === 'enter') {
      const dx = e.tx - e.x, dy = e.ty - e.y, d = Math.hypot(dx, dy);
      if (d < 8) this.aimZipper(e);
      else { e.x += (dx / d) * 200 * dt; e.y += (dy / d) * 200 * dt; }
    } else if (e.state === 'aim') {
      e.charge = clamp(1 - e.stateT / 0.95, 0, 1);
      if (e.stateT <= 0) { e.state = 'dash'; e.dashLeft = 640; Sound.zap(); }
    } else if (e.state === 'dash') {
      const step = 980 * dt;
      e.x += e.ux * step; e.y += e.uy * step; e.dashLeft -= step; e.charge = 0;
      if (Math.random() < 0.6) this.fx.burst(e.x, e.y, 1, '#ffe14d', { min: 10, max: 40 });
      const out = e.x < e.r || e.x > this.W - e.r || e.y < e.r || e.y > this.bottom - e.r;
      if (e.dashLeft <= 0 || out) {
        e.x = clamp(e.x, e.r, this.W - e.r); e.y = clamp(e.y, e.r, this.bottom - e.r);
        e.state = 'rest'; e.stateT = this.lv ? 2.4 : 1.6; e.dashes++;
      }
    } else if (e.state === 'rest') {
      if (e.stateT <= 0) {
        if (e.dashes >= 3) { e.state = 'leave'; const a = Math.atan2(e.y - this.H / 2, e.x - this.W / 2); e.ux = Math.cos(a); e.uy = Math.sin(a); }
        else this.aimZipper(e);
      }
    } else if (e.state === 'leave') {
      e.x += e.ux * 260 * dt; e.y += e.uy * 260 * dt;
      if (e.x < -80 || e.x > this.W + 80 || e.y < -80 || e.y > this.H + 80) e.dead = true;
    }
    e.hurts = e.state === 'aim' || e.state === 'dash';
    void p;
  }
  aimZipper(e) {
    const p = this.p, dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    e.state = 'aim'; e.stateT = 0.95; e.ux = dx / d; e.uy = dy / d;
    Sound.zapCharge();
  }

  // ----- one frame of collisions -----
  collide(ox, oy) {
    const p = this.p, tr = p.trail, magnet = this.pw.magnet > 0 ? 18 : 0;
    for (const e of this.ents) {
      if (e.dead) continue;
      if (e.type === 'star' || e.type === 'power') {
        const r = p.r + e.r + 4 + magnet;
        if (d2(e.x, e.y, p.x, p.y) < r * r && this.dying <= 0) e.type === 'star' ? this.collectStar(e, true) : this.collectPower(e);
        continue;
      }
      if (e.type === 'prickle' && tr.length > 1) {
        const rr = e.r * 0.9 * e.r * 0.9;
        for (let i = tr.length - 2; i >= 0; i--) {
          if (distSeg2(e.x, e.y, tr[i].x, tr[i].y, tr[i + 1].x, tr[i + 1].y) < rr) {
            const cut = tr.splice(0, i + 1);
            for (let k = 0; k < cut.length; k += 3) this.fx.burst(cut[k].x, cut[k].y, 1, '#ffffff', { min: 10, max: 60, grav: 200 });
            this.fx.burst(e.x, e.y, 10, '#ff8fbd', { kind: 'star', max: 160 });
            this.recalcLen(); Sound.snip();
            if (this.tut) this.tut.onSnip();
            break;
          }
        }
      }
      if (e.type === 'boss') { this.bumpBoss(e); continue; }
      if (e.type === 'bolt') {
        // a lightning strike fills its whole column
        if (e.strike > 0 && this.dying <= 0 && Math.abs(p.x - e.x) < e.w / 2 + p.r * 0.6) this.hurt({ type: 'bolt', x: e.x, y: p.y + 1 });
        continue;
      }
      if (!e.hurts || e.spawn > 0 || this.dying > 0) continue;
      const hr = p.r * 0.8 + e.r * 0.85;
      if (distSeg2(e.x, e.y, ox, oy, p.x, p.y) < hr * hr) this.hurt(e);
    }
  }
}

// ===== world2.js =====
// ---------- the play world, part 2: spawning, the Big Gloom, update and drawing ----------
Object.assign(World.prototype, {
  stageLen() { return this.lv ? this.lv.time || 60 : this.stage === 0 ? 40 : 50; },
  // difficulty: Adventure levels are gentler than the endless run, which keeps getting harder
  diff() { const f = Math.min(1, this.stageT / this.stageLen()); return this.lv ? this.lv.d0 + 0.6 * f : this.stage + f; },

  // ----- where things appear -----
  edgePoint(m) {
    const W = this.W, H = this.H, u = Math.random() * 2 * (W + H);
    if (u < W) return { x: u, y: -m };
    if (u < 2 * W) return { x: u - W, y: H + m };
    if (u < 2 * W + H) return { x: -m, y: u - 2 * W };
    return { x: W + m, y: u - 2 * W - H };
  },
  farEdgePoint(m) {
    let best = null, bd = -1;
    for (let i = 0; i < 5; i++) { const q = this.edgePoint(m), d = d2(q.x, q.y, this.p.x, this.p.y); if (d > bd) { bd = d; best = q; } }
    return best;
  },
  openSpot(margin, awayFromPlayer) {
    let x = 0, y = 0;
    for (let i = 0; i < 10; i++) {
      x = rand(margin, this.W - margin); y = rand(margin + 40, this.bottom - margin);
      if (d2(x, y, this.p.x, this.p.y) < awayFromPlayer * awayFromPlayer) continue;
      let ok = true;
      for (const e of this.ents) if (!e.dead && e.type === 'star' && d2(x, y, e.x, e.y) < 70 * 70) { ok = false; break; }
      if (ok) break;
    }
    return { x, y };
  },
  spawnStar(x, y, o = {}) {
    if (x == null) ({ x, y } = this.openSpot(40, 110));
    const luck = this.mode === 'demo' ? 0.1 : this.lv && this.lv.goal === 'gold' ? 0.2 : 0.06 + 0.025 * Save.data.upg.luck;
    const gold = o.gold != null ? o.gold : Math.random() < luck;
    return this.add('star', Object.assign({ x, y, r: gold ? 17 : 13, gold, col: gold ? '#ffd84d' : pick(STAR_COLS), rot: rand(0, TAU), vr: rand(-1.5, 1.5),
      dx: rand(-14, 14), dy: rand(-10, 10), life: rand(13, 16) }, o));
  },
  spawnCluster() {
    const u = Math.random(), n = this.lv && this.lv.goal === 'big' ? randi(3, 6) : u < 0.25 ? 1 : u < 0.5 ? 2 : u < 0.8 ? 3 : randi(4, 5);
    const c = this.openSpot(90, 160);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + rand(-0.3, 0.3), rr = n === 1 ? 0 : rand(26, 50);
      this.spawnStar(clamp(c.x + Math.cos(a) * rr, 20, this.W - 20), clamp(c.y + Math.sin(a) * rr, 20, this.H - 20), { spawn: 0.35 + i * 0.08 });
    }
  },
  spawnGloomy(kind) {
    const q = this.farEdgePoint(50), D = this.diff(), calm = !this.hearty;
    const spd = calm ? 34 : this.lv ? Math.min(100, (kind === 'big' ? 34 : 44) + D * 8) : Math.min(125, (kind === 'big' ? 38 : 52) + D * 9);
    return this.add('gloomy', { kind, x: q.x, y: q.y, r: kind === 'big' ? 38 : 24, spd, hurts: true, spawn: 0 });
  },
  spawnMinis(n, at) {
    const q = at || this.farEdgePoint(60), D = this.diff(), group = { x: q.x, y: q.y };
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      this.add('gloomy', { kind: 'mini', r: 15, x: q.x + Math.cos(a) * 24, y: q.y + Math.sin(a) * 24, group, hurts: true, spawn: at ? 0.3 : 0,
        spd: this.lv ? Math.min(110, 56 + D * 7) : this.hearty ? Math.min(140, 66 + D * 8) : 40 });
    }
  },
  spawnPrickle() {
    const q = this.farEdgePoint(30), D = this.diff();
    const tx = rand(this.W * 0.25, this.W * 0.75), ty = rand(this.H * 0.25, this.H * 0.75), d = Math.hypot(tx - q.x, ty - q.y) || 1;
    const sp = this.lv ? 85 + D * 8 : this.hearty ? Math.min(230, 120 + D * 12) : 90;
    this.add('prickle', { x: q.x, y: q.y, r: 20, vx: ((tx - q.x) / d) * sp, vy: ((ty - q.y) / d) * sp, entering: true, hurts: true, spawn: 0 });
  },
  spawnZipper() {
    const q = this.farEdgePoint(40);
    this.add('zipper', { x: q.x, y: q.y, r: 17, state: 'enter', tx: rand(this.W * 0.15, this.W * 0.85), ty: rand(this.H * 0.15, this.bottom - this.H * 0.15),
      dashes: 0, stateT: 0, charge: 0, ux: 0, uy: 0, hurts: false, spawn: 0 });
  },
  spawnPower(x, y) {
    const p = this.p, arcade = this.hearty;
    const w = { heart: arcade && p.hearts < p.maxHearts ? (p.hearts === 1 ? 4 : 1.2) : 0, magnet: 2, tail: 2, shield: arcade ? 2 : 0, slow: arcade ? 1.4 : 0.5, rainbow: 1, double: 2 };
    let sum = 0; for (const k in w) sum += w[k];
    let u = Math.random() * sum, kind = 'magnet';
    for (const k in w) { u -= w[k]; if (u <= 0) { kind = k; break; } }
    if (x == null) ({ x, y } = this.openSpot(60, 150));
    this.add('power', { kind, x, y, r: 24, life: 11, spawn: 0.4 });
  },
  spawnComet() {
    const left = Math.random() < 0.5, y0 = rand(this.H * 0.18, Math.max(this.H * 0.2, Math.min(this.H * 0.5, this.bottom - 120)));
    this.add('comet', { x: left ? -60 : this.W + 60, y: y0, y0, vx: ((left ? 1 : -1) * this.W) / rand(5, 6.5), r: 20, trail: [], spawn: 0 });
    this.fx.text(this.W / 2, this.H * 0.17, 'A Rainbow Comet! Loop it!', { size: 22, col: '#fff6c2', life: 2.2, vy: 0 });
    Sound.whoosh();
  },
  startShower() {
    this.showerT = 5; this.showerSpawn = 0; this.showerId++; this.showerCaught = 0;
    this.banner = { title: 'Star Shower!', sub: 'Loop the falling stars', t: 0 };
    Sound.chime();
  },

  // ----- the spawn director -----
  director(dt) {
    const T = this.timers;
    for (const k in T) T[k] -= dt;
    if (this.mode === 'demo') {
      if (T.star <= 0) { T.star = 0.8; if (this.count('star') < 10) this.spawnCluster(); }
      if (T.gloom <= 0) { T.gloom = 5; if (this.count('gloomy') < 2) this.spawnGloomy('gloomy'); }
      return;
    }
    if (this.mode === 'tutorial' || this.result) return;
    const D = this.diff(), chill = this.mode === 'chill', fever = this.feverT > 0, L = this.lv;
    if (T.star <= 0) { T.star = fever ? rand(0.15, 0.3) : rand(0.45, 1.0); if (this.count('star') < 7 + Math.min(7, D * 1.5) + (fever ? 8 : 0)) this.spawnCluster(); }
    if (T.power <= 0) { T.power = rand(13, 19); if (!this.count('power')) this.spawnPower(); }
    if (chill && this.stageT >= 60) this.nextStage();
    if (this.boss || this.stageClearT > 0) return;
    // an Adventure boss level is just the boss, which arrives after a moment
    if (L && L.boss) { if (this.stageT >= 2.5) this.spawnBoss(L.boss); return; }
    if (L && L.goal === 'prickle') { T.prickle = Math.min(T.prickle, 7); if (this.count('prickle') < 2 && T.prickle <= 0) { T.prickle = 7; this.spawnPrickle(); } }
    if (L && L.goal === 'zipper') { T.zipper = Math.min(T.zipper, 8); if (this.count('zipper') < 2 && T.zipper <= 0) { T.zipper = 8; this.spawnZipper(); } }
    if (T.shower <= 0) { T.shower = chill ? rand(30, 40) : rand(40, 55); this.startShower(); }
    if (T.comet <= 0) { T.comet = rand(45, 70); if (!this.count('comet') && Math.random() < 0.75) this.spawnComet(); }
    if (this.breather > 0) { this.breather -= dt; return; }
    const gl = this.count('gloomy');
    if (T.gloom <= 0) {
      T.gloom = chill ? rand(4, 6) : Math.max(1.2, rand(2.6, 3.6) - D * 0.25);
      if (gl < (chill ? 3 : Math.min(9, 1 + Math.floor(D * 1.6) + (L && L.goal === 'cheer' ? 2 : 0)))) this.spawnGloomy('gloomy');
    }
    if (D >= 0.9 && T.mini <= 0) { T.mini = rand(16, 24) - Math.min(8, D * 1.5); if (gl < 10) this.spawnMinis(randi(3, 3 + Math.min(3, Math.floor(D)))); }
    if (D >= 2 && T.big <= 0) { T.big = rand(14, 20); if (this.count('gloomy', 'big') < 1 + Math.floor(D / 3)) this.spawnGloomy('big'); }
    if (T.prickle <= 0) { T.prickle = rand(14, 20) - Math.min(6, D); if (this.count('prickle') < Math.min(4, Math.floor(0.6 + D * 0.7))) this.spawnPrickle(); }
    if (D >= 1 && T.zipper <= 0) { T.zipper = rand(10, 15) - Math.min(5, D); if (this.count('zipper') < Math.min(3, Math.floor(D * 0.7))) this.spawnZipper(); }
    if (this.mode === 'arcade' && this.stageT >= this.stageLen()) this.spawnBoss();
  },

  nextStage() {
    this.stage++; this.stageT = 0; this.breather = 3;
    Sky.set(this.stage);
    const info = stageInfo(this.stage), lap = Math.floor(this.stage / STAGES.length);
    this.banner = { title: info.name + (lap ? ' ' + 'I'.repeat(Math.min(lap + 1, 3)) : ''), sub: 'Stage ' + (this.stage + 1), t: 0 };
    Music.play(this.mode === 'chill' ? 'chill' : 'play', this.stage);
    Sound.jingle();
    this.zoneSticker();
    if (this.scored) Save.data.stats.maxStage = Math.max(Save.data.stats.maxStage, this.stage + 1);
  },
  zoneSticker() { const id = ZONE_STICKERS[this.stage % STAGES.length]; if (id) this.sticker(id); },

  // ----- one frame -----
  update(dt) {
    if (this.hitStop > 0) { this.hitStop -= dt; dt *= 0.1; }
    if (this.dying > 0) { this.dying -= dt; dt *= 0.35; if (this.dying <= 0) { this.dying = 0; this.over = true; } }
    if (this.over) dt *= 0.2;
    this.t += dt;
    if (this.scored && !this.over && this.dying <= 0) {
      const before = Math.floor(this.run.time);
      this.run.time += dt;
      if (Math.floor(this.run.time) !== before) this.ev('time', this.run.time);
    }
    this.pickT -= dt;
    if (this.chainT > 0) { this.chainT -= dt; if (this.chainT <= 0) this.chain = 0; }
    for (const k in this.pw) if (this.pw[k] > 0) { this.pw[k] -= dt; if (this.pw[k] <= 0) { this.pw[k] = 0; if (k === 'slow') Sound.muffle(false); } }
    if (this.feverT > 0) {
      this.feverT -= dt; this.fever = Math.max(0, this.feverT / 8);
      if (this.feverT <= 0) {
        this.feverT = 0; this.fever = 0;
        if (this.scored) Music.play(this.boss ? 'boss' : this.mode === 'chill' ? 'chill' : 'play', this.stage);
      }
    }
    if (this.showerT > 0) {
      this.showerT -= dt; this.showerSpawn -= dt;
      if (this.showerSpawn <= 0) {
        this.showerSpawn = 0.11;
        const vx = rand(-50, 50), vy = rand(150, 210);
        this.spawnStar(rand(20, this.W - 20), -20, { fall: true, shower: this.showerId, vx, vy, dx: vx, dy: vy, life: 99, spawn: 0.1, gold: Math.random() < 0.15 });
      }
    }
    this.heartPop = Math.max(0, this.heartPop - dt * 3); this.scorePop = Math.max(0, this.scorePop - dt * 4);
    this.shake *= Math.exp(-dt * 9); this.flash = Math.max(0, this.flash - dt * 1.6);
    if (this.stageClearT > 0) { this.stageClearT -= dt; if (this.stageClearT <= 0) this.lv ? Levels.win(this) : this.nextStage(); }
    else if (!this.boss && this.scored && this.dying <= 0) this.stageT += dt;
    if (this.lv) {
      // Adventure levels: a goal level runs against the clock; running out of hearts ends any level
      if (this.result) this.resultT += dt;
      else if (this.lv.time && this.dying <= 0 && (this.timeLeft -= dt) <= 0) { this.timeLeft = 0; Levels.fail(this, 'time'); }
    }
    this.director(dt);
    const [ox, oy] = this.updatePlayer(dt);
    this.updateTrail();
    this.updateEnts(dt);
    this.collide(ox, oy);
    if (this.tut) this.tut.update(dt);
    let j = 0;
    for (const e of this.ents) if (!e.dead) this.ents[j++] = e;
    this.ents.length = j;
    this.fx.update(dt);
    if (this.banner) { this.banner.t += dt; if (this.banner.t > 3) this.banner = null; }
    this.shownScore += (this.score - this.shownScore) * Math.min(1, dt * 10);
    if (this.score - this.shownScore < 1) this.shownScore = this.score;
  },

  draw(ctx) {
    const t = this.t, p = this.p;
    this.fx.drawUnder(ctx);
    for (const e of this.ents) {
      const s = e.spawn > 0 ? Math.max(0.01, easeOutBack(1 - e.spawn / 0.35)) : 1;
      if (e.type === 'sunny') drawSunny(ctx, e.x, e.y, e.r * (1 + e.t * 0.15), t, 1 - e.t / e.life);
      else if (e.type === 'dande') drawDandelion(ctx, e.x, e.y, e.r, t, 1 - e.t / e.life);
      else if (e.type === 'star') {
        const left = e.life - e.t;
        ctx.globalAlpha = left < 2 ? (Math.sin(e.t * 22) > 0 ? 0.9 : 0.35) : 1;
        drawStar(ctx, e.x, e.y, e.r * s * (1 + Math.sin(t * 4 + e.ph) * 0.06), e.rot, e.col, e.gold);
        ctx.globalAlpha = 1;
      } else if (e.type === 'power') drawBubble(ctx, e.x, e.y, e.r * s, e.kind, t, e.life - e.t < 2.5 ? (Math.sin(e.t * 18) > 0 ? 1 : 0.4) : 1);
      else if (e.type === 'comet') drawComet(ctx, e.x, e.y, e.r, e.trail, t);
      else if (e.type === 'bolt') drawBolt(ctx, e, this.bottom, t);
      else if (e.type === 'boss') this.drawBossUnder(ctx, e);
    }
    if (this.tut) this.tut.draw(ctx);

  // ----- heads-up display, in screen units -----
  drawHUD(ctx, sw, sh, top) {

    ctx.strokeText(label, sw / 2, top + 30); ctx.fillStyle = '#fff8ec'; ctx.fillText(label, sw / 2, top + 30);
    if (this.pw.double > 0) { ctx.font = `900 16px ${FONT}`; ctx.fillStyle = '#ffe066'; ctx.fillText('x2', sw / 2 + ctx.measureText(label).width / 2 + 30, top + 30); }
    const note = (txt, y, col = '#fff8ec') => {
      ctx.font = `800 13px ${FONT}`; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(20,10,50,.75)';
      ctx.strokeText(txt, sw / 2, y); ctx.fillStyle = col; ctx.fillText(txt, sw / 2, y);
    };
    let labelled = false;
    if (this.scored) {
      const bw = Math.min(180, sw * 0.4), bx = sw / 2 - bw / 2, by = top + 58;
      ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(bx, by, bw, 6);

        const b = this.boss;

        ctx.fillStyle = '#7ff0c4'; ctx.fillRect(bx, by, bw * Math.min(1, L.prog / L.target), 6);
        note(Levels.progressText(L), by + 20); labelled = true;
      } else if (!this.lv) {
        const f = this.mode === 'chill' ? Math.min(1, this.stageT / 60) : Math.min(1, this.stageT / this.stageLen());
        ctx.fillStyle = '#b9a2ff'; ctx.fillRect(bx, by, bw * f, 6);

      ctx.font = `900 ${low ? 20 + Math.max(0, Math.sin(t * 10)) * 3 : 20}px ${FONT}`; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,10,50,.75)';
      const txt = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
      ctx.strokeText(txt, sw - 36, top + 80); ctx.fillStyle = low ? '#ff8fbd' : '#fff8ec'; ctx.fillText(txt, sw - 36, top + 80);
    }
    if (this.chain >= 2 && this.chainT > 0) {
      const cy = labelled ? top + 104 : top + 84;
      ctx.font = `900 18px ${FONT}`; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(20,10,50,.75)';
      ctx.strokeText('Chain x' + this.chain, sw / 2, cy); ctx.fillStyle = '#9ff5d6'; ctx.fillText('Chain x' + this.chain, sw / 2, cy);
      ctx.fillStyle = 'rgba(159,245,214,.7)'; ctx.fillRect(sw / 2 - 40, cy + 12, 80 * (this.chainT / CHAIN_WINDOW), 3);
    }
    if (this.feverT > 0) {
      ctx.lineWidth = 12; ctx.strokeStyle = hsl(Math.round(t * 240) % 360, 95, 65, 0.35 + Math.sin(t * 10) * 0.1);
      ctx.strokeRect(6, 6, sw - 12, sh - 12);
    }
    if (this.banner) {
      const b = this.banner, f = b.t < 0.4 ? easeOutBack(b.t / 0.4) : 1, a = b.t > 2.4 ? Math.max(0, 1 - (b.t - 2.4) / 0.6) : 1;
      ctx.globalAlpha = a;
      ctx.font = `900 ${Math.max(1, 40 * f)}px ${FONT}`; ctx.lineWidth = 9;
      ctx.strokeText(b.title, sw / 2, sh * 0.42); ctx.fillStyle = '#ffe066'; ctx.fillText(b.title, sw / 2, sh * 0.42);
      ctx.font = `800 18px ${FONT}`; ctx.lineWidth = 5;
      ctx.strokeText(b.sub, sw / 2, sh * 0.42 + 40); ctx.fillStyle = '#fff8ec'; ctx.fillText(b.sub, sw / 2, sh * 0.42 + 40);
      ctx.globalAlpha = 1;
    }
    if (this.flash > 0) { ctx.globalAlpha = this.flash * 0.6; ctx.fillStyle = this.flashCol; ctx.fillRect(0, 0, sw, sh); ctx.globalAlpha = 1; }
  },
